function saveSubBill() {
    if (!checkStrictDates(['sbDate'])) return;
    let date = document.getElementById('sbDate').value, location = document.getElementById('sbLocation').value.trim(), billNo = document.getElementById('sbBillNo').value.trim(), poNo = document.getElementById('sbPoNo').value.trim(), period = document.getElementById('sbPeriod').value.trim(), amount = document.getElementById('sbAmount').value;
    if (!location || !billNo || !amount) return alert("Location, Bill No. and Amount required!");
    let billType = detectSubBillType(billNo, period, poNo), btn = document.getElementById('sbSaveBtn'), orig = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;
    appData.submittedBills = getArray(appData.submittedBills);
    if (appData.submittedBills.some(b => String(b.id) !== String(currentSubmittedBillEditId) && b.billNo.toLowerCase() === billNo.toLowerCase())) { btn.innerText = orig; btn.disabled = false; return alert('❌ DUPLICATE BILL NO!'); }
    let nb = { id: currentSubmittedBillEditId || Date.now(), billType, date, location, billNo, poNo, period, amount, isPaid: false };
    if (currentSubmittedBillEditId) { let i = appData.submittedBills.findIndex(b => String(b.id) === String(currentSubmittedBillEditId)); nb.isPaid = appData.submittedBills[i].isPaid; appData.submittedBills[i] = nb; currentSubmittedBillEditId = null; } else appData.submittedBills.unshift(nb);
    if (billType === 'SD Refund' && poNo) { let mp = getArray(appData.poRecords).find(p => poNormKey(p.poNo) === poNormKey(poNo)); if (mp && !mp.sdAppliedDate) mp.sdAppliedDate = date; }
    saveDataToLocal().then(() => showSubmittedBills()).catch(() => { alert("Error saving!"); btn.innerText = orig; btn.disabled = false; });
}
function toggleSubBillStatus(id) {
    let b = getArray(appData.submittedBills).find(x => String(x.id) === String(id)); if (!b) return;
    b.isPaid = !b.isPaid;
    if (b.isPaid && (b.billType || detectSubBillType(b.billNo, b.period, b.poNo)) === 'SD Refund' && b.poNo) {
        let mp = getArray(appData.poRecords).find(p => poNormKey(p.poNo) === poNormKey(b.poNo));
        if (mp && !mp.sdReceived && confirm(`PO Tracker mein bhi "${mp.workDesc || mp.authority} (${mp.poNo})" ka SD Refunded mark kar dein?`)) { mp.sdReceived = true; mp.sdReceivedDate = getTodayISO(); if (!mp.isCompleted) mp.isCompleted = true; }
    }
    saveDataToLocal().then(() => { updatePOTabBadge(); showSubmittedBills(); });
}
function deleteSubBill(id) { if (confirm("Delete this Bill?")) { appData.submittedBills = getArray(appData.submittedBills).filter(x => String(x.id) !== String(id)); saveDataToLocal().then(() => showSubmittedBills()); } }
function editSubBill(id) {
    let b = getArray(appData.submittedBills).find(x => String(x.id) === String(id)); if (!b) return;
    currentSubmittedBillEditId = id; document.getElementById('sbDate').value = b.date || ''; document.getElementById('sbLocation').value = b.location || ''; document.getElementById('sbBillNo').value = b.billNo || ''; document.getElementById('sbPoNo').value = b.poNo || ''; document.getElementById('sbPeriod').value = b.period || ''; document.getElementById('sbAmount').value = b.amount || '';
    let btn = document.getElementById('sbSaveBtn'); if (btn) { btn.innerText = "✏️ Update Record"; btn.style.background = "#d97706"; } window.scrollTo({ top: 0, behavior: 'smooth' });
}

function addBillItem(desc = '', qty = 1, rate = 0) {

    if (q) vl = vl.filter(v => ((v.car || '').toLowerCase().includes(q)) || ((v.category || '').toLowerCase().includes(q)) || ((v.details || '').toLowerCase().includes(q)) || (v.date && formatDate(v.date).toLowerCase().includes(q)) || ((v.amount || '').toString().includes(q)));
    vl.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    tb.innerHTML = vl.map(v => `<tr><td style="white-space:nowrap;">${formatDate(v.date)}</td><td><b>${v.car}</b></td><td>${v.category}</td><td>${v.details}</td><td>👤 ${v.paidBy || 'Tanmoy'}</td><td style="text-align:center;">${(v.photo && v.photo.length > 5) ? `<a href="${v.photo}" target="_blank" style="color:#2980b9;font-size:16px;text-decoration:none;">📷</a>` : '-'}</td><td style="font-weight:bold;color:#e21d4f;">₹${v.amount}</td><td style="white-space:nowrap;"><button onclick="editVehicle('${v.id}')" style="background:#f39c12;padding:4px 6px;border-radius:4px;font-size:12px;color:white;border:none;cursor:pointer;">✏️</button><button onclick="deleteVehicle('${v.id}')" style="background:#444;padding:4px 6px;border-radius:4px;font-size:12px;color:white;border:none;cursor:pointer;margin-left:4px;">🗑️</button></td></tr>`).join('') || `<tr><td colspan="8" style="text-align:center;">No vehicle expenses found!</td></tr>`;
}
async function saveVehicle() {
    if (!checkStrictDates(['vDate'])) return;
    let date = document.getElementById('vDate').value, car = document.getElementById('vCar').value, category = document.getElementById('vCategory').value, details = document.getElementById('vDetails').value.trim(), amount = parseFloat(document.getElementById('vAmount').value), paidBy = document.getElementById('vPaidBy').value, file = document.getElementById('vPhoto').files[0];
    if (isNaN(amount) || amount <= 0) return alert("Valid Amount is required!");
    if (file && !file.type.startsWith('image/')) return alert("Only image files allowed!");
    let btn = document.getElementById('vSaveBtn'), orig = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;
    try {
        appData.vehicles = getArray(appData.vehicles); appData.records[paidBy] = getArray(appData.records[paidBy]);
        let ex = currentVehicleEditId ? appData.vehicles.find(v => String(v.id) === String(currentVehicleEditId)) : null, photoUrl = (ex && ex.photo) || '';
        if (file) photoUrl = await uploadToImgBB(await compressImage(file), 'Veh_' + Date.now() + '.jpg');
        let fd = details || '-';
        if (appData.vehicles.some(v => String(v.id) !== String(currentVehicleEditId) && v.date === date && v.amount === amount && v.car === car && v.category === category && (v.details || '-') === fd)) { btn.innerText = orig; btn.disabled = false; return alert("❌ DUPLICATE ENTRY!"); }
        let ne = { id: currentVehicleEditId || Date.now(), date, car, category, details: fd, amount, photo: photoUrl, paidBy }, pDesc = details ? `🚗 ${car} - ${category} (${details})` : `🚗 ${car} - ${category}`;
        if (currentVehicleEditId) { let ov = appData.vehicles.find(v => String(v.id) === String(currentVehicleEditId)); if (ov) { appData.balances[ov.paidBy] += ov.amount; appData.records[ov.paidBy] = getArray(appData.records[ov.paidBy]).filter(r => String(r.id) !== String(currentVehicleEditId)); } appData.vehicles[appData.vehicles.findIndex(v => String(v.id) === String(currentVehicleEditId))] = ne; currentVehicleEditId = null; } else appData.vehicles.unshift(ne);
        if (!appData.balances[paidBy]) appData.balances[paidBy] = 0; appData.balances[paidBy] -= amount;
        appData.records[paidBy].unshift({ id: ne.id, date, details: pDesc, amount, type: 'expense', photo: photoUrl, link: '', isAuto: true, reconState: 0 });
        window.lastSelectedDate = date; await saveDataToLocal(); showVehicles();
    } catch (e) { alert("Error saving."); btn.innerText = orig; btn.disabled = false; }
}
function deleteVehicle(id) { if (confirm("Delete this vehicle expense?")) { let ov = getArray(appData.vehicles).find(x => String(x.id) === String(id)); if (ov) { appData.balances[ov.paidBy] += ov.amount; appData.records[ov.paidBy] = getArray(appData.records[ov.paidBy]).filter(r => String(r.id) !== String(id)); appData.vehicles = getArray(appData.vehicles).filter(x => String(x.id) !== String(id)); saveDataToLocal().then(() => showVehicles()); } } }
function editVehicle(id) { let v = getArray(appData.vehicles).find(x => String(x.id) === String(id)); if (!v) return; currentVehicleEditId = id; document.getElementById('vDate').value = v.date || ''; document.getElementById('vCar').value = v.car || 'Tcl car'; document.getElementById('vCategory').value = v.category || ''; document.getElementById('vDetails').value = (v.details === '-' ? '' : v.details || ''); document.getElementById('vAmount').value = v.amount || ''; if (document.getElementById('vPaidBy')) document.getElementById('vPaidBy').value = v.paidBy || 'Tanmoy'; let b = document.getElementById('vSaveBtn'); if (b) { b.innerText = "✏️ Update Expense"; b.style.background = "#f39c12"; } window.scrollTo({ top: 0 }); }

injectPOResponsiveCSS();
injectPOCompactCSS();
scanStrictDates();
</script>
