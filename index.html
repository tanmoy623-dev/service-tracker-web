<html lang="en">
<head>

<title>Service Tracker</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --emerald: #059669;
  --emerald-hover: #047857;
  --rose: #e11d48;
  --purple: #7c3aed;
  --amber: #d97706;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-500: #64748b;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.07);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden; /* CRITICAL: Prevents any horizontal page blowout */
}

body {
  font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  background-color: #f8fafc;
  background-image: 
    radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
    radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.10) 0px, transparent 50%),
    radial-gradient(at 50% 50%, rgba(244, 63, 94, 0.05) 0px, transparent 50%),
    radial-gradient(at 0% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
    radial-gradient(rgba(148, 163, 184, 0.18) 1.2px, transparent 1.2px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 24px 24px;
  background-attachment: fixed;
  color: var(--slate-800);
  line-height: 1.5;
  position: relative;
  min-height: 100vh;
}

/* Background Ambient Orbs */
.bg-decorations {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  overflow: hidden; pointer-events: none; z-index: -1;
}
.bg-orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; }
.bg-orb-1 { width: 500px; height: 500px; background: rgba(99, 102, 241, 0.3); top: -100px; left: -100px; }
.bg-orb-2 { width: 450px; height: 450px; background: rgba(16, 185, 129, 0.25); top: 100px; right: -100px; }
.bg-orb-3 { width: 550px; height: 550px; background: rgba(236, 72, 153, 0.2); bottom: -150px; left: 30%; }

.app {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px;
  width: 100%;
  box-sizing: border-box;
}

/* Glassmorphism Cards */
.card {
  background: rgba(255, 255, 255, 0.90);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 24px;
  border-radius: var(--radius-lg);
  margin: 18px 0;
  box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.9);
  width: 100%;
  box-sizing: border-box;
  overflow: hidden; /* CRITICAL: Never let child tables spill out into the background! */
}

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

/* DUAL GRID: Income and Expense Side-by-Side */
.dual-records-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  width: 100%;
  box-sizing: border-box;
}

.dual-records-grid > div {
  min-width: 0;
  width: 100%;
  box-sizing: border-box;
  background: #ffffff;
  border-radius: var(--radius-md);
  border: 1px solid var(--slate-200);
  padding: 16px;
  box-shadow: var(--shadow-xs);
  overflow: hidden;
}

#profTable {
  width: 100%;
  box-sizing: border-box;
}

/* Tables Styling */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

th {
  background: var(--slate-50);
  color: var(--slate-500);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 10px 8px;
  border-bottom: 1.5px solid var(--slate-200);
  text-align: left;
}

td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--slate-100);
  font-size: 13px;
  color: var(--slate-700);
  vertical-align: middle;
}

tbody tr:hover { background-color: #f8fafc; }

/* Amount & Action columns NEVER cut off */
td:nth-child(5), th:nth-child(5) {
  white-space: nowrap !important;
  font-weight: 700;
  text-align: right;
}

td:nth-child(2), th:nth-child(2) {
  white-space: nowrap !important;
  font-size: 11.5px;
}

td:last-child, th:last-child {
  white-space: nowrap !important;
  text-align: center;
}

/* Tabs - Auto Wrap (No Side Scroll) */
.nav-tab-container {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 0 0;
  margin-top: 16px; overflow: visible;
}
.nav-tab {
  flex: 1 1 auto; min-width: 95px; text-align: center;
  padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; border: none; cursor: pointer;
  transition: all 0.15s ease; white-space: nowrap;
}

/* Stats */
.stat {
  background: #ffffff; border: 1px solid var(--slate-200);
  padding: 18px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-xs);
}
.stat span { font-size: 13px; font-weight: 600; color: var(--slate-500); display: block; }
.stat b { display: block; font-size: 26px; font-weight: 800; margin-top: 8px; color: var(--slate-900); }
.positive { color: var(--emerald) !important; font-weight: 800; }
.negative { color: var(--rose) !important; font-weight: 800; }

/* Buttons */
button {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 16px; border: 0; border-radius: var(--radius-sm);
  background: var(--emerald); color: #ffffff; font-family: inherit;
  font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.18s ease;
}
button:hover { background: var(--emerald-hover); }
button.alt { background: var(--slate-100); color: var(--slate-700); border: 1px solid var(--slate-200); }
button:disabled { background: var(--slate-300) !important; cursor: not-allowed; }

/* Inputs */
label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--slate-600); margin-bottom: 6px; display: block; }
input, select {
  width: 100%; padding: 10px 14px; margin: 4px 0 14px;
  border: 1.5px solid var(--slate-200); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14px; background-color: #ffffff; outline: none;
}
input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }


/* PARTNER BALANCE & ENTRY TYPE GRIDS (MOBILE-RESPONSIVE) */
.partner-bal-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  text-align: center;
}

.entry-type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.entry-type-grid button {
  width: 100%;
  padding: 10px 6px;
  font-size: 13px;
  white-space: nowrap;
  justify-content: center;
}

@media (max-width: 640px) {
  .partner-bal-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .partner-bal-grid .total-cash-box {
    grid-column: 1 / -1;
    order: -1;
    padding: 14px !important;
  }
  .partner-bal-grid .total-cash-box b {
    font-size: 24px !important;
  }
  .entry-type-grid {
    gap: 6px;
  }
  .entry-type-grid button {
    padding: 8px 4px;
    font-size: 11.5px;
    letter-spacing: -0.2px;
  }
}

/* Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

.hidden { display: none !important; }

/* MOBILE RESPONSIVE TUNING - PREVENTS ANY SPILLAGE */
@media (max-width: 768px) {
  html, body {
    overflow-x: hidden !important;
  }
  .app {
    padding: 10px 8px !important;
    width: 100% !important;
    max-width: 100vw !important;
  }
  .card {
    padding: 14px 10px !important;
    margin: 10px 0 !important;
    border-radius: var(--radius-md) !important;
    overflow: hidden !important;
  }
  .dual-records-grid {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
    width: 100% !important;
  }
  .dual-records-grid > div {
    padding: 12px 6px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  /* Table container inside card */
  div[style*="overflow-x:auto"] {
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    padding-bottom: 4px;
  }
  table {
    min-width: 330px !important;
  }
  td, th {
    padding: 6px 3px !important;
    font-size: 11px !important;
  }
  td:nth-child(3) {
    max-width: 100px !important;
    word-break: break-word !important;
    font-size: 11px !important;
  }
  table button {
    padding: 3px 5px !important;
    font-size: 10px !important;
    margin: 1px 0 !important;
  }
  .recon-cell {
    padding: 2px !important;
    font-size: 13px !important;
  }
  .stat {
    padding: 14px 12px !important;
  }
  .stat b {
    font-size: 20px !important;
  }
}

</style>
</head>
<body>

<div class="bg-decorations">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

</div>

<div class="app">

                <span>Logout</span>

            </button>
        </div>
        <div id="content"></div>
    </section>
</div>

<script>

// --- FIREBASE CONFIGURATION ---
const firebaseConfig = { apiKey: "AIzaSyCAhAQcsnGqPTiScGJVbNR57Mbnn9jdfdU", authDomain: "servicetracker-e4887.firebaseapp.com", databaseURL: "https://servicetracker-e4887-default-rtdb.firebaseio.com/", projectId: "servicetracker-e4887", storageBucket: "servicetracker-e4887.firebasestorage.app", messagingSenderId: "64365607107", appId: "1:64365607107:web:12e4da7d9c918ad6f38a76" };
firebase.initializeApp(firebaseConfig); const db = firebase.database(); const IMGBB_API_KEY = "2291e363544930c9291f5bf04d9e9432"; 

let defaultData = { records: { 'Tanmoy': [], 'Tapabrata': [] }, balances: { 'Tanmoy': 0, 'Tapabrata': 0 }, passwords: { 'Tanmoy': '2196', 'Tapabrata': 'tapabrata329', 'Technician': 'tech329' }, computerJobs: [], waterJobs: [], invoiceCount: 314, invoices: [], submittedBills: [], poRecords: [], vehicles: [], signature: '', privateVault: [], privateSalary: [], config: { cfStartMonth: '2026-08', enablePastCF: false } };
let appData = JSON.parse(JSON.stringify(defaultData)); let isFirstLoad = true, currentEditId = null, currentEntryType = 'income'; let currentInvoiceEditId = null, currentTechEditId = null, currentTechEditPhoto = ''; let currentSubmittedBillEditId = null, currentPOEditId = null, currentVehicleEditId = null, currentSalaryEditId = null, currentActiveTab = 'tab-overview'; 

function getArray(data) { if (!data) return []; if (Array.isArray(data)) return data; return Object.values(data); }
function getUniqueOptions(arr1, key1, arr2=[], key2='') { let vals = getArray(arr1).map(x => x[key1]).filter(Boolean); if(arr2.length > 0 && key2) vals = vals.concat(getArray(arr2).map(x => x[key2]).filter(Boolean)); return [...new Set(vals)].sort().map(v => `<option value="${v}">`).join(''); }
function formatDate(dateStr) { if (!dateStr) return ''; let parts = dateStr.split('-'); if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0].slice(-2); return dateStr; }

function compressImage(file) { return new Promise((resolve) => { if(!file) return resolve(''); let reader = new FileReader(); reader.onload = function(event) { let img = new Image(); img.onload = function() { let canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'); let maxW = 800, maxH = 800, w = img.width, h = img.height; if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } } else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } } canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', 0.7)); }; img.onerror = () => resolve(''); img.src = event.target.result; }; reader.onerror = () => resolve(''); reader.readAsDataURL(file); }); }
async function uploadToImgBB(base64Str) { if (!base64Str || !base64Str.startsWith('data:image')) return ''; try { let byteString = atob(base64Str.split(',')[1]); let mimeString = base64Str.split(',')[0].split(':')[1].split(';')[0]; let ab = new ArrayBuffer(byteString.length); let ia = new Uint8Array(ab); for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i); let blob = new Blob([ab], {type: mimeString}); let formData = new FormData(); formData.append("image", blob, "photo.jpg"); let response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData }); let data = await response.json(); return (data && data.success) ? data.data.url : ''; } catch (error) { return ''; } }

const INACTIVITY_TIMEOUT = 20 * 60 * 1000; let inactivityTimer = null;
function resetInactivityTimer() { if (!localStorage.getItem('st_user')) return; localStorage.setItem('st_last_active', Date.now().toString()); if (inactivityTimer) clearTimeout(inactivityTimer); inactivityTimer = setTimeout(() => { alert("⏰ Auto logout."); logoutApp(); }, INACTIVITY_TIMEOUT); }
['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => window.addEventListener(evt, resetInactivityTimer, { passive: true }));

db.ref('ServiceTracker').on('value', (snapshot) => {

    if (data && data.records && data.balances) {
        appData = data; appData.poRecords = getArray(appData.poRecords); appData.submittedBills = getArray(appData.submittedBills); appData.invoices = getArray(appData.invoices); appData.computerJobs = getArray(appData.computerJobs); appData.waterJobs = getArray(appData.waterJobs); appData.vehicles = getArray(appData.vehicles); appData.privateVault = getArray(appData.privateVault); appData.privateSalary = getArray(appData.privateSalary);
        for(let p in appData.records) appData.records[p] = getArray(appData.records[p]);
        if(!appData.passwords) appData.passwords = { 'Tanmoy': '2196', 'Tapabrata': 'tapabrata329', 'Technician': 'tech329' };
        if(!appData.passwords['Technician']) appData.passwords['Technician'] = 'tech329'; 
        if(!appData.invoiceCount) appData.invoiceCount = 314; if(!appData.signature) appData.signature = ''; if(!appData.config) appData.config = { cfStartMonth: '2026-08', enablePastCF: false };
    } else db.ref('ServiceTracker').set(defaultData);
    if(isFirstLoad) {
        isFirstLoad = false; let savedUser = localStorage.getItem('st_user'); let savedRole = localStorage.getItem('st_role'); let lastActive = parseInt(localStorage.getItem('st_last_active') || '0', 10);
        if(savedUser && savedRole) {
            if (lastActive && (Date.now() - lastActive > INACTIVITY_TIMEOUT)) { logoutApp(); return; } resetInactivityTimer(); document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('head').textContent = savedUser + ' Dashboard';
            if(savedRole === 'admin') { document.getElementById('content').innerHTML = admin(); showAdminOverview(); } else { document.getElementById('content').innerHTML = user(); }

async function saveDataToLocal() { await db.ref('ServiceTracker').set(appData); }
async function hashPassword(password) { const encoder = new TextEncoder(); const data = encoder.encode(password); const hash = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join(''); }

async function dropdownPartnerLogin() { let p = document.getElementById('loginPartnerSelect').value; let storedPass = appData.passwords[p] || (p === 'Tanmoy' ? '2196' : 'tapabrata329'); let pass = prompt(`🔐 Enter password for ${p}:`); if(!pass) return; let enteredHash = await hashPassword(pass.trim()); let isMatch = (storedPass.length === 64) ? (enteredHash === storedPass) : (pass.trim() === storedPass.trim()); if (!isMatch) return alert("❌ Incorrect Password!"); localStorage.setItem('st_user', p); localStorage.setItem('st_role', 'admin'); resetInactivityTimer(); document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('head').textContent = p + ' Dashboard'; document.getElementById('content').innerHTML = admin(); showAdminOverview(); }
async function techLoginPrompt() { let storedPass = appData.passwords['Technician'] || 'tech329'; let pass = prompt(`🔐 Enter password for Technician:`); if(!pass) return; let enteredHash = await hashPassword(pass.trim()); let isMatch = (storedPass.length === 64) ? (enteredHash === storedPass) : (pass.trim() === storedPass.trim()); if (!isMatch) return alert("❌ Incorrect Password!"); localStorage.setItem('st_user', 'Technician'); localStorage.setItem('st_role', 'user'); resetInactivityTimer(); document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('head').textContent = 'Technician Dashboard'; document.getElementById('content').innerHTML = user(); }
function logoutApp() { localStorage.removeItem('st_user'); localStorage.removeItem('st_role'); localStorage.removeItem('st_manual_month'); location.reload(); }

// ====== ADMIN SHELL ======
function handleGlobalMonthChange() { localStorage.setItem('st_manual_month', '1'); if (currentActiveTab === 'tab-overview') showAdminOverview(); else if (currentActiveTab === 'tab-tanmoy') partnerProfile('Tanmoy'); else if (currentActiveTab === 'tab-tapabrata') partnerProfile('Tapabrata'); else if (currentActiveTab === 'tab-carry') showCarryForward(); else if (currentActiveTab === 'tab-vehicles') showVehicles(); else if (currentActiveTab === 'tab-private') showPrivateVault(); }
function generateMonthDropdown() {
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const now = new Date();
    const curMName = months[now.getMonth()];
    const curYear = now.getFullYear();
    let options = '<option value="All Time">All Time</option>';
    for (let year = 2026; year <= curYear + 3; year++) {
        options += `<optgroup label="${year}">`;
        months.forEach((month, index) => {
            if (year === 2026 && index < 3) return;
            let sel = (month === curMName && year === curYear) ? "selected" : "";
            options += `<option value="${month} ${year}" ${sel}>${month} ${year}</option>`;
        });
        options += `</optgroup>`;
    }
    return `<select id="headerMonthSelect" style="background:white;color:#17352b;padding:8px 12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;flex-shrink:0;width:auto;margin:0;" onchange="handleGlobalMonthChange()">${options}</select>`;
}
function generateMiniMonthDropdown(currentValue) {
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const now = new Date();
    const curMName = months[now.getMonth()];
    const curYear = now.getFullYear();
    const defaultMonthVal = `${curMName} ${curYear}`;
    const activeVal = currentValue || (document.getElementById('headerMonthSelect') ? document.getElementById('headerMonthSelect').value : defaultMonthVal) || defaultMonthVal;
    
    let options = '<option value="All Time">All Time</option>';
    for (let year = 2026; year <= curYear + 3; year++) {
        months.forEach((month, index) => {
            if (year === 2026 && index < 3) return;
            let val = `${month} ${year}`;
            let sel = (val === activeVal) ? "selected" : "";

    if(hm && !hm.value) hm.value = selectedMonthText; let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';
    function getMonthData(pName, monthStr) { let recs = getArray(appData.records[pName]); if (monthStr && monthStr !== "All Time") { let parts = monthStr.split(' '); let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1; let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString(); let mQuery = parts[1] + '-' + mStr; recs = recs.filter(r => r.date && r.date.startsWith(mQuery)); } let inc = 0, exp = 0, prof = 0; recs.forEach(r => { if (!appData.config?.enablePastCF && r.date < cutoffDate) return; let amt = parseFloat(r.amount) || 0; if(r.type === 'income') inc += amt; else if(r.type === 'expense') exp += amt; else if(r.type === 'profit') prof += amt; }); return { net: inc - exp - prof, prof: prof }; }

function renderPartnerData(name) {
    const mNamesList = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const nowDate = new Date();
    const curMonthStr = `${mNamesList[nowDate.getMonth()]} ${nowDate.getFullYear()}`;
    let hmEl = document.getElementById('headerMonthSelect');
    let globalMonth = (hmEl && hmEl.value) ? hmEl.value : curMonthStr;
    if(hmEl && (!hmEl.value || hmEl.value === 'August 2026' && curMonthStr !== 'August 2026')) {
        // Automatically sync headerMonthSelect to current month on fresh load!
        if(!localStorage.getItem('st_manual_month')) {
            hmEl.value = curMonthStr;
            globalMonth = curMonthStr;
        }
    } let monthQuery = '';
    if (globalMonth && globalMonth !== 'All Time') { let parts = globalMonth.split(' '); let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1; let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString(); monthQuery = parts[1] + '-' + mStr; }
    let query = document.getElementById('partnerSearchInput') ? document.getElementById('partnerSearchInput').value.toLowerCase() : '';
    let recs = [...getArray(appData.records[name])].sort((a,b)=>new Date(b.date)-new Date(a.date));
    if (monthQuery) recs = recs.filter(r => r.date && r.date.startsWith(monthQuery));
    if (query) recs = recs.filter(r => (r.details && r.details.toLowerCase().includes(query)) || (r.amount && r.amount.toString().includes(query)) || (r.date && r.date.includes(query)) || (r.billNo && r.billNo.toLowerCase().includes(query)));
    
    let totalInc = 0, totalExp = 0, totalProf = 0;
    function makeRow(r, type) {
        if(type==='income') totalInc += parseFloat(r.amount) || 0; else if(type==='expense') totalExp += parseFloat(r.amount) || 0; else totalProf += parseFloat(r.amount) || 0;
        let proof = '-'; if (r.photo && r.photo.length > 5) proof = `<a href="${r.photo}" target="_blank" style="text-decoration:none; font-size:16px;">📷</a>`; else if (r.link && r.link.length > 5) proof = `<a href="${r.link}" target="_blank" style="text-decoration:none; font-size:16px;">🔗</a>`;
        let bTag = r.billNo ? `<br><span style="font-size:11px; color:#8e44ad; font-weight:bold;">🧾 ${r.billNo}</span>` : '';

function showCarryForward() {

function calcCF() {
    let pEl = document.getElementById('cfP'); if(!pEl) return; let p = pEl.value; let cfMEl = document.getElementById('cfM'); if(!cfMEl) return; let monthInput = cfMEl.value;
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + "-01" : "2026-08-01";
    if (monthInput === "All Time") { let validNet = 0; getArray(appData.records[p]).forEach(r => { if (appData.config?.enablePastCF || (r.date && r.date >= cutoffDate)) validNet += (r.type === 'income') ? (parseFloat(r.amount)||0) : -(parseFloat(r.amount)||0); }); document.getElementById('cfResult').innerText = "₹ " + validNet.toLocaleString('en-IN'); return; }
    let m = monthInput.split(' '); let mIdx = ["January","February","March","April","May","June","July","August","September","October","November","December"].indexOf(m[0]); let endOfSelectedMonth = new Date(parseInt(m[1]), mIdx+1, 0, 23, 59, 59);
    let validPastNet = 0; getArray(appData.records[p]).forEach(r => { if(r.date) { let rParts = r.date.split('-'); if(rParts.length === 3) { let rDate = new Date(parseInt(rParts[0]), parseInt(rParts[1])-1, parseInt(rParts[2]), 12, 0, 0); if(rDate <= endOfSelectedMonth) { if (appData.config?.enablePastCF || r.date >= cutoffDate) validPastNet += (r.type === 'income') ? (parseFloat(r.amount)||0) : -(parseFloat(r.amount)||0); } } } });
    document.getElementById('cfResult').innerText = "₹ " + validPastNet.toLocaleString('en-IN');
}

function downloadJSON() { let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(appData,null,2)])); a.download="Backup.json"; a.click(); }
function downloadCSV() { let csv = "Partner,Date,Details,Amt,Type\n"; for(let p in appData.records) getArray(appData.records[p]).forEach(r => csv += `${p},${r.date},${r.details},${r.amount},${r.type}\n`); let a=document.createElement('a'); a.href=encodeURI("data:text/csv;charset=utf-8,"+csv); a.download="Data.csv"; a.click(); }
function restoreData(e) { let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=x => { try { appData=JSON.parse(x.target.result); saveDataToLocal().then(() => location.reload()); } catch(err) { alert("Invalid backup!"); } }; r.readAsText(f); }
async function updatePartnerPassword() { let u = document.getElementById('sP').value; let o = document.getElementById('oP').value.trim(); let n = document.getElementById('nP').value.trim(); let st = appData.passwords[u] || defaultData.passwords[u]; let enteredOldHash = await hashPassword(o); let match = (st.length === 64) ? (enteredOldHash === st) : (o === st); if(match && n.length >= 4) { appData.passwords[u] = await hashPassword(n); saveDataToLocal().then(() => alert("Password Updated!")); } else alert("Incorrect password or new too short!"); }

function showTechDashboard() { setActiveAdminTab('tab-tech'); document.getElementById('profileArea').innerHTML = `<div class="card"><h2>👤 Select Technician Profile</h2><div class="grid"><div class="role" onclick="tech('computer')">💻 <b>Computer</b></div><div class="role" onclick="tech('water')">💧 <b>Water Purifier</b></div></div></div><div id="techArea"></div>`; }
function tech(type){
    currentTechEditId = null; currentTechEditPhoto = ''; let todayDate = new Date().toISOString().split('T')[0];
    if(type === 'computer') {
        let compJobs = getArray(appData.computerJobs); let rows = compJobs.map(j => { let partsDisplay = getArray(j.parts).map(p => `<div style="margin-bottom:4px;">• <b>${p.part||'-'}</b><br><span style="font-size:11px;color:#555;">SN: ${p.serial||'N/A'}</span></div>`).join(''); let proofDisplay = getArray(j.parts).map((p, idx) => p.photo ? `<a href="${p.photo}" target="_blank" style="display:block; font-size:12px; text-decoration:none;">📷 ${idx+1}</a>` : '').join(''); return `<tr><td>${j.location}</td><td>${j.shop}</td><td>${partsDisplay}</td><td>${formatDate(j.date)}</td><td style="text-align:center;">${proofDisplay || '-'}</td><td style="white-space:nowrap;"><button onclick="editTechJob('${j.id}', 'computer')" style="background:#f39c12; color:white; border:none; border-radius:4px; padding:4px 6px;">✏️</button><button onclick="deleteTechJob('${j.id}', 'computer')" style="background:#e21d4f; color:white; border:none; border-radius:4px; padding:4px 6px; margin-left:4px;">🗑️</button></td></tr>`; }).join('');
        document.getElementById('techArea').innerHTML = `<div class="card"><h2>💻 Computer Service</h2><label>Location</label><input id="cLoc"><label>Shop</label><input id="cShop"><label>Date</label><input type="date" id="cDate" value="${todayDate}"><div style="margin:15px 0;"><h3>🛠️ Parts Replaced</h3><div id="partsContainer"></div><button type="button" onclick="addPartRow()" style="background:#2980b9;width:100%;padding:12px;border:none;border-radius:10px;color:white;">＋ Add Part</button></div><label>Remarks</label><input id="cRemarks"><button id="cSaveBtn" onclick="saveComputerJob()" style="width:100%; background:#176b4d;">Save Job</button></div><div class="card"><div style="overflow-x:auto;"><table><tr><th>Location</th><th>Shop</th><th>Parts</th><th>Date</th><th style="text-align:center;">Proof</th><th>Action</th></tr>${rows||'<tr><td colspan="6" style="text-align:center;">No jobs</td></tr>'}</table></div></div>`; addPartRow(); 
    } else {
        let wJobs = getArray(appData.waterJobs); let rows = wJobs.map(j => `<tr><td>${j.customer}</td><td>${j.mobile}</td><td>${j.model}</td><td>${j.part}</td><td>${formatDate(j.date)}</td><td style="text-align:center;">${j.photo ? `<a href="${j.photo}" target="_blank" style="text-decoration:none; font-size:16px;">📷</a>` : '-'}</td><td style="white-space:nowrap;"><button onclick="editTechJob('${j.id}', 'water')" style="background:#f39c12; color:white; border:none; border-radius:4px; padding:4px 6px;">✏️</button><button onclick="deleteTechJob('${j.id}', 'water')" style="background:#e21d4f; color:white; border:none; border-radius:4px; padding:4px 6px; margin-left:4px;">🗑️</button></td></tr>`).join('');
        document.getElementById('techArea').innerHTML = `<div class="card"><h2>💧 Water Purifier Service</h2><label>Customer</label><input id="wCust"><label>Mobile</label><input id="wMob"><label>Model</label><input id="wModel"><label>Part Replaced</label><input id="wPart"><label>Photo</label><input id="wPhoto" type="file" accept="image/*"><label>Date</label><input type="date" id="wDate" value="${todayDate}"><button id="wSaveBtn" onclick="saveWaterJob()" style="width:100%;">Save Job</button></div><div class="card"><div style="overflow-x:auto;"><table><tr><th>Customer</th><th>Mobile</th><th>Model</th><th>Part</th><th>Date</th><th style="text-align:center;">Proof</th><th>Action</th></tr>${rows||'<tr><td colspan="7" style="text-align:center;">No jobs</td></tr>'}</table></div></div>`;
    }
}

async function handlePartImage(input, rowId) {
    if(input.files && input.files[0]) {
        try {
            let b64 = await compressImage(input.files[0]);
            let box = document.getElementById(rowId);
            if(box) {
                box.querySelector('.p-hidden-b64').value = b64;
            }
        } catch(e) {
            console.error("Error compressing part image", e);
        }
    }
}

function addPartRow(part='', serial='', photoB64='') { let container = document.getElementById('partsContainer'); let rowId = 'part-row-' + Date.now(); let div = document.createElement('div'); div.id = rowId; div.className = 'part-row-box'; div.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><b style="font-size:14px;">📦 Part</b><button type="button" onclick="document.getElementById('${rowId}').remove()" style="background:#e21d4f; color:white; border:none; border-radius:6px; padding:4px 8px; font-size:11px;">✖</button></div><label>Part Name</label><input class="p-name" value="${part}"><label>Serial</label><input class="p-serial" value="${serial}"><label>Photo</label><input type="hidden" class="p-hidden-b64" value="${photoB64}"><input type="file" class="p-photo" accept="image/*" onchange="handlePartImage(this, '${rowId}')">${photoB64?'<div style="font-size:11px;color:#07865b;">✓ Old Photo</div>':''}`; container.appendChild(div); }
async function saveComputerJob() { let loc = document.getElementById('cLoc').value.trim(), shop = document.getElementById('cShop').value.trim(), d = document.getElementById('cDate').value, rem = document.getElementById('cRemarks').value.trim(); if(!loc) return alert("Location is required!"); let btn = document.getElementById('cSaveBtn'); let orig=btn.innerText; btn.innerText="⏳ Saving..."; btn.disabled=true; appData.computerJobs = getArray(appData.computerJobs); let partsList = []; let boxes = document.querySelectorAll('.part-row-box'); for(let i=0; i<boxes.length; i++) { let n = boxes[i].querySelector('.p-name').value.trim(), s = boxes[i].querySelector('.p-serial').value.trim(), h = boxes[i].querySelector('.p-hidden-b64').value; let u = h; if(h.startsWith('data:image')) u = await uploadToImgBB(h); if(n) partsList.push({part:n, serial:s, photo:u}); } if(!partsList.length) { btn.innerText=orig; btn.disabled=false; return alert("Add 1 part!"); } let j = { id: currentTechEditId||Date.now(), location:loc, shop, date:d, remarks:rem, parts:partsList }; if(currentTechEditId) { let idx=appData.computerJobs.findIndex(x=>String(x.id)===String(currentTechEditId)); appData.computerJobs[idx]=j; currentTechEditId=null; } else appData.computerJobs.unshift(j); await saveDataToLocal(); tech('computer'); }
async function saveWaterJob() { let c = document.getElementById('wCust').value.trim(), m = document.getElementById('wMob').value.trim(), mod = document.getElementById('wModel').value.trim(), p = document.getElementById('wPart').value.trim(), d = document.getElementById('wDate').value, file = document.getElementById('wPhoto').files[0]; if(!c || !m) return alert("Customer and Mobile required!"); if(file && !file.type.startsWith('image/')) return alert("Upload Image only!"); let btn = document.getElementById('wSaveBtn'); let orig=btn.innerText; btn.innerText="⏳ Saving..."; btn.disabled=true; appData.waterJobs = getArray(appData.waterJobs); let url = currentTechEditId && appData.waterJobs.find(x=>String(x.id)===String(currentTechEditId))?.photo ? appData.waterJobs.find(x=>String(x.id)===String(currentTechEditId)).photo : ''; if(file){ let b64 = await compressImage(file); url = await uploadToImgBB(b64); } let j = { id: currentTechEditId||Date.now(), customer:c, mobile:m, model:mod, part:p, date:d, photo:url }; if(currentTechEditId) { let idx=appData.waterJobs.findIndex(x=>String(x.id)===String(currentTechEditId)); appData.waterJobs[idx]=j; currentTechEditId=null; currentTechEditPhoto=''; } else appData.waterJobs.unshift(j); await saveDataToLocal(); tech('water'); }
function deleteTechJob(id, t) { if(confirm("Delete this job?")){ t==='computer'?appData.computerJobs=getArray(appData.computerJobs).filter(x=>String(x.id)!==String(id)):appData.waterJobs=getArray(appData.waterJobs).filter(x=>String(x.id)!==String(id)); saveDataToLocal().then(()=>tech(t)); } }
function editTechJob(id, t) { let arr = t==='computer'?getArray(appData.computerJobs):getArray(appData.waterJobs); let j = arr.find(x=>String(x.id)===String(id)); if(!j)return; currentTechEditId = id; if(t==='computer') { document.getElementById('cLoc').value=j.location; document.getElementById('cShop').value=j.shop; document.getElementById('cDate').value=j.date; document.getElementById('cRemarks').value=j.remarks; document.getElementById('partsContainer').innerHTML=''; getArray(j.parts).forEach(p=>addPartRow(p.part, p.serial, p.photo)); let btn = document.getElementById('cSaveBtn'); if(btn) { btn.innerText="✏️ Update Job"; btn.style.background="#f39c12"; } } else { document.getElementById('wCust').value=j.customer; document.getElementById('wMob').value=j.mobile; document.getElementById('wModel').value=j.model; document.getElementById('wPart').value=j.part; document.getElementById('wDate').value=j.date; currentTechEditPhoto=j.photo; let btn = document.getElementById('wSaveBtn'); if(btn) { btn.innerText="✏️ Update Job"; btn.style.background="#f39c12"; } } window.scrollTo({top:0, behavior:'smooth'}); }

</script>
