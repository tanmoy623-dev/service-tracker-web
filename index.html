function getArray(data) { if (!data) return []; if (Array.isArray(data)) return data; return Object.values(data); }

// ====== IMAGE COMPRESSION + PDF SUPPORT (UP TO 10 MB) ======
function compressImage(file) {
    return new Promise((resolve) => {
        if (!file) return resolve('');

        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (isPDF) {
            if (file.size > 10 * 1024 * 1024) {
                alert("⚠️ PDF file 10 MB se chhoti honi chahiye!");
                return resolve('');
            }
            let pdfReader = new FileReader();
            pdfReader.onload = (e) => {
                let res = e.target.result || '';
                if (res && !res.startsWith('data:application/pdf')) {
                    res = 'data:application/pdf;base64,' + res.split(',')[1];
                }
                resolve(res);
            };
            pdfReader.onerror = () => resolve('');
            pdfReader.readAsDataURL(file);
            return;
        }

        let reader = new FileReader();
        reader.onload = function(event) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
                let maxW = 800, maxH = 800, w = img.width, h = img.height;
                if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
                else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.onerror = () => resolve('');
            img.src = event.target.result;
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
    });
}

function updateUploadBar(percent, statusText, titleText) {
    let toast = document.getElementById('uploadProgressOverlay');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'uploadProgressOverlay';
        toast.style.cssText = 'position:fixed; bottom:16px; right:16px; width:295px; max-width:calc(100vw - 24px); z-index:99999; pointer-events:auto;';

                    </div>
                    <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                        <span id="uploadBarPct" style="font-weight:800; color:#34d399; font-size:12.5px;">0%</span>
                        <button type="button" onclick="cancelActiveUpload()" title="Cancel" style="background:rgba(255,255,255,0.12); color:#e2e8f0; border:none; padding:2px 6px; font-size:11px; border-radius:6px; line-height:1.2;">✖</button>

                <div id="uploadBarSub" style="font-size:11px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Preparing...</div>

        document.body.appendChild(toast);

function hideUploadBar() {

function cancelActiveUpload() {

async function uploadToImgBB(base64Str, customFileName) {
    if (!base64Str || !base64Str.startsWith('data:')) return '';

    const mimeString = base64Str.split(',')[0].split(':')[1].split(';')[0];
    const base64Data = base64Str.split(',')[1];
    const fileKB = Math.max(1, Math.round((base64Data.length * 3 / 4) / 1024));
    const ext = mimeString === 'application/pdf' ? 'pdf' : (mimeString.split('/')[1] || 'jpg');
    const finalName = customFileName || ('ST_' + Date.now() + '.' + ext);

    let pct = 10;
    isBackgroundUploading = true;
    updateUploadBar(pct, `${fileKB} KB • Google Drive`, finalName);

    let progressTimer = setInterval(() => {
        if (pct < 88) {
            pct += Math.max(2, Math.round((90 - pct) * 0.18));
            updateUploadBar(pct, pct < 60 ? `Uploading ${fileKB} KB...` : 'Saving in Drive...', finalName);
        }
    }, 350);

    activeUploadController = new AbortController();
    let timeoutId = setTimeout(() => {
        if (activeUploadController) activeUploadController.abort();
    }, 45000);

    try {
        const payload = JSON.stringify({
            base64: base64Data,
            mimeType: mimeString,
            fileName: finalName
        });

        const response = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
            method: 'POST',
            redirect: 'follow',
            body: payload,
            signal: activeUploadController.signal
        });

        clearInterval(progressTimer);
        clearTimeout(timeoutId);
        activeUploadController = null;
        isBackgroundUploading = false;

        const text = await response.text();
        let data = null;
        try { data = JSON.parse(text); } catch (e) {}

        if (data && data.success && data.url) {
            updateUploadBar(100, '✅ Saved to Google Drive!', finalName);
            await new Promise(r => setTimeout(r, 800));
            hideUploadBar();
            return data.url;
        } else {
            hideUploadBar();
            alert('⚠️ Google Drive Error: ' + (data && data.error ? data.error : 'Apps Script mein "Who has access: Anyone" check karein.'));
            return '';
        }
    } catch (err) {
        clearInterval(progressTimer);
        clearTimeout(timeoutId);
        activeUploadController = null;
        isBackgroundUploading = false;
        hideUploadBar();
        if (err && err.name === 'AbortError') {
            alert('⏱️ Upload cancelled or timed out. Dobara try karein.');
        } else {
            alert('⚠️ Google Drive upload error! Apps Script permission check karein.');
        }
        return '';
    }
}

function extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return '';
    let m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return m1[1];
    let m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1]) return m2[1];
    return '';
}

async function deleteFromGoogleDrive(fileUrl) {
    const fileId = extractDriveFileId(fileUrl);
    if (!fileId) return { success: true, skipped: true };

    try {
        const res = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
            method: 'POST',
            redirect: 'follow',
            body: JSON.stringify({ action: 'delete', fileId: fileId })
        });
        const text = await res.text();
        return JSON.parse(text);
    } catch (err) {
        return { success: false, error: err.message };
    }
}

async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

window.changeMonthBy = function(step) {
    let targetSelect = document.getElementById('headerMonthSelect');
    if (!targetSelect || targetSelect.value === 'All Time') return;
    let parts = targetSelect.value.split(' ');
    let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]);
    let y = parseInt(parts[1]);
    let nd = new Date(y, mIdx + step, 1);
    let newVal = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][nd.getMonth()] + ' ' + nd.getFullYear();

    let exists = Array.from(targetSelect.options).some(opt => opt.value === newVal);
    if (!exists) {
        let shortM = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][nd.getMonth()];
        targetSelect.add(new Option(shortM + ' ' + nd.getFullYear(), newVal));

    targetSelect.value = newVal;
    handleGlobalMonthChange();
};

function generateMonthDropdown() {
    let d = new Date();
    let currMonthName = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getMonth()];
    let savedMonth = localStorage.getItem('st_manual_month') || (currMonthName + " " + d.getFullYear());

    let options = '<option value="All Time">All Time</option>';

    let startYear = 2026; let startMonth = 7;
    let endYear = d.getFullYear(); let endMonth = d.getMonth() + 1;
    if (endMonth > 11) { endMonth = 0; endYear++; }

    let validMonths = [];
    let tempY = startYear, tempM = startMonth;
    while (tempY < endYear || (tempY === endYear && tempM <= endMonth)) {
        validMonths.unshift({ y: tempY, m: tempM });
        tempM++; if (tempM > 11) { tempM = 0; tempY++; }

function showAdminOverview() {
    setActiveAdminTab('tab-overview');
    const hmEl = document.getElementById('headerMonthSelect');
    const activePeriod = hmEl ? hmEl.value : "August 2026";
    const cfStartCutoff = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';

    function calcPartnerStats(partnerKey, periodLabel) {
        const fullList = getArray(appData.records[partnerKey]);
        let allTimeProfit = 0;

        fullList.forEach(item => {
            if (!appData.config?.enablePastCF && item.date < cfStartCutoff) return;
            if (item.type === 'profit') {
                allTimeProfit += (parseFloat(item.amount) || 0);
            }
        });

        let periodList = fullList;
        if (periodLabel && periodLabel !== "All Time") {
            const splitParts = periodLabel.split(' ');
            const mNum = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(splitParts[0]) + 1;
            const mFormatted = mNum < 10 ? '0' + mNum : String(mNum);
            const prefixFilter = splitParts[1] + '-' + mFormatted;
            periodList = fullList.filter(item => item.date && item.date.startsWith(prefixFilter));
        }

        let mInc = 0, mExp = 0, mProf = 0;
        periodList.forEach(item => {
            if (!appData.config?.enablePastCF && item.date < cfStartCutoff) return;
            const val = parseFloat(item.amount) || 0;
            if (item.type === 'income') mInc += val;
            else if (item.type === 'expense') mExp += val;
            else if (item.type === 'profit') mProf += val;
        });

        return {
            inc: mInc,
            exp: mExp,
            net: mInc - mExp - mProf,
            profAllTime: allTimeProfit
        };
    }

    function calcPrevCarryForward(partnerKey, periodLabel) {
        if (!periodLabel || periodLabel === "All Time") return { bal: 0, month: "All Time" };
        const splitParts = periodLabel.split(' ');
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const currIdx = monthNames.indexOf(splitParts[0]);
        const currYear = parseInt(splitParts[1]);
        const prevIdx = currIdx === 0 ? 11 : currIdx - 1;
        const prevYr = currIdx === 0 ? currYear - 1 : currYear;
        const cutoffEnd = new Date(prevYr, prevIdx + 1, 0, 23, 59, 59);

        let netPast = 0;
        getArray(appData.records[partnerKey]).forEach(item => {
            if (item.date) {
                const dArr = item.date.split('-');
                const itemDt = new Date(parseInt(dArr[0]), parseInt(dArr[1]) - 1, parseInt(dArr[2]), 12, 0, 0);
                if (itemDt <= cutoffEnd) {
                    if (appData.config?.enablePastCF || item.date >= cfStartCutoff) {
                        const v = parseFloat(item.amount) || 0;
                        netPast += (item.type === 'income' ? v : -v);
                    }
                }
            }
        });
        return { bal: netPast, month: monthNames[prevIdx] + " " + prevYr };
    }

    const tanStats = calcPartnerStats('Tanmoy', activePeriod);
    const tapStats = calcPartnerStats('Tapabrata', activePeriod);
    const tanCF = calcPrevCarryForward('Tanmoy', activePeriod);
    const tapCF = calcPrevCarryForward('Tapabrata', activePeriod);

        getArray(appData.records['Tanmoy']).forEach(r => { if (appData.config?.enablePastCF || r.date >= cfStartCutoff) tanFinalCash += (r.type === 'income' ? parseFloat(r.amount) : -parseFloat(r.amount)); });
        getArray(appData.records['Tapabrata']).forEach(r => { if (appData.config?.enablePastCF || r.date >= cfStartCutoff) tapFinalCash += (r.type === 'income' ? parseFloat(r.amount) : -parseFloat(r.amount)); });
    } else {
        tanFinalCash = tanCF.bal + tanStats.net;

    const cfLabelTap = activePeriod === "All Time" ? "₹0" : "₹" + tapCF.bal.toLocaleString('en-IN');

    const tanFlowSum = tanStats.inc + tanStats.exp;

    const tapFlowSum = tapStats.inc + tapStats.exp;

function renderPartnerData(name) {
    let globalMonth = document.getElementById('headerMonthSelect') ? document.getElementById('headerMonthSelect').value : '';
    let monthQuery = '';
    if (globalMonth && globalMonth !== 'All Time') {
        let parts = globalMonth.split(' ');
        let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1;
        let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString();
        monthQuery = parts[1] + '-' + mStr;
    }

    let query = document.getElementById('partnerSearchInput') ? document.getElementById('partnerSearchInput').value.toLowerCase() : '';
    let dateFilter = currentPartnerDateFilter || '';
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';

    let allPartnerRecs = [...getArray(appData.records[name])].sort((a, b) => new Date(b.date) - new Date(a.date));

    let allTimeProf = 0;
    let profitMonthMap = {};
    const monthShortNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    allPartnerRecs.forEach(r => {
        if (appData.config?.enablePastCF || (r.date && r.date >= cutoffDate)) {
            if (r.type === 'profit') {
                let pAmt = parseFloat(r.amount) || 0;
                allTimeProf += pAmt;
                if (r.date) {
                    let dParts = r.date.split('-');
                    if (dParts.length === 3) {
                        let mNum = parseInt(dParts[1]) - 1;
                        let mName = monthShortNames[mNum] || dParts[1];
                        if (!profitMonthMap[mName]) profitMonthMap[mName] = 0;
                        profitMonthMap[mName] += pAmt;
                    }
                }
            }
        }
    });

    let profitMonthsBreakdown = [];
    for (let m in profitMonthMap) {
        profitMonthsBreakdown.push(`${m}: ₹${profitMonthMap[m].toLocaleString('en-IN')}`);
    }
    let profitSubText = profitMonthsBreakdown.length > 0 ? profitMonthsBreakdown.join(' | ') : 'All Time Withdrawn';

    let recs = [...allPartnerRecs];
    if (dateFilter) { recs = recs.filter(r => r.date === dateFilter); }
    else if (monthQuery) { recs = recs.filter(r => r.date && r.date.startsWith(monthQuery)); }

    if (query) {
        recs = recs.filter(r => (r.details && r.details.toLowerCase().includes(query)) || (r.amount && r.amount.toString().includes(query)) || (r.date && r.date.includes(query)) || (r.billNo && r.billNo.toLowerCase().includes(query)));
    }

    let profRecsList = allPartnerRecs.filter(r => r.type === 'profit');
    if (dateFilter) { profRecsList = profRecsList.filter(r => r.date === dateFilter); }
    if (query) {
        profRecsList = profRecsList.filter(r => (r.details && r.details.toLowerCase().includes(query)) || (r.amount && r.amount.toString().includes(query)) || (r.date && r.date.includes(query)));
    }

    let totalInc = 0, totalExp = 0, monthProf = 0;
    recs.forEach(r => {
        if (r.type === 'profit') monthProf += parseFloat(r.amount) || 0;
    });

    function makeRow(r, type) {
        if (type === 'income') totalInc += parseFloat(r.amount) || 0;
        else if (type === 'expense') totalExp += parseFloat(r.amount) || 0;

        let proof = '-';

async function savePartnerEntry(name) {
    let date = document.getElementById('entryDate').value, amt = parseFloat(document.getElementById('entryAmount').value), det = document.getElementById('entryDetails').value.trim();
    let billNoEl = document.getElementById('entryBillNo'); let billNo = billNoEl ? billNoEl.value.trim() : '';
    let photoInput = document.getElementById('entryPhoto'); let file = photoInput.files[0];
    let isTransfer = document.getElementById('transferCheckbox') && document.getElementById('transferCheckbox').checked && currentEntryType !== 'profit';
    let isVehicle = document.getElementById('isVehicleExpense') && document.getElementById('isVehicleExpense').checked && currentEntryType === 'expense';
    let otherName = name === 'Tanmoy' ? 'Tapabrata' : 'Tanmoy';
    if (isNaN(amt) || amt <= 0) return alert("Valid Amount required!");
    if (!isVehicle && !det) return alert("Details required!");
    if (file && !file.type.startsWith('image/')) return alert("Upload Image only!");

    let qvCar = isVehicle ? document.getElementById('qvCar').value : '';
    let qvCat = isVehicle ? document.getElementById('qvCategory').value : '';
    let partnerDesc = '';
    if (isVehicle) {
        partnerDesc = det ? `🚗 ${qvCar} - ${qvCat} (${det})` : `🚗 ${qvCar} - ${qvCat}`;
    } else {
        partnerDesc = isTransfer ? `${det} (To ${otherName})` : det;
    }

    let isDuplicate = getArray(appData.records[name]).some(r => String(r.id) !== String(currentEditId) && r.date === date && r.amount === amt && (r.details || '').toLowerCase() === partnerDesc.toLowerCase() && r.type === currentEntryType);
    if (isDuplicate) return alert("❌ DUPLICATE ENTRY! Yeh entry is date par pehle se maujood hai.");

    if (currentEntryType === 'income' && billNo) { let allRecs = [...getArray(appData.records['Tanmoy']), ...getArray(appData.records['Tapabrata'])]; let isBillUsed = allRecs.some(r => String(r.id) !== String(currentEditId) && r.billNo && r.billNo.toLowerCase() === billNo.toLowerCase()); if (isBillUsed) return alert(`❌ DUPLICATE BILL!`); }

    let oldR = currentEditId ? getArray(appData.records[name]).find(r => String(r.id) === String(currentEditId)) : null;
    let wasVehicle = oldR && oldR.isAuto && !oldR.linkedId;
    let wasTransfer = oldR && oldR.linkedId;

    if (currentEditId !== null && (isTransfer || isVehicle || wasVehicle || wasTransfer)) {
        if (oldR) {
            appData.balances[name] -= (oldR.type === 'income' ? oldR.amount : -oldR.amount);
            appData.records[name] = getArray(appData.records[name]).filter(r => String(r.id) !== String(currentEditId));
            if (wasVehicle) appData.vehicles = getArray(appData.vehicles).filter(v => String(v.id) !== String(currentEditId));
            if (wasTransfer) {
                let oldLinkedR = getArray(appData.records[otherName]).find(x => String(x.id) === String(oldR.linkedId));
                if (oldLinkedR) {
                    appData.balances[otherName] -= (oldLinkedR.type === 'income' ? oldLinkedR.amount : -oldLinkedR.amount);
                    appData.records[otherName] = getArray(appData.records[otherName]).filter(x => String(x.id) !== String(oldR.linkedId));
                }
            }
        }
        currentEditId = null;
    }

    let btn = document.getElementById('entrySaveBtn'); let origText = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;
    try {
        appData.records[name] = getArray(appData.records[name]);
        let existingRecord = currentEditId ? appData.records[name].find(r => String(r.id) === String(currentEditId)) : null;
        let baseRec = existingRecord || oldR;
        let photoUrl = baseRec && baseRec.photo ? baseRec.photo : '';
        let oldLink = baseRec && baseRec.link ? baseRec.link : '';
        let oldReconState = baseRec && baseRec.reconState !== undefined ? baseRec.reconState : 0;

        if (file) { let b64 = await compressImage(file); photoUrl = await uploadToImgBB(b64); }
        if (!appData.balances[name]) appData.balances[name] = 0;
        let newEntryId = currentEditId || Date.now(), linkedEntryId = newEntryId + "_linked";

        if (currentEditId !== null) {
            let idx = appData.records[name].findIndex(r => String(r.id) === String(currentEditId));
            appData.balances[name] -= (existingRecord.type === 'income' ? existingRecord.amount : -existingRecord.amount); appData.balances[name] += (currentEntryType === 'income' ? amt : -amt);
            appData.records[name][idx] = { id: currentEditId, date, details: partnerDesc, amount: amt, type: currentEntryType, photo: photoUrl || '', link: oldLink || '', isAuto: existingRecord.isAuto || false, linkedId: existingRecord.linkedId || null, billNo, reconState: oldReconState };
        } else {
            if (isVehicle) {
                let finalDetails = det || '-';
                appData.vehicles = getArray(appData.vehicles); appData.vehicles.unshift({ id: newEntryId, date, car: qvCar, category: qvCat, details: finalDetails, amount: amt, photo: photoUrl || '', paidBy: name });
                appData.records[name].unshift({ id: newEntryId, date, details: partnerDesc, amount: amt, type: 'expense', photo: photoUrl || '', link: oldLink || '', isAuto: true, reconState: oldReconState }); appData.balances[name] -= amt;
            } else {
                appData.records[name].unshift({ id: newEntryId, date, details: partnerDesc, amount: amt, type: currentEntryType, photo: photoUrl || '', link: oldLink || '', isAuto: false, linkedId: isTransfer ? linkedEntryId : null, billNo, reconState: oldReconState }); appData.balances[name] += (currentEntryType === 'income' ? amt : -amt);
                if (isTransfer) {
                    let otherType = currentEntryType === 'expense' ? 'income' : 'expense', otherDesc = `${det} (From ${name})`; appData.records[otherName] = getArray(appData.records[otherName]); appData.records[otherName].unshift({ id: linkedEntryId, date, details: otherDesc, amount: amt, type: otherType, photo: photoUrl || '', link: '', isAuto: true, linkedId: newEntryId, reconState: 0 }); if (!appData.balances[otherName]) appData.balances[otherName] = 0; appData.balances[otherName] += (otherType === 'income' ? amt : -amt);
                }
            }
        }
        if (currentEntryType === 'income' && billNo) { let bIdx = getArray(appData.submittedBills).findIndex(b => b.billNo && b.billNo.toLowerCase() === billNo.toLowerCase() && !b.isPaid); if (bIdx !== -1) appData.submittedBills[bIdx].isPaid = true; }

        window.lastSelectedDate = date;
        await saveDataToLocal(); partnerProfile(name);
    } catch (e) { alert("Error saving."); btn.innerText = origText; btn.disabled = false; }
}

function deleteEntry(id, name) {
    let r = getArray(appData.records[name]).find(x => String(x.id) === String(id));

// ====== PO DATE, DEADLINE, MULTI-CYCLE AMC & SD REFUND HELPERS ======
function addMonthsSafe(dateStr, monthsToAdd) {
    if (!dateStr) return null;
    let parts = dateStr.split('-');
    if (parts.length !== 3) return null;

    let yr = parseInt(parts[0], 10);
    let mo = parseInt(parts[1], 10) - 1;
    let dy = parseInt(parts[2], 10);

    let totalMonths = mo + monthsToAdd;
    let targetYear = yr + Math.floor(totalMonths / 12);
    let normMonth = ((totalMonths % 12) + 12) % 12;
    let maxDay = new Date(targetYear, normMonth + 1, 0).getDate();
    let clampedDay = Math.min(dy, maxDay);

    let dt = new Date(targetYear, normMonth, clampedDay);
    dt.setHours(0, 0, 0, 0);
    return dt;
}

function parseISODateLocal(dateStr) {
    if (!dateStr) return null;
    let parts = dateStr.split('-');
    if (parts.length !== 3) return null;
    let dt = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    dt.setHours(0, 0, 0, 0);
    return isNaN(dt.getTime()) ? null : dt;
}

function dateObjToISO(dt) {
    if (!dt) return '';
    let y = dt.getFullYear();
    let m = String(dt.getMonth() + 1).padStart(2, '0');
    let d = String(dt.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function getEffectiveAlertMonths(po) {
    if (!po) return 0;
    if (po.alertMonths !== undefined && po.alertMonths !== null && po.alertMonths !== '') {
        return parseInt(po.alertMonths, 10) || 0;
    }
    if (po.poType === 'Civil PO') return 6;
    if (po.poType === 'AMC PO') return 3;
    return 0;
}

function getPODeadlineStatus(deadlineStr, isCompleted) {
    if (isCompleted || !deadlineStr) return null;
    let due = parseISODateLocal(deadlineStr);
    if (!due) return null;

    let today = new Date();
    today.setHours(0, 0, 0, 0);

    let diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));

    if (diffDays < 0) {
        return { level: 'overdue', days: diffDays, isAlert: true, text: `🔴 ${Math.abs(diffDays)}d Overdue`, bg: '#ffe4e6', color: '#be123c', border: '#fda4af' };
    }
    if (diffDays === 0) {
        return { level: 'today', days: 0, isAlert: true, text: `🟠 Due Today!`, bg: '#ffedd5', color: '#c2410c', border: '#fdba74' };
    }
    if (diffDays <= 5) {
        return { level: 'soon', days: diffDays, isAlert: true, text: `🟡 ${diffDays}d Left`, bg: '#fef9c3', color: '#a16207', border: '#fde047' };
    }
    return { level: 'safe', days: diffDays, isAlert: false, text: `🟢 ${diffDays}d Left`, bg: '#ecfdf5', color: '#047857', border: '#a7f3d0' };
}

function getPOMonthAlertStatus(po) {
    if (!po || po.isCompleted || !po.date) return null;
    let alertMonths = getEffectiveAlertMonths(po);
    if (alertMonths <= 0) return null;

    let cyclesDone = parseInt(po.completedCycles, 10) || 0;
    let billNo = cyclesDone + 1;

    let today = new Date();
    today.setHours(0, 0, 0, 0);

    let deadlineObj = po.deadline ? parseISODateLocal(po.deadline) : null;
    let deadlineLimitMs = deadlineObj ? (deadlineObj.getTime() + 15 * 24 * 60 * 60 * 1000) : null;

    let dueDateObj = addMonthsSafe(po.date, alertMonths * billNo);
    if (!dueDateObj) return null;

    // Stop creating extra alerts beyond PO deadline (+15d grace for exact 1-year AMC end)
    if (deadlineLimitMs && dueDateObj.getTime() > deadlineLimitMs) {
        return {
            isAlert: false, reached: false, allCyclesDone: true, diffDays: Infinity,
            alertMonths, cyclesDone, billNo, dueCyclesCount: 0, totalDueMonths: 0,
            dueISO: '',
            text: `✓ All Cycles Claimed`,
            bg: '#ecfdf5', color: '#047857', border: '#a7f3d0'
        };
    }

    let diffDays = Math.round((dueDateObj - today) / (1000 * 60 * 60 * 24));
    let dueISO = dateObjToISO(dueDateObj);
    let isAlert = diffDays <= 5;

    // Count consecutive due cycles (e.g. 2 cycles = 6M combined claim)
    let dueCyclesCount = 0;
    let lastDueISO = dueISO;
    if (isAlert) {
        dueCyclesCount = 1;
        for (let step = 1; step < 24; step++) {
            let nextObj = addMonthsSafe(po.date, alertMonths * (billNo + step));
            if (!nextObj) break;
            if (deadlineLimitMs && nextObj.getTime() > deadlineLimitMs) break;
            let nextDiff = Math.round((nextObj - today) / (1000 * 60 * 60 * 24));
            if (nextDiff <= 5) {
                dueCyclesCount++;
                lastDueISO = dateObjToISO(nextObj);
            } else {
                break;
            }
        }
    }

    let totalDueMonths = dueCyclesCount * alertMonths;
    let toBillNo = billNo + Math.max(0, dueCyclesCount - 1);

    if (dueCyclesCount > 1) {
        return {
            isAlert: true, reached: true, diffDays, alertMonths, cyclesDone,
            billNo, toBillNo, dueCyclesCount, totalDueMonths, dueISO, lastDueISO,
            text: `🔔 ${dueCyclesCount} Bills Due (${totalDueMonths}M)`,
            bg: '#fef2f2', color: '#b91c1c', border: '#fca5a5'
        };
    }

    if (diffDays < 0) {
        return {
            isAlert: true, reached: true, diffDays, alertMonths, cyclesDone,
            billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO,
            text: `🔔 Bill #${billNo} Overdue (${Math.abs(diffDays)}d)`,
            bg: '#fef2f2', color: '#b91c1c', border: '#fca5a5'
        };
    }
    if (diffDays === 0) {
        return {
            isAlert: true, reached: true, diffDays: 0, alertMonths, cyclesDone,
            billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO,
            text: `🔔 Bill #${billNo} Due Today!`,
            bg: '#ffedd5', color: '#c2410c', border: '#fdba74'
        };
    }
    if (diffDays <= 5) {
        return {
            isAlert: true, reached: true, diffDays, alertMonths, cyclesDone,
            billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO,
            text: `🔔 Bill #${billNo} in ${diffDays}d`,
            bg: '#fef9c3', color: '#a16207', border: '#fde047'
        };
    }

    return {
        isAlert: false, reached: false, diffDays, alertMonths, cyclesDone,
        billNo, toBillNo: billNo, dueCyclesCount: 0, totalDueMonths: 0, dueISO, lastDueISO: dueISO,
        text: `🕒 Bill #${billNo}: ${formatDate(dueISO)}`,
        bg: '#f0f9ff', color: '#0369a1', border: '#bae6fd'
    };
}

function getPOSDStatus(po) {
    if (!po) return null;
    let sdAmt = parseFloat(po.sdAmount) || 0;
    if (sdAmt <= 0) return null;

    let holdMonths = parseInt(po.sdHoldMonths, 10) || 6;

    if (po.sdReceived) {
        return {
            state: 'received',
            isAlert: false,
            sdAmt,
            holdMonths,
            diffDays: Infinity,
            text: `✅ SD Refunded (₹${sdAmt.toLocaleString('en-IN')})`,
            bg: '#ecfdf5',
            color: '#047857',
            border: '#a7f3d0'
        };
    }

    if (!po.completedDate) {
        return {
            state: 'held',
            isAlert: false,
            sdAmt,
            holdMonths,
            diffDays: Infinity,
            text: po.isCompleted
                ? `🔒 SD ₹${sdAmt.toLocaleString('en-IN')} (Set Done Date)`
                : `🔒 SD ₹${sdAmt.toLocaleString('en-IN')} (${holdMonths}M after done)`,
            bg: '#eef2ff',
            color: '#3730a3',
            border: '#c7d2fe'
        };
    }

    let dueObj = addMonthsSafe(po.completedDate, holdMonths);
    if (!dueObj) return null;

    let today = new Date();
    today.setHours(0, 0, 0, 0);

    let diffDays = Math.round((dueObj - today) / (1000 * 60 * 60 * 24));
    let dueISO = dateObjToISO(dueObj);
    let isAlert = diffDays <= 5;

    if (diffDays < 0) {
        return {
            state: 'due', isAlert: true, sdAmt, holdMonths, diffDays, dueISO,
            text: `💰 SD Overdue (${Math.abs(diffDays)}d) • ₹${sdAmt.toLocaleString('en-IN')}`,
            bg: '#fef2f2', color: '#b91c1c', border: '#fca5a5'
        };
    }
    if (diffDays === 0) {
        return {
            state: 'due', isAlert: true, sdAmt, holdMonths, diffDays: 0, dueISO,
            text: `💰 SD Refund Today! • ₹${sdAmt.toLocaleString('en-IN')}`,
            bg: '#ffedd5', color: '#c2410c', border: '#fdba74'
        };
    }
    if (diffDays <= 5) {
        return {
            state: 'due', isAlert: true, sdAmt, holdMonths, diffDays, dueISO,
            text: `💰 SD Refund in ${diffDays}d • ₹${sdAmt.toLocaleString('en-IN')}`,
            bg: '#fef9c3', color: '#a16207', border: '#fde047'
        };
    }

    return {
        state: 'waiting', isAlert: false, sdAmt, holdMonths, diffDays, dueISO,
        text: `🔒 SD ₹${sdAmt.toLocaleString('en-IN')} • Due: ${formatDate(dueISO)}`,
        bg: '#eef2ff', color: '#3730a3', border: '#c7d2fe'
    };
}

function getAlertPOItems() {
    let alerts = [];
    getArray(appData.poRecords).forEach(p => {
        let typeLabel = p.poType === 'Civil PO' ? 'CIVIL PO' : (p.poType === 'AMC PO' ? 'AMC PO' : 'PO');

        // Ongoing PO alerts (Deadline & Recurring Bill Cycle)
        if (!p.isCompleted) {
            let dlStatus = getPODeadlineStatus(p.deadline, p.isCompleted);
            let monthAlert = getPOMonthAlertStatus(p);

            if (dlStatus && dlStatus.isAlert) {
                alerts.push({
                    po: p, isBillCycle: false, isSDRefund: false,
                    kind: `${typeLabel} DEADLINE`,
                    badgeText: dlStatus.text,
                    bg: dlStatus.bg, color: dlStatus.color, border: dlStatus.border,
                    dateText: `Due: ${formatDate(p.deadline)}`,
                    priority: dlStatus.days
                });
            }

            if (monthAlert && monthAlert.isAlert) {
                let dueDateInfo = monthAlert.dueCyclesCount > 1
                    ? `Due: ${formatDate(monthAlert.dueISO)} → ${formatDate(monthAlert.lastDueISO)}`
                    : `Bill Due: ${formatDate(monthAlert.dueISO)}`;
                alerts.push({
                    po: p, isBillCycle: true, isSDRefund: false,
                    billNo: monthAlert.billNo,
                    dueCyclesCount: monthAlert.dueCyclesCount,
                    totalDueMonths: monthAlert.totalDueMonths,
                    kind: `${typeLabel} • ${monthAlert.alertMonths}M CYCLE`,
                    badgeText: monthAlert.text,
                    bg: monthAlert.bg, color: monthAlert.color, border: monthAlert.border,
                    dateText: dueDateInfo,
                    priority: monthAlert.diffDays
                });
            }
        }

        // Security Deposit Refund Alert (stays active even AFTER PO is Completed)
        let sdStatus = getPOSDStatus(p);
        if (sdStatus && sdStatus.isAlert) {
            alerts.push({
                po: p, isBillCycle: false, isSDRefund: true,
                sdAmt: sdStatus.sdAmt,
                kind: `${typeLabel} • SD REFUND (${sdStatus.holdMonths}M)`,
                badgeText: sdStatus.text,
                bg: sdStatus.bg, color: sdStatus.color, border: sdStatus.border,
                dateText: `Refund Due: ${formatDate(sdStatus.dueISO)}`,
                priority: sdStatus.diffDays
            });
        }
    });
    return alerts.sort((a, b) => a.priority - b.priority);
}

async function markPOBillDone(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;

    let currentCycles = parseInt(p.completedCycles, 10) || 0;
    let alertMonths = getEffectiveAlertMonths(p);
    let monthAlert = getPOMonthAlertStatus(p);
    let dueCount = (monthAlert && monthAlert.dueCyclesCount) ? monthAlert.dueCyclesCount : 1;
    let claimCycles = 1;

    if (alertMonths > 0 && p.date) {
        let lines = [];
        for (let k = 1; k <= Math.max(dueCount, 2); k++) {
            let mTotal = k * alertMonths;
            let bFrom = currentCycles + 1;
            let bTo = currentCycles + k;
            let tag = k === 1 ? `Bill #${bFrom}` : `Bill #${bFrom}–#${bTo}`;
            lines.push(`${k} = ${mTotal} Months (${tag})`);
        }
        let headerInfo = dueCount > 1
            ? `Abhi ${dueCount} cycles (${dueCount * alertMonths} Months) due hain.`
            : `Abhi Bill #${currentCycles + 1} (${alertMonths}M) due hai.`;

        let input = prompt(
            `🧾 Claim Bill: ${p.authority} (${p.poNo})\n${headerInfo}\n\nKitne cycles ek saath claim kar rahe hain?\n${lines.join('\n')}`,
            String(dueCount)
        );
        if (input === null) return;
        claimCycles = parseInt(input.trim(), 10);
        if (isNaN(claimCycles) || claimCycles < 1 || claimCycles > 24) {
            return alert("⚠️ Valid cycle number daalein (jaise 1 ya 2).");
        }
    } else {
        if (!confirm(`🧾 Bill #${currentCycles + 1} (${p.authority} - ${p.poNo}) claim mark karein?`)) return;
    }

    p.completedCycles = currentCycles + claimCycles;
    delete p.nextAlertDate;

    await saveDataToLocal();
    updatePOTabBadge();

    if (document.getElementById('poTableBody')) {
        renderPOTableRows();
    } else if (currentActiveTab === 'tab-overview') {
        injectPOAlertBanner();
    }
}

async function undoPOBillClaim(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;

    let currentCycles = parseInt(p.completedCycles, 10) || 0;
    if (currentCycles <= 0) return;

    let alertM = getEffectiveAlertMonths(p);
    let input = prompt(
        `↩️ Undo Claimed Bill: ${p.authority} (${p.poNo})\nAbhi ${currentCycles} bill${currentCycles > 1 ? 's' : ''}${alertM > 0 ? ` (${currentCycles * alertM}M)` : ''} claimed hain.\n\nKitne claimed bills rakhne hain?\n• ${currentCycles - 1} = Last 1 bill undo\n• 0 = Sabhi undo (reset)`,
        String(currentCycles - 1)
    );
    if (input === null) return;

    let newCount = parseInt(input.trim(), 10);
    if (isNaN(newCount) || newCount < 0 || newCount > 24) {
        return alert("⚠️ Valid number daalein (0 ya usse zyada).");
    }

    p.completedCycles = newCount;
    await saveDataToLocal();
    updatePOTabBadge();

    if (document.getElementById('poTableBody')) {
        renderPOTableRows();
    } else if (currentActiveTab === 'tab-overview') {
        injectPOAlertBanner();
    }
}

async function togglePOSDReceived(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;
    let sdAmt = parseFloat(p.sdAmount) || 0;
    if (sdAmt <= 0) return;

    if (!p.sdReceived) {
        if (!confirm(`💰 Security Deposit ₹${sdAmt.toLocaleString('en-IN')} (${p.authority} - ${p.poNo}) wapas mil gaya?\n\nOK dabate hi SD Refund alert band ho jayega.`)) return;
        p.sdReceived = true;
        p.sdReceivedDate = new Date().toISOString().split('T')[0];
    } else {
        if (!confirm(`Kya is PO ka Security Deposit (₹${sdAmt.toLocaleString('en-IN')}) wapas Pending mark karna hai?`)) return;
        p.sdReceived = false;
        p.sdReceivedDate = '';
    }

    await saveDataToLocal();
    updatePOTabBadge();

    if (document.getElementById('poTableBody')) {
        renderPOTableRows();
    } else if (currentActiveTab === 'tab-overview') {
        showAdminOverview();
    }
}

// ====== BACKGROUND PO UPLOAD QUEUE & DIRECT DOWNLOAD ======
let poUploadQueue = [];
let isProcessingPOQueue = false;
const activeUploadingPOIds = new Set();

function queuePOBackgroundUpload(task) {
    activeUploadingPOIds.add(String(task.poId));
    poUploadQueue.push(task);
    if (document.getElementById('poTableBody')) renderPOTableRows();
    if (!isProcessingPOQueue) processPOUploadQueue();
}

async function processPOUploadQueue() {
    if (isProcessingPOQueue) return;
    isProcessingPOQueue = true;

    while (poUploadQueue.length > 0) {
        let task = poUploadQueue.shift();
        try {
            let uploadedUrl = await uploadToImgBB(task.b64, task.fileName);
            appData.poRecords = getArray(appData.poRecords);
            let idx = appData.poRecords.findIndex(p => String(p.id) === String(task.poId));

            if (idx !== -1) {
                if (uploadedUrl) {
                    appData.poRecords[idx].photo = uploadedUrl;
                    if (task.oldPhotoUrl && task.oldPhotoUrl !== uploadedUrl) {
                        deleteFromGoogleDrive(task.oldPhotoUrl);
                    }
                    await saveDataToLocal();
                }
            } else if (uploadedUrl) {
                deleteFromGoogleDrive(uploadedUrl);
            }
        } catch (err) {
            // Upload failed or cancelled
        } finally {
            activeUploadingPOIds.delete(String(task.poId));
            if (document.getElementById('poTableBody')) renderPOTableRows();
        }
    }

    isProcessingPOQueue = false;
}

function downloadPOAttachment(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p || !p.photo) return;

    let fileId = (typeof extractDriveFileId === 'function') ? extractDriveFileId(p.photo) : '';
    if (fileId) {
        let dlUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
        let a = document.createElement('a');
        a.href = dlUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        return;
    }

    fetch(p.photo)
        .then(r => r.blob())
        .then(blob => {
            let objUrl = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = objUrl;
            a.download = 'PO_' + String(p.poNo || Date.now()).replace(/[^a-zA-Z0-9_-]/g, '_') + '.jpg';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(objUrl), 2000);
        })
        .catch(() => window.open(p.photo, '_blank'));
}

function renderPOTableRows() {
    let tbody = document.getElementById('poTableBody'); if (!tbody) return;
    let searchEl = document.getElementById('poSearchInput'); let query = searchEl ? searchEl.value.toLowerCase() : '';
    let filterEl = document.getElementById('poFilterMode'); let filterMode = filterEl ? filterEl.value : 'all';
    let allPOs = [...getArray(appData.poRecords)];

    // Update Pending SD summary bar
    let sdBar = document.getElementById('poSDSummaryBar');
    if (sdBar) {
        let pendingSDList = allPOs.filter(p => (parseFloat(p.sdAmount) || 0) > 0 && !p.sdReceived);
        let pendingSDTotal = pendingSDList.reduce((acc, p) => acc + (parseFloat(p.sdAmount) || 0), 0);
        let dueSDCount = pendingSDList.filter(p => { let s = getPOSDStatus(p); return s && s.isAlert; }).length;
        if (pendingSDList.length > 0) {
            sdBar.innerHTML = `<span style="background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:700;">🔒 Pending SD: ₹${pendingSDTotal.toLocaleString('en-IN')} (${pendingSDList.length} PO${pendingSDList.length > 1 ? 's' : ''})</span>` +
                (dueSDCount > 0 ? `<span style="background:#fef2f2; border:1px solid #fca5a5; color:#b91c1c; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:700;">💰 ${dueSDCount} SD Refund Due Now!</span>` : '');
        } else {
            sdBar.innerHTML = '';
        }
    }

    let poList = allPOs;
    if (filterMode === 'ongoing') poList = poList.filter(p => !p.isCompleted);
    else if (filterMode === 'completed') poList = poList.filter(p => p.isCompleted);
    else if (filterMode === 'pending_sd') poList = poList.filter(p => (parseFloat(p.sdAmount) || 0) > 0 && !p.sdReceived);

    if (query) {
        poList = poList.filter(p =>
            (p.poNo && p.poNo.toLowerCase().includes(query)) ||
            (p.authority && p.authority.toLowerCase().includes(query)) ||
            (p.workDesc && p.workDesc.toLowerCase().includes(query)) ||
            ((p.poType || 'General PO').toLowerCase().includes(query))
        );
    }

    poList.sort((a, b) => {
        let sdA = getPOSDStatus(a), sdB = getPOSDStatus(b);
        let dlA = getPODeadlineStatus(a.deadline, a.isCompleted), dlB = getPODeadlineStatus(b.deadline, b.isCompleted);
        let maA = getPOMonthAlertStatus(a), maB = getPOMonthAlertStatus(b);

        let aAlert = (dlA && dlA.isAlert) || (maA && maA.isAlert) || (sdA && sdA.isAlert);
        let bAlert = (dlB && dlB.isAlert) || (maB && maB.isAlert) || (sdB && sdB.isAlert);
        if (aAlert !== bAlert) return aAlert ? -1 : 1;

        let aPendingSD = (parseFloat(a.sdAmount) || 0) > 0 && !a.sdReceived;
        let bPendingSD = (parseFloat(b.sdAmount) || 0) > 0 && !b.sdReceived;
        let aGroup = !a.isCompleted ? 0 : (aPendingSD ? 1 : 2);
        let bGroup = !b.isCompleted ? 0 : (bPendingSD ? 1 : 2);
        if (aGroup !== bGroup) return aGroup - bGroup;

        let aScore = Math.min(maA ? maA.diffDays : Infinity, dlA ? dlA.days : Infinity, sdA ? sdA.diffDays : Infinity);
        let bScore = Math.min(maB ? maB.diffDays : Infinity, dlB ? dlB.days : Infinity, sdB ? sdB.diffDays : Infinity);
        if (aScore !== bScore) return aScore - bScore;
        return 0;
    });

    let historyRows = poList.map(p => {
        let status = getPODeadlineStatus(p.deadline, p.isCompleted);
        let monthAlert = getPOMonthAlertStatus(p);
        let sdStatus = getPOSDStatus(p);
        let isCivil = (p.poType === 'Civil PO');
        let isAMC = (p.poType === 'AMC PO');
        let cyclesDone = parseInt(p.completedCycles, 10) || 0;
        let alertM = getEffectiveAlertMonths(p);

        let isUrgent = (status && status.isAlert) || (monthAlert && monthAlert.isAlert) || (sdStatus && sdStatus.isAlert);
        let rowBg = isUrgent
            ? 'background:#fff5f5;'
            : (p.isCompleted ? (sdStatus && sdStatus.state !== 'received' ? 'background:#f5f7ff;' : 'background:#eefdf6; color:#555;') : 'background:#fff;');

        let statusBtn = p.isCompleted
            ? `<button onclick="togglePOStatus('${p.id}')" style="background:#07865b; padding:4px 8px; border-radius:4px; font-size:11px; color:white; border:none; cursor:pointer; width:82px;">✅ Completed</button>`
            : `<button onclick="togglePOStatus('${p.id}')" style="background:#f39c12; padding:4px 8px; border-radius:4px; font-size:11px; color:white; border:none; cursor:pointer; width:82px;">⏳ Ongoing</button>`;

        let claimBtnLabel = (monthAlert && monthAlert.dueCyclesCount > 1 && monthAlert.totalDueMonths > 0)
            ? `🧾 Claim (${monthAlert.totalDueMonths}M)`
            : `🧾 Claim Bill`;

        let billDoneBtn = (!p.isCompleted && monthAlert && monthAlert.isAlert)
            ? `<button onclick="markPOBillDone('${p.id}')" style="background:#7c3aed; padding:4px 8px; border-radius:4px; font-size:11px; color:white; border:none; cursor:pointer; white-space:nowrap;" title="Click karke 1 ya multiple cycles (3M / 6M) claim mark karein">${claimBtnLabel}</button>`
            : '';

        let sdBtn = '';
        if (sdStatus && !p.sdReceived && (sdStatus.isAlert || p.isCompleted)) {
            sdBtn = `<button onclick="togglePOSDReceived('${p.id}')" style="background:#4f46e5; padding:4px 8px; border-radius:4px; font-size:11px; color:white; border:none; cursor:pointer; white-space:nowrap;" title="Security Deposit wapas mil gaya mark karein">💰 SD Received</button>`;
        }

        let proofHTML = '-';
        if (activeUploadingPOIds.has(String(p.id))) {
            proofHTML = `<span style="font-size:11px; color:#059669; font-weight:700; white-space:nowrap;">⏳ Uploading...</span>`;
        } else if (p.photo && p.photo.length > 5) {
            let icon = p.photo.includes('/file/d/') ? '📄' : '📷';
            proofHTML = `<div style="display:inline-flex; align-items:center; gap:6px;">
                <a href="${p.photo}" target="_blank" style="color:#2980b9; font-weight:bold; text-decoration:none; font-size:16px;" title="View Copy">${icon}</a>
                <button type="button" onclick="downloadPOAttachment('${p.id}')" style="background:#eef2ff; color:#1d4ed8; border:1px solid #c7d2fe; padding:3px 6px; border-radius:6px; font-size:12px; cursor:pointer; line-height:1;" title="Download Copy">⬇️</button>
            </div>`;
        } else if (p.link && p.link.length > 5) {
            proofHTML = `<a href="${p.link}" target="_blank" style="color:#2980b9; font-weight:bold; text-decoration:none; font-size:16px;">🔗</a>`;
        }

        let typeBadge = '';
        if (isCivil) {
            typeBadge = `<span style="font-size:10px; background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; padding:1px 6px; border-radius:4px; font-weight:700; margin-left:4px;">🏗️ Civil PO</span>`;
        } else if (isAMC) {
            typeBadge = `<span style="font-size:10px; background:#ede9fe; color:#6d28d9; border:1px solid #ddd6fe; padding:1px 6px; border-radius:4px; font-weight:700; margin-left:4px;">🔧 AMC PO</span>`;
        }

        let ageBadge = monthAlert
            ? `<br><span style="display:inline-block; margin-top:3px; background:${monthAlert.bg}; color:${monthAlert.color}; border:1px solid ${monthAlert.border}; padding:1px 6px; border-radius:99px; font-size:10px; font-weight:700; white-space:nowrap;">${monthAlert.text}</span>`
            : '';

        let cyclesNote = (!p.isCompleted && cyclesDone > 0)
            ? `<br><span onclick="undoPOBillClaim('${p.id}')" title="Click karke claimed bill undo / adjust karein" style="cursor:pointer; display:inline-block; margin-top:3px; font-size:10px; color:#047857; background:#ecfdf5; border:1px dashed #6ee7b7; padding:1px 6px; border-radius:99px; font-weight:700;">✓ ${cyclesDone} Bill${cyclesDone > 1 ? 's' : ''} Claimed${alertM > 0 ? ` (${cyclesDone * alertM}M)` : ''} ↩️</span>`
            : '';

        let compNote = p.completedDate
            ? `<br><span style="font-size:10px; color:#475569;">Done: ${formatDate(p.completedDate)}</span>`
            : '';

        let deadlineBadge = status
            ? `<br><span style="display:inline-block; margin-top:3px; background:${status.bg}; color:${status.color}; border:1px solid ${status.border}; padding:1px 6px; border-radius:99px; font-size:10px; font-weight:700; white-space:nowrap;">${status.text}</span>`
            : '';

        let sdBadge = sdStatus
            ? `<br><span ${p.sdReceived ? `onclick="togglePOSDReceived('${p.id}')" title="Click to undo SD Refunded" style="cursor:pointer;` : `style="`}display:inline-block; margin-top:3px; background:${sdStatus.bg}; color:${sdStatus.color}; border:1px solid ${sdStatus.border}; padding:1px 6px; border-radius:99px; font-size:10px; font-weight:700; white-space:nowrap;">${sdStatus.text}</span>`
            : '';

        return `<tr style="${rowBg}">
            <td style="white-space:nowrap;">${formatDate(p.date)}${ageBadge}${cyclesNote}${compNote}</td>
            <td><b>${p.authority}</b>${typeBadge}<br><span style="font-size:11px;color:#555;">${p.workDesc}</span></td>
            <td>${p.poNo}</td>
            <td style="white-space:nowrap;">${p.deadline ? formatDate(p.deadline) : '-'}${deadlineBadge}${sdBadge}</td>
            <td style="font-weight:bold;">₹${p.amount}</td>
            <td style="text-align:center;">${proofHTML}</td>
            <td>
                <div style="display:flex; gap:4px; justify-content:center; align-items:center; flex-wrap:wrap;">
                    ${billDoneBtn}
                    ${sdBtn}
                    ${statusBtn}
                    <button onclick="editPO('${p.id}')" style="background:#3498db; padding:4px 6px; border-radius:4px; font-size:12px; color:white; border:none; cursor:pointer;">✏️</button>
                    <button onclick="deletePO('${p.id}')" style="background:#e21d4f; padding:4px 6px; border-radius:4px; font-size:12px; color:white; border:none; cursor:pointer;">🗑️</button>
                </div>
            </td>
        </tr>`;
    }).join('');

    tbody.innerHTML = historyRows || `<tr><td colspan="7" style="text-align:center; color:#888;">No Purchase Orders found</td></tr>`;
    updatePOTabBadge();
}

async function savePO() {
    let date = document.getElementById('poDate').value;
    let poTypeEl = document.getElementById('poType');
    let poType = poTypeEl ? poTypeEl.value : 'General PO';
    let alertEl = document.getElementById('poAlertMonths');
    let alertMonths = alertEl ? parseInt(alertEl.value, 10) || 0 : 0;
    let sdAmtEl = document.getElementById('poSDAmount');
    let sdAmount = sdAmtEl ? sdAmtEl.value.trim() : '';
    let sdMonthsEl = document.getElementById('poSDMonths');
    let sdHoldMonths = sdMonthsEl ? parseInt(sdMonthsEl.value, 10) || 6 : 6;
    let compDateEl = document.getElementById('poCompletedDate');
    let completedDate = compDateEl ? compDateEl.value.trim() : '';
    let authority = document.getElementById('poAuthority').value.trim();
    let poNo = document.getElementById('poNumber').value.trim();
    let workDesc = document.getElementById('poWorkDesc').value.trim();
    let amount = document.getElementById('poAmount').value;
    let deadline = document.getElementById('poDeadline').value;
    let photoInput = document.getElementById('poPhoto');
    let file = photoInput.files[0];

    if (!authority || !poNo || !amount) return alert("Authority, PO Number and Amount required!");
    let isPDF = file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));
    if (file && !file.type.startsWith('image/') && !isPDF) return alert("⚠️ ERROR: Sirf Image ya PDF file upload karein!");

    let btn = document.getElementById('poSaveBtn'); let originalText = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;
    try {
        appData.poRecords = getArray(appData.poRecords);
        let isDuplicatePO = appData.poRecords.some(p => String(p.id) !== String(currentPOEditId) && p.poNo.toLowerCase() === poNo.toLowerCase());
        if (isDuplicatePO) { btn.innerText = originalText; btn.disabled = false; return alert(`❌ DUPLICATE PO!`); }

        let existingPO = currentPOEditId ? appData.poRecords.find(p => String(p.id) === String(currentPOEditId)) : null;
        let existingPhotoUrl = existingPO && existingPO.photo ? existingPO.photo : '';
        let oldLink = existingPO && existingPO.link ? existingPO.link : '';

        let preparedB64 = '';
        let safeName = '';
        if (file) {
            preparedB64 = await compressImage(file);
            if (!preparedB64) { btn.innerText = originalText; btn.disabled = false; return; }
            safeName = 'PO_' + poNo.replace(/[^a-zA-Z0-9_-]/g, '_') + (isPDF ? '.pdf' : '.jpg');
        }

        let hasSD = (parseFloat(sdAmount) || 0) > 0;
        let newPO = {
            id: currentPOEditId || Date.now(),
            date,
            poType,
            alertMonths,
            completedCycles: existingPO ? (parseInt(existingPO.completedCycles, 10) || 0) : 0,
            sdAmount: hasSD ? sdAmount : '',
            sdHoldMonths,
            completedDate,
            sdReceived: (existingPO && hasSD) ? !!existingPO.sdReceived : false,
            sdReceivedDate: (existingPO && hasSD) ? (existingPO.sdReceivedDate || '') : '',
            authority,
            poNo,
            workDesc,
            amount,
            deadline,
            photo: existingPhotoUrl || '',
            link: oldLink || '',
            isCompleted: existingPO ? existingPO.isCompleted : !!completedDate
        };

        if (currentPOEditId) {
            let idx = appData.poRecords.findIndex(p => String(p.id) === String(currentPOEditId));
            appData.poRecords[idx] = newPO;
            currentPOEditId = null;
        } else {
            appData.poRecords.unshift(newPO);
        }

        await saveDataToLocal();
        showPOTracker();

        if (file && preparedB64) {
            queuePOBackgroundUpload({
                poId: newPO.id,
                b64: preparedB64,
                fileName: safeName,
                oldPhotoUrl: existingPhotoUrl
            });
        }
    } catch (e) {
        alert("Error saving: " + e.message);
        btn.innerText = originalText;
        btn.disabled = false;
    }
}

function togglePOStatus(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;

    if (!p.isCompleted) {
        let sdAmt = parseFloat(p.sdAmount) || 0;
        if (sdAmt > 0 && !p.sdReceived) {
            let holdM = parseInt(p.sdHoldMonths, 10) || 6;
            let defaultDate = p.completedDate || new Date().toISOString().split('T')[0];
            let entered = prompt(
                `🔒 Is PO mein ₹${sdAmt.toLocaleString('en-IN')} Security Money hai.\n\nWork Completion Date confirm karein (YYYY-MM-DD):\n(Is date se ${holdM} mahine baad SD Refund alert aayega)`,
                defaultDate
            );
            if (entered === null) return;
            entered = entered.trim() || defaultDate;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(entered) || !parseISODateLocal(entered)) {
                return alert("⚠️ Valid date format YYYY-MM-DD daalein (jaise 2026-11-21)");
            }
            p.completedDate = entered;
        }
        p.isCompleted = true;
    } else {
        p.isCompleted = false;
    }

    saveDataToLocal().then(() => renderPOTableRows());
}

async function deletePO(id) {
    if (!confirm("Are you sure you want to delete this PO? (Drive se attached file bhi delete ho jayegi)")) return;
    let targetPO = getArray(appData.poRecords).find(p => String(p.id) === String(id));

    poUploadQueue = poUploadQueue.filter(t => String(t.poId) !== String(id));
    activeUploadingPOIds.delete(String(id));

    if (targetPO && targetPO.photo && typeof extractDriveFileId === 'function' && extractDriveFileId(targetPO.photo)) {
        updateUploadBar(45, 'Deleting PO copy from Drive...', '🗑️ Deleting File...');
        await deleteFromGoogleDrive(targetPO.photo);
        updateUploadBar(100, '✅ File deleted from Drive!', '🗑️ Deleting File...');
        await new Promise(r => setTimeout(r, 350));
        hideUploadBar();
    }

    appData.poRecords = getArray(appData.poRecords).filter(p => String(p.id) !== String(id));
    await saveDataToLocal();
    renderPOTableRows();
}

function editPO(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (p) {

function renderInvTable() {

    let invs = [...getArray(appData.invoices)];
    if (statusFilter === 'pending') invs = invs.filter(i => !i.isPaid);
    else if (statusFilter === 'paid') invs = invs.filter(i => i.isPaid);

    if (query) {
        invs = invs.filter(inv => {
            let itemsText = getArray(inv.items).map(it => it.desc || '').join(' ').toLowerCase();
            return (inv.invNo && inv.invNo.toLowerCase().includes(query)) ||
                   (inv.bName && inv.bName.toLowerCase().includes(query)) ||
                   (inv.bAdd && inv.bAdd.toLowerCase().includes(query)) ||
                   (inv.date && inv.date.toLowerCase().includes(query)) ||
                   itemsText.includes(query);
        });
    }

    invs.sort((a, b) => Number(!!a.isPaid) - Number(!!b.isPaid));

    let rows = invs.map(inv => {
        let rowBg = inv.isPaid ? 'background:#eefdf6; color:#555;' : 'background:#fff;';

        let itemsArr = getArray(inv.items);
        let itemSummary = itemsArr.length > 0 ? itemsArr[0].desc : 'No items';

        let locSub = inv.bAdd ? `<span style="font-size:11px; color:#64748b;"> (${inv.bAdd})</span>` : '';

            <td style="white-space:nowrap;">${inv.date || '-'}</td>
            <td><b>${inv.bName || '-'}</b>${locSub}<br><span style="font-size:11px;color:#555;">${itemSummary}</span></td>

function addBillItem(desc = '', qty = 1, rate = 0) {
    let tbody = document.getElementById('billItemsContainer');
    if (!tbody) return;
    let rowId = 'b-item-' + Date.now() + Math.floor(Math.random() * 1000);
    let tr = document.createElement('tr');
    tr.id = rowId;
    tr.innerHTML = `
        <td><input class="b-desc" list="dlDescs" value="${desc}" placeholder="Item / Work details..." oninput="calcBill()" style="margin:0; padding:8px;"></td>
        <td><input class="b-qty" type="number" value="${qty}" oninput="calcBill()" style="margin:0; padding:8px;"></td>
        <td><input class="b-rate" type="number" value="${rate}" oninput="calcBill()" style="margin:0; padding:8px;"></td>
        <td class="b-total" style="text-align:center; font-weight:bold;">0.00</td>
        <td style="text-align:center;"><button onclick="document.getElementById('${rowId}').remove(); calcBill();" style="background:#e21d4f; color:white; border:none; border-radius:5px; padding:5px 8px;">✖</button></td>`;
    tbody.appendChild(tr);
    calcBill();
}

function calcBill() {
    let total = 0;
    document.querySelectorAll('#billItemsContainer tr').forEach(row => {
        let q = parseFloat(row.querySelector('.b-qty').value) || 0;
        let r = parseFloat(row.querySelector('.b-rate').value) || 0;
        let t = q * r;
        row.querySelector('.b-total').innerText = t.toFixed(2);
        total += t;
    });
    let gtEl = document.getElementById('billGrandTotal');
    if (gtEl) gtEl.innerText = total.toFixed(2);

async function savePettyCash() {
    let bName = document.getElementById('invBuyerName').value.trim();
    let bAdd = document.getElementById('invAddress').value.trim();
    let invNo = document.getElementById('invNumber').value.trim();
    let date = document.getElementById('invDate').value.trim();
    let gTotal = parseFloat(document.getElementById('billGrandTotal').innerText || 0).toFixed(2);

    let itemsToSave = [];
    document.querySelectorAll('#billItemsContainer tr').forEach(r => {
        let d = r.querySelector('.b-desc').value.trim();
        let q = r.querySelector('.b-qty').value;
        let ra = parseFloat(r.querySelector('.b-rate').value || 0).toFixed(2);
        let t = parseFloat(r.querySelector('.b-total').innerText || 0).toFixed(2);
        if (d) itemsToSave.push({ desc: d, qty: q, rate: ra, total: t });
    });

    if (!bName) return alert("Name / Party is required!");
    if (!invNo) return alert("Voucher / Bill No. is required!");
    if (!itemsToSave.length) return alert("Add at least 1 item!");

    appData.invoices = getArray(appData.invoices);
    let isDuplicateInv = appData.invoices.some(i => String(i.id) !== String(currentInvoiceEditId) && i.invNo && i.invNo.toLowerCase() === invNo.toLowerCase());
    if (isDuplicateInv) return alert("❌ DUPLICATE VOUCHER NO!");

    let btn = document.getElementById('invoiceSaveBtn');
    let origText = btn.innerText;
    btn.innerText = "⏳ Saving...";
    btn.disabled = true;

    try {
        let existing = currentInvoiceEditId ? appData.invoices.find(i => String(i.id) === String(currentInvoiceEditId)) : null;
        let invData = {
            id: currentInvoiceEditId || Date.now(),
            invNo,
            date,
            bName,
            bAdd,
            bGST: existing ? (existing.bGST || '') : '',
            bPin: existing ? (existing.bPin || '') : '',
            gTotal,
            items: itemsToSave,
            isPaid: existing ? !!existing.isPaid : false
        };

        if (currentInvoiceEditId) {
            let idx = appData.invoices.findIndex(i => String(i.id) === String(currentInvoiceEditId));
            appData.invoices[idx] = invData;
            currentInvoiceEditId = null;
        } else {
            appData.invoices.unshift(invData);
            appData.invoiceCount = (appData.invoiceCount || 314) + 1;
        }

        await saveDataToLocal();
        showInvoice();
    } catch (e) {
        alert("Error saving: " + e.message);
        btn.innerText = origText;
        btn.disabled = false;
    }
}

function togglePayStatus(id) {
    let i = getArray(appData.invoices).find(x => String(x.id) === String(id));
    if (i) {
        i.isPaid = !i.isPaid;
        saveDataToLocal().then(() => showInvoice());
    }
}

function deleteInvoice(id) {

        appData.invoices = getArray(appData.invoices).filter(x => String(x.id) !== String(id));
        saveDataToLocal().then(() => showInvoice());

function editInvoice(id) {
    let i = getArray(appData.invoices).find(x => String(x.id) === String(id));
    if (i) {
        currentInvoiceEditId = id;
        document.getElementById('invBuyerName').value = i.bName || '';

        document.getElementById('invNumber').value = i.invNo || '';

function showCarryForward() {

    document.getElementById('profileArea').innerHTML = `<div class="card"><h2>🔄 Historical CF Balance</h2><div style="background:#eff7f3; padding:20px; border-radius:12px; border:1px solid #dfe9e5;"><label>Select Partner</label><select id="cfP" onchange="calcCF()"><option value="Tanmoy">Tanmoy</option><option value="Tapabrata">Tapabrata</option></select><label>Select Month</label>${selectHTML}<br><br><b id="cfResult" style="font-size:24px;">₹ 0</b></div></div>`;

function calcCF() {
    let pEl = document.getElementById('cfP'); if (!pEl) return; let p = pEl.value; let cfMEl = document.getElementById('cfM'); if (!cfMEl) return; let monthInput = cfMEl.value;
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + "-01" : "2026-08-01";
    if (monthInput === "All Time") { let validNet = 0; getArray(appData.records[p]).forEach(r => { if (appData.config?.enablePastCF || (r.date && r.date >= cutoffDate)) validNet += (r.type === 'income') ? (parseFloat(r.amount) || 0) : -(parseFloat(r.amount) || 0); }); document.getElementById('cfResult').innerText = "₹ " + validNet.toLocaleString('en-IN'); return; }
    let m = monthInput.split(' '); let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(m[0]); let endOfSelectedMonth = new Date(parseInt(m[1]), mIdx + 1, 0, 23, 59, 59);
    let validPastNet = 0; getArray(appData.records[p]).forEach(r => { if (r.date) { let rParts = r.date.split('-'); if (rParts.length === 3) { let rDate = new Date(parseInt(rParts[0]), parseInt(rParts[1]) - 1, parseInt(rParts[2]), 12, 0, 0); if (rDate <= endOfSelectedMonth) { if (appData.config?.enablePastCF || r.date >= cutoffDate) validPastNet += (r.type === 'income') ? (parseFloat(r.amount) || 0) : -(parseFloat(r.amount) || 0); } } } });
    document.getElementById('cfResult').innerText = "₹ " + validPastNet.toLocaleString('en-IN');
}

            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
                <div style="flex:1; min-width:150px;"><label>Amount (₹)</label><input type="number" id="vAmount" placeholder="0.00"></div>
                <div style="flex:2; min-width:200px;"><label>Details (Optional)</label><input id="vDetails" list="dlVDet" placeholder="Description..."></div>
            </div>
            <label>Bill Photo</label><input type="file" id="vPhoto" accept="image/*" style="border:none; padding:0; margin-bottom:15px;">
            <button id="vSaveBtn" onclick="saveVehicle()" style="width:100%; background:#e67e22; font-size:16px; padding:12px;">💾 Save Vehicle Expense</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
            <h2 style="margin:0;">📋 Vehicle History <span style="font-size:14px; color:#555; font-weight:normal;">${displayMonthText}</span></h2>
            <input type="text" id="vehSearchInput" placeholder="🔍 Search..." oninput="renderVehicleTable()" style="max-width:250px; margin:0; padding:8px 12px; border-radius:8px; border:1px solid #ccd8d4;">
        </div>
        <div style="overflow-x:auto;">
            <table style="min-width:700px;">
                <thead><tr><th>Date</th><th>Car</th><th>Category</th><th>Details</th><th>Paid By</th><th style="text-align:center;">Proof</th><th>Amount</th><th style="text-align:center;">Action</th></tr></thead>
                <tbody id="vTableBody"></tbody>
            </table>
        </div>
    </div>`;
    renderVehicleTable();
    calcMonthlyFuel();
}

function calcMonthlyFuel() {
    let elCar = document.getElementById('fuelCarFilter'); let filterCar = elCar ? elCar.value : 'All';
    let elCat = document.getElementById('fuelCatFilter'); let filterCat = elCat ? elCat.value : 'Fuel';
    let fuelTotal = 0;

    let hm = document.getElementById('headerMonthSelect'); let globalMonth = hm ? hm.value : ''; let monthQuery = '';
    if (globalMonth && globalMonth !== 'All Time') { let parts = globalMonth.split(' '); let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1; let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString(); monthQuery = parts[1] + '-' + mStr; }

    getArray(appData.vehicles).forEach(v => {
        if (!monthQuery || (v.date && v.date.startsWith(monthQuery))) {
            let amt = parseFloat(v.amount) || 0;
            let matchCar = (filterCar === 'All' || v.car === filterCar || (filterCar === 'Tcl car' && v.car === 'Car 1') || (filterCar === 'Dcl car' && v.car === 'Car 2'));
            let matchCat = (v.category === filterCat);
            if (matchCar && matchCat) { fuelTotal += amt; }
        }
    });

    let display = document.getElementById('fuelMonthDisplay');
    if (display) display.innerText = '₹' + fuelTotal.toLocaleString('en-IN');
}

function renderVehicleTable() {
    let tbody = document.getElementById('vTableBody'); if (!tbody) return;
    let hm = document.getElementById('headerMonthSelect'); let globalMonth = hm ? hm.value : ''; let monthQuery = '';
    if (globalMonth && globalMonth !== 'All Time') { let parts = globalMonth.split(' '); let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1; let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString(); monthQuery = parts[1] + '-' + mStr; }

    let searchEl = document.getElementById('vehSearchInput'); let query = searchEl ? searchEl.value.toLowerCase() : '';
    let vList = [...getArray(appData.vehicles)];
    if (monthQuery) vList = vList.filter(v => v.date && v.date.startsWith(monthQuery));
    if (query) vList = vList.filter(v => ((v.car || '').toLowerCase().includes(query)) || ((v.category || '').toLowerCase().includes(query)) || ((v.details || '').toLowerCase().includes(query)) || ((v.amount || '').toString().includes(query)));

    vList.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    let rows = vList.map(v => {
        let proofHTML = '-'; if (v.photo && v.photo.length > 5) proofHTML = `<a href="${v.photo}" target="_blank" style="color:#2980b9; font-weight:bold; text-decoration:none; font-size:16px;">📷</a>`;
        return `<tr><td>${formatDate(v.date)}</td><td><b>${v.car}</b></td><td>${v.category}</td><td>${v.details}</td><td>👤 ${v.paidBy || 'Tanmoy'}</td><td style="text-align:center;">${proofHTML}</td><td style="font-weight:bold; color:#e21d4f;">₹${v.amount}</td><td style="white-space:nowrap;"><button onclick="editVehicle('${v.id}')" style="background:#f39c12; padding:4px 6px; border-radius:4px; font-size:12px; color:white; border:none; cursor:pointer;">✏️</button><button onclick="deleteVehicle('${v.id}')" style="background:#444; padding:4px 6px; border-radius:4px; font-size:12px; color:white; border:none; cursor:pointer; margin-left:4px;">🗑️</button></td></tr>`;
    }).join('');
    tbody.innerHTML = rows || `<tr><td colspan="8" style="text-align:center;">No vehicle expenses found!</td></tr>`;
}

async function saveVehicle() {
    let date = document.getElementById('vDate').value, car = document.getElementById('vCar').value, category = document.getElementById('vCategory').value, details = document.getElementById('vDetails').value.trim(), amount = parseFloat(document.getElementById('vAmount').value), paidBy = document.getElementById('vPaidBy').value; let photoInput = document.getElementById('vPhoto'); let file = photoInput.files[0];
    if (isNaN(amount) || amount <= 0) return alert("Valid Amount is required!"); if (file && !file.type.startsWith('image/')) return alert("⚠️ ERROR: Only image files are allowed!");

    let btn = document.getElementById('vSaveBtn'); let originalText = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;
    try {
        appData.vehicles = getArray(appData.vehicles); appData.records[paidBy] = getArray(appData.records[paidBy]);
        let existingVeh = currentVehicleEditId ? appData.vehicles.find(v => String(v.id) === String(currentVehicleEditId)) : null; let photoUrl = existingVeh && existingVeh.photo ? existingVeh.photo : ''; if (file) { let b64 = await compressImage(file); photoUrl = await uploadToImgBB(b64, 'Veh_' + Date.now() + '.jpg'); } let finalDetails = details || '-';

        let isDuplicateVeh = appData.vehicles.some(v => String(v.id) !== String(currentVehicleEditId) && v.date === date && v.amount === amount && v.car === car && v.category === category && (v.details || '-') === finalDetails);
        if (isDuplicateVeh) { btn.innerText = originalText; btn.disabled = false; return alert("❌ DUPLICATE ENTRY! Same vehicle expense already exists on this date."); }

        let newEntry = { id: currentVehicleEditId || Date.now(), date: date, car: car, category: category, details: finalDetails, amount: amount, photo: photoUrl || '', paidBy: paidBy }; let partnerDesc = details ? `🚗 ${car} - ${category} (${details})` : `🚗 ${car} - ${category}`;

        if (currentVehicleEditId) {
            let oldV = appData.vehicles.find(v => String(v.id) === String(currentVehicleEditId));
            if (oldV) { appData.balances[oldV.paidBy] += oldV.amount; appData.records[oldV.paidBy] = getArray(appData.records[oldV.paidBy]).filter(r => String(r.id) !== String(currentVehicleEditId)); }
            let idx = appData.vehicles.findIndex(v => String(v.id) === String(currentVehicleEditId)); appData.vehicles[idx] = newEntry; currentVehicleEditId = null;
        } else { appData.vehicles.unshift(newEntry); }

        if (!appData.balances[paidBy]) appData.balances[paidBy] = 0; appData.balances[paidBy] -= amount; appData.records[paidBy].unshift({ id: newEntry.id, date: date, details: partnerDesc, amount: amount, type: 'expense', photo: photoUrl || '', link: '', isAuto: true, reconState: 0 });

        window.lastSelectedDate = date;
        await saveDataToLocal(); showVehicles();
    } catch (e) { alert("Error saving."); btn.innerText = originalText; btn.disabled = false; }
}

function deleteVehicle(id) { if (confirm("Are you sure you want to delete this vehicle expense?")) { let oldV = getArray(appData.vehicles).find(x => String(x.id) === String(id)); if (oldV) { appData.balances[oldV.paidBy] += oldV.amount; appData.records[oldV.paidBy] = getArray(appData.records[oldV.paidBy]).filter(r => String(r.id) !== String(id)); appData.vehicles = getArray(appData.vehicles).filter(x => String(x.id) !== String(id)); saveDataToLocal().then(() => showVehicles()); } } }
function editVehicle(id) { let v = getArray(appData.vehicles).find(x => String(x.id) === String(id)); if (v) { currentVehicleEditId = id; document.getElementById('vDate').value = v.date || ''; document.getElementById('vCar').value = v.car || 'Tcl car'; document.getElementById('vCategory').value = v.category || ''; document.getElementById('vDetails').value = (v.details === '-' ? '' : v.details || ''); document.getElementById('vAmount').value = v.amount || ''; let pbEl = document.getElementById('vPaidBy'); if (pbEl) pbEl.value = v.paidBy || 'Tanmoy'; let btn = document.getElementById('vSaveBtn'); if (btn) { btn.innerText = "✏️ Update Expense"; btn.style.background = "#f39c12"; } window.scrollTo({ top: 0 }); } }

</script>
</body>
</html>
