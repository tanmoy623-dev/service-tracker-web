function getArray(data) { if (!data) return []; if (Array.isArray(data)) return data; return Object.values(data); }

// ====== IMAGE COMPRESSION + PDF SUPPORT (UP TO 10 MB) ======
function compressImage(file) {
    return new Promise((resolve) => {
        if (!file) return resolve('');

        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (isPDF) {
            if (file.size > 10 * 1024 * 1024) {
                alert("⚠️ PDF file 10 MB se chhoti honi chahiye!");
                return resolve('');
            }
            let pdfReader = new FileReader();
            pdfReader.onload = (e) => {
                let res = e.target.result || '';
                if (res && !res.startsWith('data:application/pdf')) {
                    res = 'data:application/pdf;base64,' + res.split(',')[1];
                }
                resolve(res);
            };
            pdfReader.onerror = () => resolve('');
            pdfReader.readAsDataURL(file);
            return;
        }

        let reader = new FileReader();
        reader.onload = function(event) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
                let maxW = 800, maxH = 800, w = img.width, h = img.height;
                if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
                else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.onerror = () => resolve('');
            img.src = event.target.result;
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
    });
}

function updateUploadBar(percent, statusText, titleText) {
    let toast = document.getElementById('uploadProgressOverlay');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'uploadProgressOverlay';
        toast.style.cssText = 'position:fixed; bottom:16px; right:16px; width:295px; max-width:calc(100vw - 24px); z-index:99999; pointer-events:auto;';

                    </div>
                    <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                        <span id="uploadBarPct" style="font-weight:800; color:#34d399; font-size:12.5px;">0%</span>
                        <button type="button" onclick="cancelActiveUpload()" title="Cancel" style="background:rgba(255,255,255,0.12); color:#e2e8f0; border:none; padding:2px 6px; font-size:11px; border-radius:6px; line-height:1.2;">✖</button>

                <div id="uploadBarSub" style="font-size:11px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Preparing...</div>

        document.body.appendChild(toast);

function hideUploadBar() {

function cancelActiveUpload() {

async function uploadToImgBB(base64Str, customFileName) {
    if (!base64Str || !base64Str.startsWith('data:')) return '';

    const mimeString = base64Str.split(',')[0].split(':')[1].split(';')[0];
    const base64Data = base64Str.split(',')[1];
    const fileKB = Math.max(1, Math.round((base64Data.length * 3 / 4) / 1024));
    const ext = mimeString === 'application/pdf' ? 'pdf' : (mimeString.split('/')[1] || 'jpg');
    const finalName = customFileName || ('ST_' + Date.now() + '.' + ext);

    let pct = 10;
    isBackgroundUploading = true;
    updateUploadBar(pct, `${fileKB} KB • Google Drive`, finalName);

    let progressTimer = setInterval(() => {
        if (pct < 88) {
            pct += Math.max(2, Math.round((90 - pct) * 0.18));
            updateUploadBar(pct, pct < 60 ? `Uploading ${fileKB} KB...` : 'Saving in Drive...', finalName);
        }
    }, 350);

    activeUploadController = new AbortController();
    let timeoutId = setTimeout(() => {
        if (activeUploadController) activeUploadController.abort();
    }, 45000);

    try {
        const payload = JSON.stringify({
            base64: base64Data,
            mimeType: mimeString,
            fileName: finalName
        });

        const response = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
            method: 'POST',
            redirect: 'follow',
            body: payload,
            signal: activeUploadController.signal
        });

        clearInterval(progressTimer);
        clearTimeout(timeoutId);
        activeUploadController = null;
        isBackgroundUploading = false;

        const text = await response.text();
        let data = null;
        try { data = JSON.parse(text); } catch (e) {}

        if (data && data.success && data.url) {
            updateUploadBar(100, '✅ Saved to Google Drive!', finalName);
            await new Promise(r => setTimeout(r, 800));
            hideUploadBar();
            return data.url;
        } else {
            hideUploadBar();
            alert('⚠️ Google Drive Error: ' + (data && data.error ? data.error : 'Apps Script mein "Who has access: Anyone" check karein.'));
            return '';
        }
    } catch (err) {
        clearInterval(progressTimer);
        clearTimeout(timeoutId);
        activeUploadController = null;
        isBackgroundUploading = false;
        hideUploadBar();
        if (err && err.name === 'AbortError') {
            alert('⏱️ Upload cancelled or timed out. Dobara try karein.');
        } else {
            alert('⚠️ Google Drive upload error! Apps Script permission check karein.');
        }
        return '';
    }
}

function extractDriveFileId(url) {
    if (!url || typeof url !== 'string') return '';
    let m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return m1[1];
    let m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1]) return m2[1];
    return '';
}

async function deleteFromGoogleDrive(fileUrl) {
    const fileId = extractDriveFileId(fileUrl);
    if (!fileId) return { success: true, skipped: true };

    try {
        const res = await fetch(GOOGLE_DRIVE_SCRIPT_URL, {
            method: 'POST',
            redirect: 'follow',
            body: JSON.stringify({ action: 'delete', fileId: fileId })
        });
        const text = await res.text();
        return JSON.parse(text);
    } catch (err) {
        return { success: false, error: err.message };
    }
}

async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

window.changeMonthBy = function(step) {
    let targetSelect = document.getElementById('headerMonthSelect');
    if (!targetSelect || targetSelect.value === 'All Time') return;
    let parts = targetSelect.value.split(' ');
    let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]);
    let y = parseInt(parts[1]);
    let nd = new Date(y, mIdx + step, 1);
    let newVal = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][nd.getMonth()] + ' ' + nd.getFullYear();

    let exists = Array.from(targetSelect.options).some(opt => opt.value === newVal);
    if (!exists) {
        let shortM = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][nd.getMonth()];
        targetSelect.add(new Option(shortM + ' ' + nd.getFullYear(), newVal));

    targetSelect.value = newVal;
    handleGlobalMonthChange();
};

function generateMonthDropdown() {
    let d = new Date();
    let currMonthName = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getMonth()];
    let savedMonth = localStorage.getItem('st_manual_month') || (currMonthName + " " + d.getFullYear());

    let options = '<option value="All Time">All Time</option>';

    let startYear = 2026; let startMonth = 7;
    let endYear = d.getFullYear(); let endMonth = d.getMonth() + 1;
    if (endMonth > 11) { endMonth = 0; endYear++; }

    let validMonths = [];
    let tempY = startYear, tempM = startMonth;
    while (tempY < endYear || (tempY === endYear && tempM <= endMonth)) {
        validMonths.unshift({ y: tempY, m: tempM });
        tempM++; if (tempM > 11) { tempM = 0; tempY++; }

function showAdminOverview() {
    setActiveAdminTab('tab-overview');
    const hmEl = document.getElementById('headerMonthSelect');
    const activePeriod = hmEl ? hmEl.value : "August 2026";
    const cfStartCutoff = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';

    function calcPartnerStats(partnerKey, periodLabel) {
        const fullList = getArray(appData.records[partnerKey]);
        let allTimeProfit = 0;

        fullList.forEach(item => {
            if (!appData.config?.enablePastCF && item.date < cfStartCutoff) return;
            if (item.type === 'profit') {
                allTimeProfit += (parseFloat(item.amount) || 0);
            }
        });

        let periodList = fullList;
        if (periodLabel && periodLabel !== "All Time") {
            const splitParts = periodLabel.split(' ');
            const mNum = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(splitParts[0]) + 1;
            const mFormatted = mNum < 10 ? '0' + mNum : String(mNum);
            const prefixFilter = splitParts[1] + '-' + mFormatted;
            periodList = fullList.filter(item => item.date && item.date.startsWith(prefixFilter));
        }

        let mInc = 0, mExp = 0, mProf = 0;
        periodList.forEach(item => {
            if (!appData.config?.enablePastCF && item.date < cfStartCutoff) return;
            const val = parseFloat(item.amount) || 0;
            if (item.type === 'income') mInc += val;
            else if (item.type === 'expense') mExp += val;
            else if (item.type === 'profit') mProf += val;
        });

        return {
            inc: mInc,
            exp: mExp,
            net: mInc - mExp - mProf,
            profAllTime: allTimeProfit
        };
    }

    function calcPrevCarryForward(partnerKey, periodLabel) {
        if (!periodLabel || periodLabel === "All Time") return { bal: 0, month: "All Time" };
        const splitParts = periodLabel.split(' ');
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const currIdx = monthNames.indexOf(splitParts[0]);
        const currYear = parseInt(splitParts[1]);
        const prevIdx = currIdx === 0 ? 11 : currIdx - 1;
        const prevYr = currIdx === 0 ? currYear - 1 : currYear;
        const cutoffEnd = new Date(prevYr, prevIdx + 1, 0, 23, 59, 59);

        let netPast = 0;
        getArray(appData.records[partnerKey]).forEach(item => {
            if (item.date) {
                const dArr = item.date.split('-');
                const itemDt = new Date(parseInt(dArr[0]), parseInt(dArr[1]) - 1, parseInt(dArr[2]), 12, 0, 0);
                if (itemDt <= cutoffEnd) {
                    if (appData.config?.enablePastCF || item.date >= cfStartCutoff) {
                        const v = parseFloat(item.amount) || 0;
                        netPast += (item.type === 'income' ? v : -v);
                    }
                }
            }
        });
        return { bal: netPast, month: monthNames[prevIdx] + " " + prevYr };
    }

    const tanStats = calcPartnerStats('Tanmoy', activePeriod);
    const tapStats = calcPartnerStats('Tapabrata', activePeriod);
    const tanCF = calcPrevCarryForward('Tanmoy', activePeriod);
    const tapCF = calcPrevCarryForward('Tapabrata', activePeriod);

        getArray(appData.records['Tanmoy']).forEach(r => { if (appData.config?.enablePastCF || r.date >= cfStartCutoff) tanFinalCash += (r.type === 'income' ? parseFloat(r.amount) : -parseFloat(r.amount)); });
        getArray(appData.records['Tapabrata']).forEach(r => { if (appData.config?.enablePastCF || r.date >= cfStartCutoff) tapFinalCash += (r.type === 'income' ? parseFloat(r.amount) : -parseFloat(r.amount)); });
    } else {
        tanFinalCash = tanCF.bal + tanStats.net;

    const cfLabelTap = activePeriod === "All Time" ? "₹0" : "₹" + tapCF.bal.toLocaleString('en-IN');

    const tanFlowSum = tanStats.inc + tanStats.exp;

    const tapFlowSum = tapStats.inc + tapStats.exp;

function renderPartnerData(name) {
    let globalMonth = document.getElementById('headerMonthSelect') ? document.getElementById('headerMonthSelect').value : '';
    let monthQuery = '';
    if (globalMonth && globalMonth !== 'All Time') {
        let parts = globalMonth.split(' ');
        let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1;
        let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString();
        monthQuery = parts[1] + '-' + mStr;
    }

    let query = document.getElementById('partnerSearchInput') ? document.getElementById('partnerSearchInput').value.toLowerCase() : '';
    let dateFilter = currentPartnerDateFilter || '';
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';

    let allPartnerRecs = [...getArray(appData.records[name])].sort((a, b) => new Date(b.date) - new Date(a.date));

    let allTimeProf = 0;
    let profitMonthMap = {};
    const monthShortNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    allPartnerRecs.forEach(r => {
        if (appData.config?.enablePastCF || (r.date && r.date >= cutoffDate)) {
            if (r.type === 'profit') {
                let pAmt = parseFloat(r.amount) || 0;
                allTimeProf += pAmt;
                if (r.date) {
                    let dParts = r.date.split('-');
                    if (dParts.length === 3) {
                        let mNum = parseInt(dParts[1]) - 1;
                        let mName = monthShortNames[mNum] || dParts[1];
                        if (!profitMonthMap[mName]) profitMonthMap[mName] = 0;
                        profitMonthMap[mName] += pAmt;
                    }
                }
            }
        }
    });

    let profitMonthsBreakdown = [];
    for (let m in profitMonthMap) {
        profitMonthsBreakdown.push(`${m}: ₹${profitMonthMap[m].toLocaleString('en-IN')}`);
    }
    let profitSubText = profitMonthsBreakdown.length > 0 ? profitMonthsBreakdown.join(' | ') : 'All Time Withdrawn';

    let recs = [...allPartnerRecs];
    if (dateFilter) { recs = recs.filter(r => r.date === dateFilter); }
    else if (monthQuery) { recs = recs.filter(r => r.date && r.date.startsWith(monthQuery)); }

    if (query) {
        recs = recs.filter(r => (r.details && r.details.toLowerCase().includes(query)) || (r.amount && r.amount.toString().includes(query)) || (r.date && r.date.includes(query)) || (r.billNo && r.billNo.toLowerCase().includes(query)));
    }

    let profRecsList = allPartnerRecs.filter(r => r.type === 'profit');
    if (dateFilter) { profRecsList = profRecsList.filter(r => r.date === dateFilter); }
    if (query) {
        profRecsList = profRecsList.filter(r => (r.details && r.details.toLowerCase().includes(query)) || (r.amount && r.amount.toString().includes(query)) || (r.date && r.date.includes(query)));
    }

    let totalInc = 0, totalExp = 0, monthProf = 0;
    recs.forEach(r => {
        if (r.type === 'profit') monthProf += parseFloat(r.amount) || 0;
    });

    function makeRow(r, type) {
        if (type === 'income') totalInc += parseFloat(r.amount) || 0;
        else if (type === 'expense') totalExp += parseFloat(r.amount) || 0;

        let proof = '-';

async function savePartnerEntry(name) {
    let date = document.getElementById('entryDate').value, amt = parseFloat(document.getElementById('entryAmount').value), det = document.getElementById('entryDetails').value.trim();
    let billNoEl = document.getElementById('entryBillNo'); let billNo = billNoEl ? billNoEl.value.trim() : '';
    let photoInput = document.getElementById('entryPhoto'); let file = photoInput.files[0];
    let isTransfer = document.getElementById('transferCheckbox') && document.getElementById('transferCheckbox').checked && currentEntryType !== 'profit';
    let isVehicle = document.getElementById('isVehicleExpense') && document.getElementById('isVehicleExpense').checked && currentEntryType === 'expense';
    let otherName = name === 'Tanmoy' ? 'Tapabrata' : 'Tanmoy';
    if (isNaN(amt) || amt <= 0) return alert("Valid Amount required!");
    if (!isVehicle && !det) return alert("Details required!");
    if (file && !file.type.startsWith('image/')) return alert("Upload Image only!");

    let qvCar = isVehicle ? document.getElementById('qvCar').value : '';
    let qvCat = isVehicle ? document.getElementById('qvCategory').value : '';
    let partnerDesc = '';
    if (isVehicle) {
        partnerDesc = det ? `🚗 ${qvCar} - ${qvCat} (${det})` : `🚗 ${qvCar} - ${qvCat}`;
    } else {
        partnerDesc = isTransfer ? `${det} (To ${otherName})` : det;
    }

    let isDuplicate = getArray(appData.records[name]).some(r => String(r.id) !== String(currentEditId) && r.date === date && r.amount === amt && (r.details || '').toLowerCase() === partnerDesc.toLowerCase() && r.type === currentEntryType);
    if (isDuplicate) return alert("❌ DUPLICATE ENTRY! Yeh entry is date par pehle se maujood hai.");

    if (currentEntryType === 'income' && billNo) { let allRecs = [...getArray(appData.records['Tanmoy']), ...getArray(appData.records['Tapabrata'])]; let isBillUsed = allRecs.some(r => String(r.id) !== String(currentEditId) && r.billNo && r.billNo.toLowerCase() === billNo.toLowerCase()); if (isBillUsed) return alert(`❌ DUPLICATE BILL!`); }

    let oldR = currentEditId ? getArray(appData.records[name]).find(r => String(r.id) === String(currentEditId)) : null;
    let wasVehicle = oldR && oldR.isAuto && !oldR.linkedId;
    let wasTransfer = oldR && oldR.linkedId;

    if (currentEditId !== null && (isTransfer || isVehicle || wasVehicle || wasTransfer)) {
        if (oldR) {
            appData.balances[name] -= (oldR.type === 'income' ? oldR.amount : -oldR.amount);
            appData.records[name] = getArray(appData.records[name]).filter(r => String(r.id) !== String(currentEditId));
            if (wasVehicle) appData.vehicles = getArray(appData.vehicles).filter(v => String(v.id) !== String(currentEditId));
            if (wasTransfer) {
                let oldLinkedR = getArray(appData.records[otherName]).find(x => String(x.id) === String(oldR.linkedId));
                if (oldLinkedR) {
                    appData.balances[otherName] -= (oldLinkedR.type === 'income' ? oldLinkedR.amount : -oldLinkedR.amount);
                    appData.records[otherName] = getArray(appData.records[otherName]).filter(x => String(x.id) !== String(oldR.linkedId));
                }
            }
        }
        currentEditId = null;
    }

    let btn = document.getElementById('entrySaveBtn'); let origText = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;
    try {
        appData.records[name] = getArray(appData.records[name]);
        let existingRecord = currentEditId ? appData.records[name].find(r => String(r.id) === String(currentEditId)) : null;
        let baseRec = existingRecord || oldR;
        let photoUrl = baseRec && baseRec.photo ? baseRec.photo : '';
        let oldLink = baseRec && baseRec.link ? baseRec.link : '';
        let oldReconState = baseRec && baseRec.reconState !== undefined ? baseRec.reconState : 0;

        if (file) { let b64 = await compressImage(file); photoUrl = await uploadToImgBB(b64); }
        if (!appData.balances[name]) appData.balances[name] = 0;
        let newEntryId = currentEditId || Date.now(), linkedEntryId = newEntryId + "_linked";

        if (currentEditId !== null) {
            let idx = appData.records[name].findIndex(r => String(r.id) === String(currentEditId));
            appData.balances[name] -= (existingRecord.type === 'income' ? existingRecord.amount : -existingRecord.amount); appData.balances[name] += (currentEntryType === 'income' ? amt : -amt);
            appData.records[name][idx] = { id: currentEditId, date, details: partnerDesc, amount: amt, type: currentEntryType, photo: photoUrl || '', link: oldLink || '', isAuto: existingRecord.isAuto || false, linkedId: existingRecord.linkedId || null, billNo, reconState: oldReconState };
        } else {
            if (isVehicle) {
                let finalDetails = det || '-';
                appData.vehicles = getArray(appData.vehicles); appData.vehicles.unshift({ id: newEntryId, date, car: qvCar, category: qvCat, details: finalDetails, amount: amt, photo: photoUrl || '', paidBy: name });
                appData.records[name].unshift({ id: newEntryId, date, details: partnerDesc, amount: amt, type: 'expense', photo: photoUrl || '', link: oldLink || '', isAuto: true, reconState: oldReconState }); appData.balances[name] -= amt;
            } else {
                appData.records[name].unshift({ id: newEntryId, date, details: partnerDesc, amount: amt, type: currentEntryType, photo: photoUrl || '', link: oldLink || '', isAuto: false, linkedId: isTransfer ? linkedEntryId : null, billNo, reconState: oldReconState }); appData.balances[name] += (currentEntryType === 'income' ? amt : -amt);
                if (isTransfer) {
                    let otherType = currentEntryType === 'expense' ? 'income' : 'expense', otherDesc = `${det} (From ${name})`; appData.records[otherName] = getArray(appData.records[otherName]); appData.records[otherName].unshift({ id: linkedEntryId, date, details: otherDesc, amount: amt, type: otherType, photo: photoUrl || '', link: '', isAuto: true, linkedId: newEntryId, reconState: 0 }); if (!appData.balances[otherName]) appData.balances[otherName] = 0; appData.balances[otherName] += (otherType === 'income' ? amt : -amt);
                }
            }
        }
        if (currentEntryType === 'income' && billNo) { let bIdx = getArray(appData.submittedBills).findIndex(b => b.billNo && b.billNo.toLowerCase() === billNo.toLowerCase() && !b.isPaid); if (bIdx !== -1) appData.submittedBills[bIdx].isPaid = true; }

        window.lastSelectedDate = date;
        await saveDataToLocal(); partnerProfile(name);
    } catch (e) { alert("Error saving."); btn.innerText = origText; btn.disabled = false; }
}

function deleteEntry(id, name) {
    let r = getArray(appData.records[name]).find(x => String(x.id) === String(id));

// ====== 1. STRICT GLOBAL DATE RULE (DD-MM-YY / DD-MM-YYYY) ======
const __nativeInputValDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

function getTodayISO() {
    let d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseStrictDateInput(raw) {
    if (raw === null || raw === undefined) return null;
    let s = String(raw).trim();
    let m = s.match(/^(\d{2})-(\d{2})-(\d{2}|\d{4})$/);
    if (!m) return null;

    let d = parseInt(m[1], 10);
    let mo = parseInt(m[2], 10);
    let y = m[3].length === 2 ? (2000 + parseInt(m[3], 10)) : parseInt(m[3], 10);

    if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1900 || y > 2199) return null;
    let dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;

    let dd = String(d).padStart(2, '0');
    let mm = String(mo).padStart(2, '0');
    let yyyy = String(y);
    return { iso: `${yyyy}-${mm}-${dd}`, display: `${dd}-${mm}-${yyyy}` };
}

function toISODateAny(val) {
    if (!val) return '';
    let s = String(val).trim();
    let isoM = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoM) {
        let p = parseStrictDateInput(`${isoM[3]}-${isoM[2]}-${isoM[1]}`);
        return p ? p.iso : '';
    }
    let strict = parseStrictDateInput(s);
    if (strict) return strict.iso;

    let slash = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2}|\d{4})$/);
    if (slash) {
        let p = parseStrictDateInput(`${slash[1].padStart(2, '0')}-${slash[2].padStart(2, '0')}-${slash[3]}`);
        return p ? p.iso : '';
    }
    return '';
}

window.formatDate = function (val) {
    if (!val) return '-';
    let iso = toISODateAny(val);
    if (!iso) return String(val);
    let p = iso.split('-');
    return `${p[2]}-${p[1]}-${p[0]}`;
};

function upgradeStrictDateInput(orig) {
    if (!orig || orig.dataset.strictDone === '1') return;
    orig.dataset.strictDone = '1';

    let wrap = document.createElement('div');
    wrap.className = 'sd-wrap';

    let vis = document.createElement('input');
    vis.type = 'text';
    vis.className = 'sd-vis';
    vis.placeholder = 'DD-MM-YY / YYYY';
    vis.maxLength = 10;
    vis.autocomplete = 'off';
    vis.setAttribute('inputmode', 'numeric');

    let initIso = toISODateAny(__nativeInputValDesc.get.call(orig));
    if (initIso) {
        __nativeInputValDesc.set.call(orig, initIso);
        vis.value = formatDate(initIso);
    }

    let cal = document.createElement('span');
    cal.className = 'sd-cal';
    cal.title = 'Pick from Calendar';
    cal.innerHTML = '📅';

    let parent = orig.parentNode;
    if (!parent) return;
    parent.insertBefore(wrap, orig);
    wrap.appendChild(vis);
    cal.appendChild(orig);
    wrap.appendChild(cal);

    let syncing = false;

    Object.defineProperty(orig, 'value', {
        configurable: true,
        get() { return __nativeInputValDesc.get.call(this); },
        set(v) {
            let iso = toISODateAny(v);
            __nativeInputValDesc.set.call(this, iso);
            if (!syncing) {
                vis.value = iso ? formatDate(iso) : '';
                orig.dataset.strictError = '';
                vis.classList.remove('sd-err');
            }
        }
    });

    orig.addEventListener('click', () => {
        if (typeof orig.showPicker === 'function') {
            try { orig.showPicker(); } catch (e) {}
        }
    });

    orig.addEventListener('change', () => {
        if (syncing) return;
        let iso = __nativeInputValDesc.get.call(orig);
        vis.value = iso ? formatDate(iso) : '';
        orig.dataset.strictError = '';
        vis.classList.remove('sd-err');
    });

    vis.addEventListener('input', () => {
        let raw = vis.value.trim();
        syncing = true;
        if (!raw) {
            __nativeInputValDesc.set.call(orig, '');
            orig.dataset.strictError = '';
            vis.classList.remove('sd-err');
        } else {
            let parsed = parseStrictDateInput(raw);
            if (parsed) {
                __nativeInputValDesc.set.call(orig, parsed.iso);
                orig.dataset.strictError = '';
                vis.classList.remove('sd-err');
                orig.dispatchEvent(new Event('change', { bubbles: true }));
            } else {
                orig.dataset.strictError = '1';
                vis.classList.add('sd-err');
            }
        }
        syncing = false;
    });

    vis.addEventListener('blur', () => {
        let raw = vis.value.trim();
        if (!raw) return;
        let parsed = parseStrictDateInput(raw);
        if (parsed) {
            vis.value = parsed.display;
            orig.dataset.strictError = '';
            vis.classList.remove('sd-err');
        } else {
            orig.dataset.strictError = '1';
            vis.classList.add('sd-err');
        }
    });
}

function upgradeStrictInvDate(el) {
    if (!el || el.dataset.strictInv === '1') return;
    el.dataset.strictInv = '1';
    el.placeholder = 'DD-MM-YY / YYYY';
    el.maxLength = 10;

    let initIso = toISODateAny(__nativeInputValDesc.get.call(el));
    if (initIso) __nativeInputValDesc.set.call(el, formatDate(initIso));

    Object.defineProperty(el, 'value', {
        configurable: true,
        get() { return __nativeInputValDesc.get.call(this); },
        set(v) {
            let iso = toISODateAny(v);
            __nativeInputValDesc.set.call(this, iso ? formatDate(iso) : (v || ''));
            el.dataset.strictError = '';
            el.classList.remove('sd-err');
        }
    });

    el.addEventListener('input', () => {
        let raw = el.value.trim();
        let ok = !raw || !!parseStrictDateInput(raw);
        el.dataset.strictError = ok ? '' : '1';
        el.classList.toggle('sd-err', !ok);
    });

    el.addEventListener('blur', () => {
        let parsed = parseStrictDateInput(el.value.trim());
        if (parsed) {
            __nativeInputValDesc.set.call(el, parsed.display);
            el.dataset.strictError = '';
            el.classList.remove('sd-err');
        }
    });
}

function scanStrictDates() {
    document.querySelectorAll('input[type="date"]:not([data-strict-done])').forEach(upgradeStrictDateInput);
    let invEl = document.getElementById('invDate');
    if (invEl) upgradeStrictInvDate(invEl);
}

function checkStrictDates(requiredIds) {
    let root = document.getElementById('profileArea') || document.body;
    let bad = root.querySelector('[data-strict-error="1"]');
    if (bad) {
        let vis = bad.closest('.sd-wrap')?.querySelector('.sd-vis') || bad;
        if (vis && vis.focus) vis.focus();
        alert('⚠️ Strict Date Format Rule:\nSirf DD-MM-YY ya DD-MM-YYYY format daalein (jaise 23-11-26 ya 23-11-2026).');
        return false;
    }
    for (let id of (requiredIds || [])) {
        let el = document.getElementById(id);
        if (!el) continue;
        let val = String(el.value || '').trim();
        if (id === 'invDate') {
            let parsed = parseStrictDateInput(val);
            if (!parsed) {
                el.classList.add('sd-err');
                el.focus();
                alert('⚠️ Strict Date Format Rule:\nDate sirf DD-MM-YY ya DD-MM-YYYY format mein daalein!');
                return false;
            }
            el.value = parsed.display;
        } else if (!val) {
            let vis = el.closest('.sd-wrap')?.querySelector('.sd-vis');
            if (vis) { vis.classList.add('sd-err'); vis.focus(); }
            alert('⚠️ Date required hai! (Format: DD-MM-YY ya DD-MM-YYYY)');
            return false;
        }
    }
    return true;
}

if (!window.__strictDateObserverActive) {
    window.__strictDateObserverActive = true;
    new MutationObserver(scanStrictDates).observe(document.body, { childList: true, subtree: true });
    scanStrictDates();
    if (typeof window.savePartnerEntry === 'function' && !window.savePartnerEntry.__strictWrapped) {
        let origPartnerSave = window.savePartnerEntry;
        window.savePartnerEntry = function (...args) {
            if (!checkStrictDates(['pDate'])) return;
            return origPartnerSave.apply(this, args);
        };
        window.savePartnerEntry.__strictWrapped = true;
    }
}

// ====== 3. PO DATE, DEADLINE, MULTI-CYCLE AMC & SD ALERT HELPERS ======
function addMonthsSafe(dateStr, monthsToAdd) {
    let iso = toISODateAny(dateStr);
    if (!iso) return null;
    let parts = iso.split('-');
    let yr = parseInt(parts[0], 10), mo = parseInt(parts[1], 10) - 1, dy = parseInt(parts[2], 10);
    let totalMonths = mo + monthsToAdd;
    let targetYear = yr + Math.floor(totalMonths / 12);
    let normMonth = ((totalMonths % 12) + 12) % 12;
    let maxDay = new Date(targetYear, normMonth + 1, 0).getDate();
    let dt = new Date(targetYear, normMonth, Math.min(dy, maxDay));
    dt.setHours(0, 0, 0, 0);
    return dt;
}

function parseISODateLocal(dateStr) {
    let iso = toISODateAny(dateStr);
    if (!iso) return null;
    let parts = iso.split('-');
    let dt = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    dt.setHours(0, 0, 0, 0);
    return isNaN(dt.getTime()) ? null : dt;
}

function dateObjToISO(dt) {
    if (!dt) return '';
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}

function getEffectiveAlertMonths(po) {
    if (!po) return 0;
    if (po.alertMonths !== undefined && po.alertMonths !== null && po.alertMonths !== '') return parseInt(po.alertMonths, 10) || 0;
    if (po.poType === 'Civil PO') return 6;
    if (po.poType === 'AMC PO') return 3;
    return 0;
}

function getPODeadlineStatus(deadlineStr, isCompleted) {
    if (isCompleted || !deadlineStr) return null;
    let due = parseISODateLocal(deadlineStr);
    if (!due) return null;
    let today = new Date(); today.setHours(0, 0, 0, 0);
    let diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) return { level: 'overdue', days: diffDays, isAlert: true, tone: 'red', dot: '#dc2626', text: `${Math.abs(diffDays)}d overdue`, bg: '#fef2f2', color: '#b91c1c', border: '#fecaca' };
    if (diffDays === 0) return { level: 'today', days: 0, isAlert: true, tone: 'amber', dot: '#ea580c', text: `Due today`, bg: '#fff7ed', color: '#c2410c', border: '#fed7aa' };
    if (diffDays <= 5) return { level: 'soon', days: diffDays, isAlert: true, tone: 'amber', dot: '#d97706', text: `${diffDays}d left`, bg: '#fffbeb', color: '#b45309', border: '#fde68a' };
    return { level: 'safe', days: diffDays, isAlert: false, tone: 'green', dot: '#10b981', text: `${diffDays}d left`, bg: '#ecfdf5', color: '#047857', border: '#a7f3d0' };
}

function getPOMonthAlertStatus(po) {
    if (!po || po.isCompleted || !po.date) return null;
    let alertMonths = getEffectiveAlertMonths(po);
    if (alertMonths <= 0) return null;

    let cyclesDone = parseInt(po.completedCycles, 10) || 0;
    let billNo = cyclesDone + 1;
    let today = new Date(); today.setHours(0, 0, 0, 0);

    let deadlineObj = po.deadline ? parseISODateLocal(po.deadline) : null;
    let deadlineLimitMs = deadlineObj ? (deadlineObj.getTime() + 15 * 24 * 60 * 60 * 1000) : null;
    let dueDateObj = addMonthsSafe(po.date, alertMonths * billNo);
    if (!dueDateObj) return null;

    if (deadlineLimitMs && dueDateObj.getTime() > deadlineLimitMs) {
        return { isAlert: false, reached: false, allCyclesDone: true, diffDays: Infinity, alertMonths, cyclesDone, billNo, dueCyclesCount: 0, totalDueMonths: 0, dueISO: '', tone: 'green', dot: '#10b981', text: `All cycles claimed`, bg: '#ecfdf5', color: '#047857', border: '#a7f3d0' };
    }

    let diffDays = Math.round((dueDateObj - today) / (1000 * 60 * 60 * 24));
    let dueISO = dateObjToISO(dueDateObj);
    let isAlert = diffDays <= 5;
    let dueCyclesCount = 0, lastDueISO = dueISO;

    if (isAlert) {
        dueCyclesCount = 1;
        for (let step = 1; step < 24; step++) {
            let nextObj = addMonthsSafe(po.date, alertMonths * (billNo + step));
            if (!nextObj || (deadlineLimitMs && nextObj.getTime() > deadlineLimitMs)) break;
            if (Math.round((nextObj - today) / (1000 * 60 * 60 * 24)) <= 5) { dueCyclesCount++; lastDueISO = dateObjToISO(nextObj); }
            else break;
        }
    }

    let totalDueMonths = dueCyclesCount * alertMonths;
    let toBillNo = billNo + Math.max(0, dueCyclesCount - 1);

    if (dueCyclesCount > 1) return { isAlert: true, reached: true, diffDays, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount, totalDueMonths, dueISO, lastDueISO, tone: 'red', dot: '#dc2626', text: `${dueCyclesCount} bills due (${totalDueMonths}M)`, bg: '#fef2f2', color: '#b91c1c', border: '#fecaca' };
    if (diffDays < 0) return { isAlert: true, reached: true, diffDays, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO, tone: 'red', dot: '#dc2626', text: `Bill #${billNo} overdue (${Math.abs(diffDays)}d)`, bg: '#fef2f2', color: '#b91c1c', border: '#fecaca' };
    if (diffDays === 0) return { isAlert: true, reached: true, diffDays: 0, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO, tone: 'amber', dot: '#ea580c', text: `Bill #${billNo} due today`, bg: '#fff7ed', color: '#c2410c', border: '#fed7aa' };
    if (diffDays <= 5) return { isAlert: true, reached: true, diffDays, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO, tone: 'amber', dot: '#d97706', text: `Bill #${billNo} in ${diffDays}d`, bg: '#fffbeb', color: '#b45309', border: '#fde68a' };
    return { isAlert: false, reached: false, diffDays, alertMonths, cyclesDone, billNo, toBillNo: billNo, dueCyclesCount: 0, totalDueMonths: 0, dueISO, lastDueISO: dueISO, tone: 'blue', dot: '#0284c7', text: `Next bill: ${formatDate(dueISO)}`, bg: '#f0f9ff', color: '#0369a1', border: '#bae6fd' };
}

function getPOSDStatus(po) {
    if (!po) return null;
    let sdAmt = parseFloat(po.sdAmount) || 0;
    if (sdAmt <= 0) return null;
    let holdMonths = parseInt(po.sdHoldMonths, 10) || 6;
    let sdAmtText = sdAmt.toLocaleString('en-IN', { maximumFractionDigits: 2 });

    if (po.sdReceived) return { state: 'received', isAlert: false, sdAmt, holdMonths, diffDays: Infinity, tone: 'green', dot: '#10b981', text: `SD Refunded · ₹${sdAmtText}`, bg: '#ecfdf5', color: '#047857', border: '#a7f3d0' };
    if (!po.completedDate) return { state: 'held', isAlert: false, sdAmt, holdMonths, diffDays: Infinity, tone: 'indigo', dot: '#4f46e5', text: po.isCompleted ? `SD ₹${sdAmtText} (Set done date)` : `SD ₹${sdAmtText} (${holdMonths}M hold)`, bg: '#eef2ff', color: '#3730a3', border: '#c7d2fe' };

    let dueObj = addMonthsSafe(po.completedDate, holdMonths);
    if (!dueObj) return null;
    let today = new Date(); today.setHours(0, 0, 0, 0);
    let diffDays = Math.round((dueObj - today) / (1000 * 60 * 60 * 24));
    let dueISO = dateObjToISO(dueObj);

    if (diffDays < 0) return { state: 'due', isAlert: true, sdAmt, holdMonths, diffDays, dueISO, tone: 'red', dot: '#dc2626', text: `SD overdue (${Math.abs(diffDays)}d) · ₹${sdAmtText}`, bg: '#fef2f2', color: '#b91c1c', border: '#fecaca' };
    if (diffDays === 0) return { state: 'due', isAlert: true, sdAmt, holdMonths, diffDays: 0, dueISO, tone: 'amber', dot: '#ea580c', text: `SD due today · ₹${sdAmtText}`, bg: '#fff7ed', color: '#c2410c', border: '#fed7aa' };
    if (diffDays <= 5) return { state: 'due', isAlert: true, sdAmt, holdMonths, diffDays, dueISO, tone: 'amber', dot: '#d97706', text: `SD in ${diffDays}d · ₹${sdAmtText}`, bg: '#fffbeb', color: '#b45309', border: '#fde68a' };
    return { state: 'waiting', isAlert: false, sdAmt, holdMonths, diffDays, dueISO, tone: 'indigo', dot: '#4f46e5', text: `SD ₹${sdAmtText} · Due ${formatDate(dueISO)}`, bg: '#eef2ff', color: '#3730a3', border: '#c7d2fe' };
}

function getAlertPOItems() {
    let alerts = [];
    getArray(appData.poRecords).forEach(p => {
        let typeLabel = p.poType === 'Civil PO' ? 'CIVIL PO' : (p.poType === 'AMC PO' ? 'AMC PO' : 'PO');
        if (!p.isCompleted) {
            let dlStatus = getPODeadlineStatus(p.deadline, p.isCompleted);
            let monthAlert = getPOMonthAlertStatus(p);
            if (dlStatus && dlStatus.isAlert) alerts.push({ po: p, isBillCycle: false, isSDRefund: false, kind: `${typeLabel} DEADLINE`, badgeText: dlStatus.text, bg: dlStatus.bg, color: dlStatus.color, border: dlStatus.border, dateText: `Due: ${formatDate(p.deadline)}`, priority: dlStatus.days });
            if (monthAlert && monthAlert.isAlert) {
                let dueDateInfo = monthAlert.dueCyclesCount > 1 ? `${formatDate(monthAlert.dueISO)} → ${formatDate(monthAlert.lastDueISO)}` : `Due: ${formatDate(monthAlert.dueISO)}`;
                alerts.push({ po: p, isBillCycle: true, isSDRefund: false, billNo: monthAlert.billNo, dueCyclesCount: monthAlert.dueCyclesCount, totalDueMonths: monthAlert.totalDueMonths, kind: `${typeLabel} · ${monthAlert.alertMonths}M CYCLE`, badgeText: monthAlert.text, bg: monthAlert.bg, color: monthAlert.color, border: monthAlert.border, dateText: dueDateInfo, priority: monthAlert.diffDays });
            }
        }
        let sdStatus = getPOSDStatus(p);
        if (sdStatus && sdStatus.isAlert) alerts.push({ po: p, isBillCycle: false, isSDRefund: true, sdAmt: sdStatus.sdAmt, kind: `${typeLabel} · SD REFUND`, badgeText: sdStatus.text, bg: sdStatus.bg, color: sdStatus.color, border: sdStatus.border, dateText: `Due: ${formatDate(sdStatus.dueISO)}`, priority: sdStatus.diffDays });
    });
    return alerts.sort((a, b) => a.priority - b.priority);
}

// ====== 4. PO CLAIM, UNDO, SD REFUND, BG UPLOAD QUEUE & DOWNLOAD ======
async function markPOBillDone(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;
    let currentCycles = parseInt(p.completedCycles, 10) || 0;
    let alertMonths = getEffectiveAlertMonths(p);
    let monthAlert = getPOMonthAlertStatus(p);
    let dueCount = (monthAlert && monthAlert.dueCyclesCount) ? monthAlert.dueCyclesCount : 1;
    let claimCycles = 1;

    if (alertMonths > 0 && p.date) {
        let lines = [];
        for (let k = 1; k <= Math.max(dueCount, 2); k++) {
            let bFrom = currentCycles + 1, bTo = currentCycles + k;
            lines.push(`${k} = ${k * alertMonths} Months (${k === 1 ? `Bill #${bFrom}` : `Bill #${bFrom}–#${bTo}`})`);
        }
        let headerInfo = dueCount > 1 ? `Abhi ${dueCount} cycles (${dueCount * alertMonths} Months) due hain.` : `Abhi Bill #${currentCycles + 1} (${alertMonths}M) due hai.`;
        let input = prompt(`Claim Bill: ${p.workDesc || p.authority} (${p.poNo})\n${headerInfo}\n\nKitne cycles ek saath claim kar rahe hain?\n${lines.join('\n')}`, String(dueCount));
        if (input === null) return;
        claimCycles = parseInt(input.trim(), 10);
        if (isNaN(claimCycles) || claimCycles < 1 || claimCycles > 24) return alert("Valid cycle number daalein (jaise 1 ya 2).");
    } else if (!confirm(`Bill #${currentCycles + 1} (${p.workDesc || p.authority} - ${p.poNo}) claim mark karein?`)) {
        return;
    }

    p.completedCycles = currentCycles + claimCycles;
    delete p.nextAlertDate;
    await saveDataToLocal();
    updatePOTabBadge();
    if (document.getElementById('poTableBody')) renderPOTableRows();
    else if (currentActiveTab === 'tab-overview') injectPOAlertBanner();
}

async function undoPOBillClaim(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;
    let currentCycles = parseInt(p.completedCycles, 10) || 0;
    if (currentCycles <= 0) return;

    let alertM = getEffectiveAlertMonths(p);
    let input = prompt(`Undo Claimed Bill: ${p.workDesc || p.authority} (${p.poNo})\nAbhi ${currentCycles} bill${currentCycles > 1 ? 's' : ''}${alertM > 0 ? ` (${currentCycles * alertM}M)` : ''} claimed hain.\n\nKitne claimed bills rakhne hain?\n• ${currentCycles - 1} = Last 1 bill undo\n• 0 = Sabhi undo (reset)`, String(currentCycles - 1));
    if (input === null) return;
    let newCount = parseInt(input.trim(), 10);
    if (isNaN(newCount) || newCount < 0 || newCount > 24) return alert("Valid number daalein (0 ya usse zyada).");

    p.completedCycles = newCount;
    await saveDataToLocal();
    updatePOTabBadge();
    if (document.getElementById('poTableBody')) renderPOTableRows();
    else if (currentActiveTab === 'tab-overview') injectPOAlertBanner();
}

async function togglePOSDReceived(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p) return;
    let sdAmt = parseFloat(p.sdAmount) || 0;
    if (sdAmt <= 0) return;

    let sdAmtText = sdAmt.toLocaleString('en-IN', { maximumFractionDigits: 2 });
    if (!p.sdReceived) {
        if (!confirm(`Security Deposit ₹${sdAmtText} (${p.workDesc || p.authority} - ${p.poNo}) wapas mil gaya?\n\nOK dabate hi SD Refunded mark hoga aur yeh PO Completed mein chala jayega.`)) return;
        p.sdReceived = true;
        p.sdReceivedDate = getTodayISO();
        if (!p.isCompleted) p.isCompleted = true;
    } else {
        if (!confirm(`Kya is PO ka Security Deposit (₹${sdAmtText}) wapas Pending SD mark karna hai?`)) return;
        p.sdReceived = false;
        p.sdReceivedDate = '';
    }

    await saveDataToLocal();
    updatePOTabBadge();
    if (document.getElementById('poTableBody')) renderPOTableRows();
    else if (currentActiveTab === 'tab-overview') showAdminOverview();
}

let poUploadQueue = [];
let isProcessingPOQueue = false;
const activeUploadingPOIds = new Set();

function queuePOBackgroundUpload(task) {
    activeUploadingPOIds.add(String(task.poId));
    poUploadQueue.push(task);
    if (document.getElementById('poTableBody')) renderPOTableRows();
    if (!isProcessingPOQueue) processPOUploadQueue();
}

async function processPOUploadQueue() {
    if (isProcessingPOQueue) return;
    isProcessingPOQueue = true;
    while (poUploadQueue.length > 0) {
        let task = poUploadQueue.shift();
        try {
            let uploadedUrl = await uploadToImgBB(task.b64, task.fileName);
            appData.poRecords = getArray(appData.poRecords);
            let idx = appData.poRecords.findIndex(p => String(p.id) === String(task.poId));
            if (idx !== -1) {
                if (uploadedUrl) {
                    appData.poRecords[idx].photo = uploadedUrl;
                    if (task.oldPhotoUrl && task.oldPhotoUrl !== uploadedUrl) deleteFromGoogleDrive(task.oldPhotoUrl);
                    await saveDataToLocal();
                }
            } else if (uploadedUrl) {
                deleteFromGoogleDrive(uploadedUrl);
            }
        } catch (err) {} finally {
            activeUploadingPOIds.delete(String(task.poId));
            if (document.getElementById('poTableBody')) renderPOTableRows();
        }
    }
    isProcessingPOQueue = false;
}

function downloadPOAttachment(id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p || !p.photo) return;
    let fileId = (typeof extractDriveFileId === 'function') ? extractDriveFileId(p.photo) : '';
    if (fileId) {
        let a = document.createElement('a');
        a.href = `https://drive.google.com/uc?export=download&id=${fileId}`;
        a.target = '_blank'; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
        return;
    }
    fetch(p.photo).then(r => r.blob()).then(blob => {
        let objUrl = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = objUrl;
        a.download = 'PO_' + String(p.poNo || Date.now()).replace(/[^a-zA-Z0-9_-]/g, '_') + '.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 2000);
    }).catch(() => window.open(p.photo, '_blank'));
}

// ====== 5. MOBILE BOTTOM SHEET POPUP (WITH LINKED EXCEL BILLS) ======
function ensurePOBottomSheetDOM() {
    if (document.getElementById('poBottomSheet')) return;
    let backdrop = document.createElement('div');
    backdrop.id = 'poBottomSheetBackdrop';
    backdrop.onclick = closePOBottomSheet;

    let sheet = document.createElement('div');
    sheet.id = 'poBottomSheet';
    sheet.innerHTML = `<div class="po-bs-handle"></div><div id="poBottomSheetBody" class="po-bs-body"></div>`;

    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && activePOBottomSheetId !== null) closePOBottomSheet();
    });
}

function openPOBottomSheet(id) {
    ensurePOBottomSheetDOM();
    activePOBottomSheetId = String(id);
    if (!renderPOBottomSheetContent(activePOBottomSheetId)) return;
    let backdrop = document.getElementById('poBottomSheetBackdrop');
    let sheet = document.getElementById('poBottomSheet');
    if (backdrop) backdrop.classList.add('open');
    if (sheet) sheet.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closePOBottomSheet() {
    activePOBottomSheetId = null;
    let backdrop = document.getElementById('poBottomSheetBackdrop');
    let sheet = document.getElementById('poBottomSheet');
    if (backdrop) backdrop.classList.remove('open');
    if (sheet) sheet.classList.remove('open');
    document.body.style.overflow = '';
}

function copyPONumberFromSheet(btnEl, id) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id));
    if (!p || !p.poNo) return;
    let done = () => {
        if (!btnEl) return;
        let old = btnEl.innerHTML;
        btnEl.innerHTML = 'Copied ✓';
        btnEl.style.setProperty('color', '#047857', 'important');
        setTimeout(() => { btnEl.innerHTML = old; btnEl.style.removeProperty('color'); }, 1300);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(p.poNo).then(done).catch(() => prompt('Copy PO Number:', p.poNo));
    } else {
        prompt('Copy PO Number:', p.poNo);
    }
}

function getPOSortDateMs(p) {
    if (!p) return 0;
    let iso = toISODateAny(p.date) || toISODateAny(p.completedDate) || toISODateAny(p.deadline);
    if (iso) { let dt = parseISODateLocal(iso); if (dt) return dt.getTime(); }
    return Number(p.id) || 0;
}
function getPOGroupOrder() {
    const def = ['AMC PO', 'General PO', 'Civil PO'];
    let saved = (appData.config && appData.config.poGroupOrder) ? getArray(appData.config.poGroupOrder) : [];
    if (saved.length !== def.length) { try { let ls = JSON.parse(localStorage.getItem('st_po_group_order') || '[]'); if (Array.isArray(ls) && ls.length === def.length) saved = ls; } catch (e) {} }
    let cleaned = saved.filter(k => def.includes(k));
    def.forEach(k => { if (!cleaned.includes(k)) cleaned.push(k); });
    return cleaned;
}
function swapPOGroupOrder(keyA, keyB) {
    let order = getPOGroupOrder(), iA = order.indexOf(keyA), iB = order.indexOf(keyB);
    if (iA === -1 || iB === -1) return;
    [order[iA], order[iB]] = [order[iB], order[iA]];
    if (!appData.config) appData.config = {};
    appData.config.poGroupOrder = order;
    try { localStorage.setItem('st_po_group_order', JSON.stringify(order)); } catch (e) {}
    renderPOTableRows(); saveDataToLocal();
}
function togglePOGroupCollapse(k) { if (collapsedPOGroups.has(k)) collapsedPOGroups.delete(k); else collapsedPOGroups.add(k); renderPOTableRows(); }
function setPOFilter(mode) { currentPOFilter = mode; document.querySelectorAll('.po-seg-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === mode)); renderPOTableRows(); }
function setPOAuthorityFilter(v) {
    currentPOAuthority = v || 'all';

function filterByPOAuthorityId(id, closeSheet = false) {
    let p = getArray(appData.poRecords).find(x => String(x.id) === String(id)); if (!p || !p.authority) return;
    let key = p.authority.trim().toLowerCase(), nextVal = (currentPOAuthority.toLowerCase() === key) ? 'all' : key;
    if (closeSheet) closePOBottomSheet();
    setPOAuthorityFilter(nextVal);
}
function populatePOAuthorityDropdown(allPOs) {
    let sel = document.getElementById('poAuthoritySelect'), counts = new Map(), labels = new Map();
    allPOs.forEach(p => { let raw = (p.authority || '').trim(); if (!raw) return; let k = raw.toLowerCase(); counts.set(k, (counts.get(k) || 0) + 1); if (!labels.has(k)) labels.set(k, raw); });
    if (currentPOAuthority !== 'all' && !counts.has(currentPOAuthority.toLowerCase())) currentPOAuthority = 'all';
    if (sel) {
        let sorted = [...labels.keys()].sort((a, b) => labels.get(a).localeCompare(labels.get(b)));
        sel.innerHTML = `<option value="all">All Authorities (${allPOs.length})</option>` + sorted.map(k => `<option value="${escPOHtml(k)}">${escPOHtml(labels.get(k))} (${counts.get(k)})</option>`).join('');
        sel.value = currentPOAuthority === 'all' ? 'all' : currentPOAuthority.toLowerCase();
        sel.classList.toggle('filtered', currentPOAuthority !== 'all');

}

// ====== 6B. BILL PERIOD PARSER + EXCEL CYCLE AUTO-SYNC ======
const PO_MON_MAP = { jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4, may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9, september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12 };
function poPad2(n) { return String(n).padStart(2, '0'); }
function poNormYear(yStr) { let y = parseInt(yStr, 10); return isNaN(y) ? 0 : (y < 100 ? (2000 + y) : y); }
function poValidDMY(d, m, y) {
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 2010 || y > 2099) return '';
    let dt = new Date(y, m - 1, d);
    return (dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) ? `${poPad2(d)}-${poPad2(m)}-${y}` : '';
}
function poLastDayOfMonth(y, m) { return new Date(y, m, 0).getDate(); }

function extractBillPeriodFromLines(lines) {
    let arr = Array.isArray(lines) ? lines : [String(lines || '')];
    let monRx = 'jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';
    let r1 = /(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4}|\d{2})(?!\d)\s*(?:to|t0|-|–|—|&|upto|up\s*to)\s*(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4}|\d{2})(?!\d)/i;
    for (let raw of arr) { let m = String(raw || '').match(r1); if (m) { let st = poValidDMY(+m[1], +m[2], poNormYear(m[3])), en = poValidDMY(+m[4], +m[5], poNormYear(m[6])); if (st && en) return { start: st, end: en, label: `${st} → ${en}` }; } }
    let r2 = new RegExp(`(\\d{1,2})(?:st|nd|rd|th)?[\\s.\\-\\/]*(${monRx})(?:[\\s.'\\-,\\/]*(\\d{4}|\\d{2})(?!\\d))?\\s*(?:to|-|–|—|upto|up\\s*to)\\s*(\\d{1,2})(?:st|nd|rd|th)?[\\s.\\-\\/]*(${monRx})[\\s.'\\-,\\/]*(\\d{4}|\\d{2})(?!\\d)`, 'i');
    for (let raw of arr) { let m = String(raw || '').match(r2); if (m) { let m1 = PO_MON_MAP[m[2].toLowerCase()], m2 = PO_MON_MAP[m[5].toLowerCase()], y2 = poNormYear(m[6]), y1 = m[3] ? poNormYear(m[3]) : (m1 > m2 ? y2 - 1 : y2), st = poValidDMY(+m[1], m1, y1), en = poValidDMY(+m[4], m2, y2); if (st && en) return { start: st, end: en, label: `${st} → ${en}` }; } }
    let r3 = new RegExp(`\\b(${monRx})(?:[\\s.'\\-,\\/]*(\\d{4}|\\d{2})(?!\\d))?\\s*(?:to|-|–|—|upto|up\\s*to)\\s*(${monRx})[\\s.'\\-,\\/]*(\\d{4}|\\d{2})(?!\\d)\\b`, 'i');
    for (let raw of arr) { let m = String(raw || '').match(r3); if (m) { let m1 = PO_MON_MAP[m[1].toLowerCase()], m2 = PO_MON_MAP[m[3].toLowerCase()], y2 = poNormYear(m[4]), y1 = m[2] ? poNormYear(m[2]) : (m1 > m2 ? y2 - 1 : y2), st = poValidDMY(1, m1, y1), en = poValidDMY(poLastDayOfMonth(y2, m2), m2, y2); if (st && en) return { start: st, end: en, label: `${st} → ${en}` }; } }
    let r4 = new RegExp(`\\b(${monRx})[\\s.'\\-,\\/]+(\\d{4}|\\d{2})(?!\\d)\\b`, 'i');
    for (let raw of arr) { let s = String(raw || ''); if (/invoice\s*date|po\s*date|memo\s*date/i.test(s)) continue; let m = s.match(r4); if (m) { let mo = PO_MON_MAP[m[1].toLowerCase()], yr = poNormYear(m[2]), st = poValidDMY(1, mo, yr), en = poValidDMY(poLastDayOfMonth(yr, mo), mo, yr); if (st && en) return { start: st, end: en, label: `${st} → ${en}` }; } }

}

function getBillPeriodInfo(b) {
    if (!b) return null;
    if (b.periodLabel && b.periodStart && b.periodEnd) {
        let stIso = toISODateAny(b.periodStart), enIso = toISODateAny(b.periodEnd);
        if (stIso && enIso && enIso >= stIso) return { start: b.periodStart, end: b.periodEnd, label: b.periodLabel };
    }

    if (b.periodRaw) texts.unshift(b.periodRaw);
    return extractBillPeriodFromLines(texts) || (b.periodLabel ? { start: b.periodStart || '', end: b.periodEnd || '', label: b.periodLabel } : null);
}

function getPOBillingSummary(po) {
    let bills = getArray(po && po.excelBills), contractAmt = parseFloat(po && po.amount) || 0;
    let claimedAmt = bills.reduce((s, b) => s + (Number(b.grandTotal) || 0), 0);
    let bakiAmt = Math.max(0, contractAmt - claimedAmt);
    let pct = contractAmt > 0 ? Math.min(100, Math.round((claimedAmt / contractAmt) * 100)) : 0;
    return { bills, contractAmt, claimedAmt, bakiAmt, pct };
}

function getExcelBilledCycles(po) {
    if (!po) return 0;
    let bills = getArray(po.excelBills); if (!bills.length) return 0;
    let alertM = getEffectiveAlertMonths(po), tot = 0;
    bills.forEach(b => {
        let pInfo = getBillPeriodInfo(b);
        if (pInfo && pInfo.start && pInfo.end && alertM > 0) {
            let st = parseISODateLocal(pInfo.start), en = parseISODateLocal(pInfo.end);
            if (st && en && en >= st) { tot += Math.max(1, Math.round(Math.max(1, Math.round(((Math.round((en - st) / 86400000) + 1) / 30.4375))) / alertM)); return; }
        }
        tot += 1;
    });
    return tot;
}

function getEffectiveCompletedCycles(po) { return Math.max(parseInt(po && po.completedCycles, 10) || 0, getExcelBilledCycles(po)); }

getPOMonthAlertStatus = function (po) {
    if (!po || po.isCompleted || !po.date) return null;
    let alertMonths = getEffectiveAlertMonths(po); if (alertMonths <= 0) return null;
    let cyclesDone = getEffectiveCompletedCycles(po), billNo = cyclesDone + 1, today = new Date(); today.setHours(0, 0, 0, 0);
    let dlObj = po.deadline ? parseISODateLocal(po.deadline) : null, dlLim = dlObj ? (dlObj.getTime() + 15 * 86400000) : null;
    let dueObj = addMonthsSafe(po.date, alertMonths * billNo); if (!dueObj) return null;
    if (dlLim && dueObj.getTime() > dlLim) return { isAlert: false, reached: false, allCyclesDone: true, diffDays: Infinity, alertMonths, cyclesDone, billNo, dueCyclesCount: 0, totalDueMonths: 0, dueISO: '', tone: 'green', dot: '#10b981', text: 'All cycles claimed', bg: '#ecfdf5', color: '#047857', border: '#a7f3d0' };

    let diffDays = Math.round((dueObj - today) / 86400000), dueISO = dateObjToISO(dueObj), isAlert = diffDays <= 5, dueCyclesCount = 0, lastDueISO = dueISO;
    if (isAlert) {
        dueCyclesCount = 1;
        for (let step = 1; step < 24; step++) {
            let nx = addMonthsSafe(po.date, alertMonths * (billNo + step));
            if (!nx || (dlLim && nx.getTime() > dlLim)) break;
            if (Math.round((nx - today) / 86400000) <= 5) { dueCyclesCount++; lastDueISO = dateObjToISO(nx); } else break;
        }
    }
    let totalDueMonths = dueCyclesCount * alertMonths, toBillNo = billNo + Math.max(0, dueCyclesCount - 1);
    if (dueCyclesCount > 1) return { isAlert: true, reached: true, diffDays, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount, totalDueMonths, dueISO, lastDueISO, tone: 'red', dot: '#dc2626', text: `${dueCyclesCount} bills due (${totalDueMonths}M)`, bg: '#fef2f2', color: '#b91c1c', border: '#fecaca' };
    if (diffDays < 0) return { isAlert: true, reached: true, diffDays, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO, tone: 'red', dot: '#dc2626', text: `Bill #${billNo} overdue (${Math.abs(diffDays)}d)`, bg: '#fef2f2', color: '#b91c1c', border: '#fecaca' };
    if (diffDays === 0) return { isAlert: true, reached: true, diffDays: 0, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO, tone: 'amber', dot: '#ea580c', text: `Bill #${billNo} due today`, bg: '#fff7ed', color: '#c2410c', border: '#fed7aa' };
    if (diffDays <= 5) return { isAlert: true, reached: true, diffDays, alertMonths, cyclesDone, billNo, toBillNo, dueCyclesCount: 1, totalDueMonths, dueISO, lastDueISO, tone: 'amber', dot: '#d97706', text: `Bill #${billNo} in ${diffDays}d`, bg: '#fffbeb', color: '#b45309', border: '#fde68a' };
    return { isAlert: false, reached: false, diffDays, alertMonths, cyclesDone, billNo, toBillNo: billNo, dueCyclesCount: 0, totalDueMonths: 0, dueISO, lastDueISO: dueISO, tone: 'blue', dot: '#0284c7', text: `Next bill: ${formatDate(dueISO)}`, bg: '#f0f9ff', color: '#0369a1', border: '#bae6fd' };
};

function loadSheetJSLib() {

    const urls = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
    return new Promise((resolve, reject) => {
        let i = 0;
        (function next() {
            if (i >= urls.length) return reject(new Error('SheetJS load nahi ho paya.'));
            let s = document.createElement('script'); s.src = urls[i++]; s.onload = () => window.XLSX ? resolve(window.XLSX) : next(); s.onerror = next; document.head.appendChild(s);
        })();

}
function poNormKey(v) { return String(v == null ? '' : v).trim().replace(/\s+/g, '').toLowerCase(); }
function poToNum(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; let n = parseFloat(String(v == null ? '' : v).replace(/[₹,\s]/g, '')); return isFinite(n) ? n : 0; }
function poCellTxt(v) { return v == null ? '' : String(v).trim(); }
function poExcelDate(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number' && v > 25000 && v < 75000) { let u = new Date(Math.round((v - 25569) * 86400000)); return `${poPad2(u.getUTCDate())}-${poPad2(u.getUTCMonth() + 1)}-${u.getUTCFullYear()}`; }
    let iso = toISODateAny(String(v).trim()); return iso ? formatDate(iso) : String(v).trim();
}
function poValAfterLabel(row, colIdx, rx) {
    let inl = poCellTxt(row[colIdx]).replace(rx, '').replace(/^[\s:\-]+/, '').trim(); if (inl) return inl;
    for (let c = colIdx + 1; c < Math.min(row.length, colIdx + 8); c++) if (row[c] != null && String(row[c]).trim() !== '') return row[c];
    return '';
}

function parseMasterExcelBills(wb) {
    let allBills = [], sheetsScanned = 0;
    wb.SheetNames.forEach(sheetName => {
        if (/^formula$/i.test(sheetName.trim())) return;
        let ws = wb.Sheets[sheetName]; if (!ws) return;
        sheetsScanned++;
        let rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
        if (!rows || rows.length < 5) return;

        let anchors = [];
        for (let r = 0; r < rows.length; r++) for (let c = 0; c < (rows[r] || []).length; c++) if (/gst\s*invoice\s*no/i.test(poCellTxt(rows[r][c]))) { anchors.push({ row: r, col: c }); break; }
        for (let a = 0; a < anchors.length; a++) {
            let startR = anchors[a].row, endR = Math.min(a + 1 < anchors.length ? anchors[a + 1].row - 1 : rows.length - 1, startR + 75);
            let invoiceNo = '', invoiceDate = '', memoNo = '', memoDate = '', poNo = '', poDate = '', buyerGst = '';
            let toCol = -1, invCol = anchors[a].col, sellerCol = -1, headerRow = -1, colMap = { sl:-1, desc:-1, hsn:-1, price:-1, qty:-1, cgst:-1, sgst:-1, total:-1 }, extraLines = [];

            for (let r = startR; r <= Math.min(endR, startR + 16); r++) {
                let row = rows[r] || [], lt = row.map(poCellTxt).filter(Boolean).join(' ');
                if (lt && !/invoice\s*date|po\s*date|memo\s*date/i.test(lt)) extraLines.push(lt);
                for (let c = 0; c < row.length; c++) {
                    let txt = poCellTxt(row[c]); if (!txt) continue;
                    if (r === startR && sellerCol === -1 && c < invCol && !/^to$/i.test(txt)) sellerCol = c;
                    if (toCol === -1 && /^to$/i.test(txt)) toCol = c;
                    if (!invoiceNo && /gst\s*invoice\s*no/i.test(txt)) invoiceNo = poCellTxt(poValAfterLabel(row, c, /gst\s*invoice\s*no/i));
                    else if (!invoiceDate && /invoice\s*date/i.test(txt)) invoiceDate = poExcelDate(poValAfterLabel(row, c, /invoice\s*date/i));
                    else if (!memoNo && /memo\s*no/i.test(txt)) memoNo = poCellTxt(poValAfterLabel(row, c, /memo\s*no/i));
                    else if (!memoDate && /memo\s*date/i.test(txt)) memoDate = poExcelDate(poValAfterLabel(row, c, /memo\s*date/i));
                    else if (!poNo && /\bpo\s*no\b/i.test(txt)) { let rp = poValAfterLabel(row, c, /.*?\bpo\s*no\b/i); poNo = typeof rp === 'number' ? String(Math.round(rp)) : poCellTxt(rp); }
                    else if (!poDate && /\bpo\s*date\b/i.test(txt)) poDate = poExcelDate(poValAfterLabel(row, c, /.*?\bpo\s*date\b/i));
                    else if (!buyerGst && /buyer.*gst/i.test(txt)) buyerGst = poCellTxt(poValAfterLabel(row, c, /buyer.*gst\s*(number|no)?/i));
                    if (headerRow === -1 && /description\s*of\s*goods/i.test(txt)) headerRow = r;
                }
                if (headerRow !== -1) break;
            }
            if (!poNo) continue;

            let sellerLines = [], buyerLines = [], metaEnd = headerRow > startR ? headerRow - 1 : Math.min(endR, startR + 8);
            for (let r = startR; r <= metaEnd; r++) {
                let row = rows[r] || [];
                if (sellerCol !== -1 && poCellTxt(row[sellerCol])) sellerLines.push(poCellTxt(row[sellerCol]));
                if (toCol !== -1 && r > startR) { let bt = poCellTxt(row[toCol]); if (bt && !/buyer.*gst/i.test(bt)) buyerLines.push(bt); }
            }
            if (headerRow !== -1) (rows[headerRow] || []).forEach((v, c) => {
                let h = poCellTxt(v).toLowerCase(); if (!h) return;
                if (colMap.sl === -1 && /sl/.test(h)) colMap.sl = c; else if (colMap.desc === -1 && /description/.test(h)) colMap.desc = c;
                else if (colMap.hsn === -1 && /hsn/.test(h)) colMap.hsn = c; else if (colMap.price === -1 && /(price|rate)/.test(h)) colMap.price = c;
                else if (colMap.qty === -1 && /qty|quantity/.test(h)) colMap.qty = c; else if (colMap.cgst === -1 && /cgst/.test(h)) colMap.cgst = c;
                else if (colMap.sgst === -1 && /sgst/.test(h)) colMap.sgst = c; else if (colMap.total === -1 && /total/.test(h)) colMap.total = c;
            });

            let items = [], itemZoneLines = [], subTotal = 0, gstTotal = 0, roundOff = 0, grandTotal = 0, amountWords = '', bankLines = [], inItems = headerRow !== -1, bankCol = -1;
            for (let r = (headerRow !== -1 ? headerRow + 1 : startR + 1); r <= endR; r++) {
                let row = rows[r] || [], joined = row.map(poCellTxt).filter(Boolean).join(' '); if (!joined) continue;
                if (/total\s*amount\s*\(\s*including\s*gst\s*\)/i.test(joined)) { inItems = false; grandTotal = poToNum(row[colMap.total !== -1 ? colMap.total : row.length - 1]); if (!grandTotal) for (let c = row.length - 1; c >= 0; c--) { let n = poToNum(row[c]); if (n > 0) { grandTotal = n; break; } } continue; }
                if (/amount\s*\(\s*in\s*words\s*\)/i.test(joined)) { inItems = false; amountWords = joined.replace(/.*?amount\s*\(\s*in\s*words\s*\)\s*:?\s*/i, '').trim(); continue; }
                if (/bank\s*details/i.test(joined)) { inItems = false; for (let c = 0; c < row.length; c++) if (/bank\s*details/i.test(poCellTxt(row[c]))) { bankCol = c; break; } continue; }
                if (bankCol !== -1) { let bl = row.slice(bankCol, bankCol + 5).map(poCellTxt).filter(Boolean).join(' '); if (bl) bankLines.push(bl); continue; }

                let hit = false;
                for (let c = 0; c < row.length; c++) {
                    let t = poCellTxt(row[c]);
                    if (/^total\s*amount$/i.test(t)) { inItems = false; hit = true; subTotal = poToNum(row[colMap.total !== -1 ? colMap.total : c + 1]); }
                    else if (/^gst$/i.test(t)) { inItems = false; hit = true; gstTotal = poToNum(row[colMap.total !== -1 ? colMap.total : c + 1]); }
                    else if (/^round\s*off$/i.test(t)) { inItems = false; hit = true; roundOff = poToNum(row[colMap.total !== -1 ? colMap.total : c + 1]); }
                }
                if (hit) continue;
                if (inItems) {
                    itemZoneLines.push(joined);
                    if (colMap.desc !== -1) {
                        let desc = poCellTxt(row[colMap.desc]), tot = colMap.total !== -1 ? poToNum(row[colMap.total]) : 0, rate = colMap.price !== -1 ? poToNum(row[colMap.price]) : 0;
                        if (desc && (tot > 0 || rate > 0 || poCellTxt(row[colMap.sl]))) items.push({ sl: colMap.sl !== -1 ? poCellTxt(row[colMap.sl]) : String(items.length + 1), desc, hsn: colMap.hsn !== -1 ? poCellTxt(row[colMap.hsn]) : '', rate, qty: colMap.qty !== -1 ? poCellTxt(row[colMap.qty]) : '', cgst: colMap.cgst !== -1 ? poToNum(row[colMap.cgst]) : 0, sgst: colMap.sgst !== -1 ? poToNum(row[colMap.sgst]) : 0, total: tot });
                    }
                }
            }
            if (!grandTotal && items.length) grandTotal = items.reduce((s, it) => s + (it.total || 0), 0);
            if (!gstTotal && items.length) gstTotal = items.reduce((s, it) => s + (it.cgst || 0) + (it.sgst || 0), 0);
            if (!subTotal && grandTotal) subTotal = Math.max(0, grandTotal - gstTotal - roundOff);
            let pi = extractBillPeriodFromLines(itemZoneLines) || extractBillPeriodFromLines(extraLines);
            allBills.push({ sheet: sheetName, invoiceNo: invoiceNo || `${sheetName}-R${startR + 1}`, invoiceDate, memoNo, memoDate, poNo, poDate, buyerGst, periodStart: pi ? pi.start : '', periodEnd: pi ? pi.end : '', periodLabel: pi ? pi.label : '', sellerLines: sellerLines.slice(0, 7), buyerLines: buyerLines.slice(0, 5), items, subTotal, gstTotal, roundOff, grandTotal, amountWords, bankLines: bankLines.slice(0, 7) });
        }
    });
    return { allBills, sheetsScanned };
}

async function handlePOExcelFileSelected(ev) {
    let file = ev.target.files && ev.target.files[0]; if (!file) return;
    let btn = document.getElementById('poSyncExcelBtn'), orig = btn ? btn.innerHTML : '';
    if (btn) { btn.innerHTML = '⏳ Scanning Excel...'; btn.disabled = true; }
    try {
        await loadSheetJSLib();
        let wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' }), { allBills, sheetsScanned } = parseMasterExcelBills(wb);
        let billsByPO = new Map();
        allBills.forEach(b => { let k = poNormKey(b.poNo); if (!k) return; if (!billsByPO.has(k)) billsByPO.set(k, []); let arr = billsByPO.get(k), d = arr.findIndex(x => x.invoiceNo.toLowerCase() === b.invoiceNo.toLowerCase() && x.sheet === b.sheet); if (d >= 0) arr[d] = b; else arr.push(b); });
        let matched = [], totAtt = 0;
        appData.poRecords = getArray(appData.poRecords);
        appData.poRecords.forEach(po => {
            let k = poNormKey(po.poNo); if (!k || !billsByPO.has(k)) return;
            let inc = billsByPO.get(k), merged = [...getArray(po.excelBills)];
            inc.forEach(nb => {

                if (idx >= 0) { if (!nb.periodLabel && merged[idx].periodLabel) { let op = getBillPeriodInfo(merged[idx]); if (op) { nb.periodStart = op.start; nb.periodEnd = op.end; nb.periodLabel = op.label; } } merged[idx] = nb; }
                else merged.push(nb);

            totAtt += inc.length; matched.push({ po, billCount: inc.length, ...getPOBillingSummary(po) });
        });

function detectSubBillType(billNo, period, poNo) {
    let bn = String(billNo || '').trim().toLowerCase(), pr = String(period || '').trim().toLowerCase();
    if (bn.startsWith('sd-') || /\bsd\b|security\s*deposit|sd\s*refund/i.test(pr)) return 'SD Refund';
    return String(poNo || '').trim() ? 'Bill' : 'Other';
}
function getSubBillSortMs(b) {
    if (!b) return 0;
    let iso = toISODateAny(b.date);
    if (iso) { let dt = parseISODateLocal(iso); if (dt) return dt.getTime(); }
    return Number(b.id) || 0;
}
function fillSubBillFromExcel(po, b) {
    let s = (id, v) => { let e = document.getElementById(id); if (e) e.value = v; }, pi = getBillPeriodInfo(b);
    s('sbDate', toISODateAny(b.invoiceDate) || getTodayISO()); s('sbLocation', po.authority || ''); s('sbBillNo', b.invoiceNo || '');
    s('sbPoNo', po.poNo || ''); s('sbPeriod', pi ? pi.label : (po.workDesc || 'Full Bill (One-time)')); s('sbAmount', (Number(b.grandTotal) || 0).toFixed(2));
    let h = document.getElementById('sbAutoHint'); if (h) h.innerHTML = `✅ Excel Bill <b>${escPOHtml(b.invoiceNo)}</b> auto-filled from PO <b>${escPOHtml(po.poNo)}</b>`;
}
function fillSubBillFromSD(po) {
    let s = (id, v) => { let e = document.getElementById(id); if (e) e.value = v; };
    s('sbDate', toISODateAny(po.sdAppliedDate) || getTodayISO()); s('sbLocation', po.authority || ''); s('sbBillNo', `SD-${po.poNo}`);
    s('sbPoNo', po.poNo || ''); s('sbPeriod', `SD Refund · ${po.workDesc || po.poType || 'PO'}`); s('sbAmount', (parseFloat(po.sdAmount) || 0).toFixed(2));
    let h = document.getElementById('sbAutoHint'); if (h) h.innerHTML = `✅ SD Refund <b>₹${fmtPOMoney(po.sdAmount)}</b> auto-filled from PO <b>${escPOHtml(po.poNo)}</b>`;

function autoFetchSubBillFromBillNo() {
    let bn = ((document.getElementById('sbBillNo') || {}).value || '').trim().toLowerCase(); if (!bn) return;
    for (let po of getArray(appData.poRecords)) {
        for (let b of getArray(po.excelBills)) if ((b.invoiceNo || '').trim().toLowerCase() === bn) { fillSubBillFromExcel(po, b); return; }
        if ((`sd-${po.poNo || ''}`).toLowerCase() === bn && (parseFloat(po.sdAmount) || 0) > 0) { fillSubBillFromSD(po); return; }
    }
}
function autoFetchSubBillFromPO() {
    let poNo = ((document.getElementById('sbPoNo') || {}).value || '').trim(); if (!poNo) return;
    let po = getArray(appData.poRecords).find(p => poNormKey(p.poNo) === poNormKey(poNo)); if (!po) return;
    let exNos = new Set(getArray(appData.submittedBills).map(b => (b.billNo || '').trim().toLowerCase()));
    let bills = getArray(po.excelBills), unadded = bills.find(b => !exNos.has((b.invoiceNo || '').trim().toLowerCase()));
    let sdAmt = parseFloat(po.sdAmount) || 0, hasPendingSD = sdAmt > 0 && !po.sdReceived;
    if (unadded) fillSubBillFromExcel(po, unadded);
    else if (hasPendingSD && (po.isCompleted || po.sdAppliedDate)) fillSubBillFromSD(po);
    else if (bills.length) fillSubBillFromExcel(po, bills[bills.length - 1]);
    else {
        let s = (id, v) => { let e = document.getElementById(id); if (e) e.value = v; };
        s('sbLocation', po.authority || ''); s('sbPeriod', po.poType === 'AMC PO' ? 'Quarterly (3 Months)' : (po.workDesc || 'Full Bill (One-time)')); s('sbAmount', (parseFloat(po.amount) || 0).toFixed(2));
        let h = document.getElementById('sbAutoHint'); if (h) h.innerHTML = `✅ PO details fetched (${escPOHtml(po.authority)} · ₹${fmtPOMoney(po.amount)})`;
    }
}
async function autoSyncAllSubBillsFromPO() {
    appData.submittedBills = getArray(appData.submittedBills);
    let exNos = new Set(appData.submittedBills.map(b => (b.billNo || '').trim().toLowerCase()));
    let exSD = new Set(appData.submittedBills.filter(b => (b.billType || detectSubBillType(b.billNo, b.period, b.poNo)) === 'SD Refund').map(b => poNormKey(b.poNo)));
    let aB = 0, aS = 0, bid = Date.now();
    getArray(appData.poRecords).forEach(po => {
        getArray(po.excelBills).forEach(b => {
            let inv = (b.invoiceNo || '').trim(); if (!inv || exNos.has(inv.toLowerCase())) return;
            let pi = getBillPeriodInfo(b);
            appData.submittedBills.unshift({ id: bid++, billType: 'Bill', date: toISODateAny(b.invoiceDate) || po.date || getTodayISO(), location: po.authority || '-', billNo: inv, poNo: po.poNo || '', period: pi ? pi.label : (po.workDesc || 'Full Bill (One-time)'), amount: (Number(b.grandTotal) || 0).toFixed(2), isPaid: false });
            exNos.add(inv.toLowerCase()); aB++;
        });
        let sd = parseFloat(po.sdAmount) || 0;
        if (sd > 0 && !po.sdReceived && po.sdAppliedDate) {
            let sdNo = `SD-${po.poNo}`;
            if (!exNos.has(sdNo.toLowerCase()) && !exSD.has(poNormKey(po.poNo))) {
                appData.submittedBills.unshift({ id: bid++, billType: 'SD Refund', date: toISODateAny(po.sdAppliedDate) || getTodayISO(), location: po.authority || '-', billNo: sdNo, poNo: po.poNo || '', period: `SD Refund · ${po.workDesc || po.poType || 'PO'}`, amount: sd.toFixed(2), isPaid: false });
                exNos.add(sdNo.toLowerCase()); exSD.add(poNormKey(po.poNo)); aS++;
            }
        }
    });
    if (!aB && !aS) return alert('Sabhi synced Excel Bills aur Applied SD Refunds pehle se Bill Tracker mein hain!\n(Tip: Naye SD ke liye PO Tracker mein "Apply SD" date set karein.)');
    await saveDataToLocal(); showSubmittedBills();
    alert(`✅ Auto-Fetch Complete!\n• ${aB} Excel Bill${aB !== 1 ? 's' : ''} added\n• ${aS} Applied SD Refund${aS !== 1 ? 's' : ''} added`);
}

function renderSubBillRows() {

    let sBills = [...getArray(appData.submittedBills)];

    if (sf === 'pending') sBills = sBills.filter(b => !b.isPaid); else if (sf === 'paid') sBills = sBills.filter(b => b.isPaid);
    if (q) sBills = sBills.filter(b => (b.billNo && b.billNo.toLowerCase().includes(q)) || (b.poNo && b.poNo.toLowerCase().includes(q)) || (b.location && b.location.toLowerCase().includes(q)) || (b.period && b.period.toLowerCase().includes(q)) || ((b.billType || 'Bill').toLowerCase().includes(q)) || (b.date && formatDate(b.date).toLowerCase().includes(q)));
