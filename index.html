function getArray(data) { if (!data) return []; if (Array.isArray(data)) return data; return Object.values(data); }

function getUniqueOptions(arr1, key1, arr2=[], key2='') {
    let vals = getArray(arr1).map(x => x[key1]).filter(Boolean);
    if(arr2.length > 0 && key2) vals = vals.concat(getArray(arr2).map(x => x[key2]).filter(Boolean));
    return [...new Set(vals)].sort().map(v => `<option value="${v}">`).join('');
}

function compressImage(file) {
    return new Promise((resolve) => {
        if(!file) return resolve('');
        let reader = new FileReader();
        reader.onload = function(event) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas'); let ctx = canvas.getContext('2d');
                let maxWidth = 800; let maxHeight = 800; let width = img.width; let height = img.height;
                if (width > height) { if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; } } 
                else { if (height > maxHeight) { width = Math.round(width * maxHeight / height); height = maxHeight; } }
                canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.7)); 
            };
            img.onerror = () => { alert("⚠️ File error! Please upload a valid image."); resolve(''); };
            img.src = event.target.result;
        };
        reader.onerror = () => resolve(''); reader.readAsDataURL(file);
    });
}

async function uploadToImgBB(base64Str) {
    if (!base64Str || !base64Str.startsWith('data:image')) return ''; 
    try {
        let byteString = atob(base64Str.split(',')[1]); let mimeString = base64Str.split(',')[0].split(':')[1].split(';')[0];
        let ab = new ArrayBuffer(byteString.length); let ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        let blob = new Blob([ab], {type: mimeString});
        let formData = new FormData(); formData.append("image", blob, "photo.jpg");
        let response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
        let data = await response.json();
        return (data && data.success) ? data.data.url : '';
    } catch (error) { return ''; }
}

const INACTIVITY_TIMEOUT = 20 * 60 * 1000; let inactivityTimer = null;
function resetInactivityTimer() {
    if (!localStorage.getItem('st_user')) return;
    localStorage.setItem('st_last_active', Date.now().toString());
    if (inactivityTimer) clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => { alert("⏰ Auto logout due to inactivity."); logoutApp(); }, INACTIVITY_TIMEOUT);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => window.addEventListener(evt, resetInactivityTimer, { passive: true }));

function formatDate(dateStr) {
    if (!dateStr) return ''; let parts = dateStr.split('-');
    if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0].slice(-2); 
    return dateStr;
}

async function hashPassword(password) {
    const encoder = new TextEncoder(); const data = encoder.encode(password);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateMonthDropdown() {
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    let options = '<option value="All Time">All Time</option>';
    for (let year = 2026; year <= new Date().getFullYear() + 3; year++) {
        options += `<optgroup label="${year}">`;
        months.forEach((month, index) => {
            if (year === 2026 && index < 3) return; 
            let sel = (month === "August" && year === 2026) ? "selected" : "";
            options += `<option value="${month} ${year}" ${sel}>${month} ${year}</option>`;
        });
        options += `</optgroup>`;
    }
    return `<select id="headerMonthSelect" style="background:white;color:#17352b;padding:8px 12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;flex-shrink:0;width:auto;margin:0;" onchange="handleGlobalMonthChange()">${options}</select>`;
}

function generateMiniMonthDropdown(currentValue) {
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    let options = '<option value="All Time">All Time</option>';
    for (let year = 2026; year <= new Date().getFullYear() + 3; year++) {

            let val = `${month} ${year}`;

// ====== OVERVIEW ======
function showAdminOverview(){
    setActiveAdminTab('tab-overview');
    let tanBal = appData.balances['Tanmoy'] || 0; let tapBal = appData.balances['Tapabrata'] || 0;
    let totalBusiness = tanBal + tapBal;
    let hm = document.getElementById('headerMonthSelect'); let selectedMonthText = hm ? hm.value : "August 2026";
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';
    
    function getMonthData(pName, monthStr) {
        let recs = getArray(appData.records[pName]);
        if (monthStr && monthStr !== "All Time") {
            let parts = monthStr.split(' ');
            let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1;
            let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString();
            let mQuery = parts[1] + '-' + mStr; 
            recs = recs.filter(r => r.date && r.date.startsWith(mQuery));
        }
        let inc = 0, exp = 0, prof = 0;
        recs.forEach(r => {
            if(!appData.config?.enablePastCF && r.date < cutoffDate) return;
            let amt = parseFloat(r.amount) || 0;
            if(r.type === 'income') inc += amt;
            else if(r.type === 'expense') exp += amt;
            else if(r.type === 'profit') prof += amt;
        });
        return { net: inc - exp - prof, prof: prof };
    }

    function getHistoricalBal(pName, monthStr) {
        if(!monthStr || monthStr === "All Time") return { bal: 0, month: "All Time" };
        let parts = monthStr.split(' '); let mName = parts[0]; let yNum = parseInt(parts[1]);
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let mIndex = months.indexOf(mName); let prevMIndex = mIndex === 0 ? 11 : mIndex - 1; let prevYearNum = mIndex === 0 ? yNum - 1 : yNum;
        let lastDay = new Date(prevYearNum, prevMIndex + 1, 0, 23, 59, 59);
        let pRecs = getArray(appData.records[pName]); 
        
        let validPastNet = 0;
        pRecs.forEach(r => { 
            if(r.date) {
                let dP = r.date.split('-'); 
                let rDate = new Date(parseInt(dP[0]), parseInt(dP[1])-1, parseInt(dP[2]), 12, 0, 0);
                if(rDate <= lastDay) {
                    if (appData.config?.enablePastCF || r.date >= cutoffDate) {
                        validPastNet += (r.type === 'income' ? parseFloat(r.amount) : -parseFloat(r.amount)); 
                    }
                }
            }
        });
        return { bal: validPastNet, month: `${months[prevMIndex]} ${prevYearNum}` };
    }
    
    let tanDataMonth = getMonthData('Tanmoy', selectedMonthText);
    let tapDataMonth = getMonthData('Tapabrata', selectedMonthText);
    
    let tanBalToDisplay = selectedMonthText === "All Time" ? 0 : tanDataMonth.net;
    let tapBalToDisplay = selectedMonthText === "All Time" ? 0 : tapDataMonth.net;
    
    if(selectedMonthText === "All Time") {
        getArray(appData.records['Tanmoy']).forEach(r => { if(appData.config?.enablePastCF || r.date >= cutoffDate) tanBalToDisplay += (r.type==='income'?parseFloat(r.amount):-parseFloat(r.amount)); });
        getArray(appData.records['Tapabrata']).forEach(r => { if(appData.config?.enablePastCF || r.date >= cutoffDate) tapBalToDisplay += (r.type==='income'?parseFloat(r.amount):-parseFloat(r.amount)); });
    }

    let tanData = getHistoricalBal('Tanmoy', selectedMonthText); let tapData = getHistoricalBal('Tapabrata', selectedMonthText);
    let carryTextTanmoy = selectedMonthText === "All Time" ? "₹0" : `₹${tanData.bal.toLocaleString('en-IN')}`;
    let carryTextTapabrata = selectedMonthText === "All Time" ? "₹0" : `₹${tapData.bal.toLocaleString('en-IN')}`;
    
    // Extracted Trackers
    let billList = getArray(appData.submittedBills); let pendingBillsArr = billList.filter(b => !b.isPaid);
    let pendingBillAmt = pendingBillsArr.reduce((sum, b) => sum + (parseFloat(b.amount) || 0), 0);
    let pendingBillsHTML = `<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:13px;"><tr style="background:#f5eef8; color:#8e44ad; text-align:left;"><th style="padding:8px; border-bottom:1px solid #ddd;">Date</th><th style="padding:8px; border-bottom:1px solid #ddd;">Location / Party</th><th style="padding:8px; border-bottom:1px solid #ddd;">Bill No. & Period</th><th style="padding:8px; border-bottom:1px solid #ddd;">Amount</th></tr>`;
    if(pendingBillsArr.length > 0) pendingBillsHTML += pendingBillsArr.map(b => `<tr><td style="padding:8px; border-bottom:1px solid #eee;">${formatDate(b.date)}</td><td style="padding:8px; border-bottom:1px solid #eee;"><strong>${b.location}</strong></td><td style="padding:8px; border-bottom:1px solid #eee;">${b.billNo}</td><td style="padding:8px; border-bottom:1px solid #eee; font-weight:bold; color:#e21d4f;">₹${b.amount}</td></tr>`).join('');
    else pendingBillsHTML += `<tr><td colspan="4" style="text-align:center; padding:15px; color:#888;">All bills paid! 💸</td></tr>`;
    pendingBillsHTML += `</table></div>`;

    let invRecords = getArray(appData.invoices); let pendingInvArr = invRecords.filter(i => !i.isPaid);
    let pendingInvAmt = pendingInvArr.reduce((sum, i) => sum + (parseFloat(i.gTotal) || 0), 0);
    let pendingInvHTML = `<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:13px;"><tr style="background:#fcf3cf; color:#d35400; text-align:left;"><th style="padding:8px; border-bottom:1px solid #ddd;">Date</th><th style="padding:8px; border-bottom:1px solid #ddd;">Voucher No.</th><th style="padding:8px; border-bottom:1px solid #ddd;">Name</th><th style="padding:8px; border-bottom:1px solid #ddd;">Amount</th></tr>`;

function renderPartnerData(name) {
    let globalMonth = document.getElementById('headerMonthSelect') ? document.getElementById('headerMonthSelect').value : '';
    let monthQuery = '';
    
    if (globalMonth && globalMonth !== 'All Time') {
        let parts = globalMonth.split(' '); 
        let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]) + 1;
        let mStr = mIdx < 10 ? '0' + mIdx : mIdx.toString();
        monthQuery = parts[1] + '-' + mStr; 
    }

    let query = document.getElementById('partnerSearchInput') ? document.getElementById('partnerSearchInput').value.toLowerCase() : '';
    let recs = [...getArray(appData.records[name])].sort((a,b)=>new Date(b.date)-new Date(a.date));
    
    if (monthQuery) recs = recs.filter(r => r.date && r.date.startsWith(monthQuery));
    if (query) recs = recs.filter(r => (r.details && r.details.toLowerCase().includes(query)) || (r.amount && r.amount.toString().includes(query)) || (r.date && r.date.includes(query)) || (r.billNo && r.billNo.toLowerCase().includes(query)));
    
    let totalInc = 0, totalExp = 0, totalProf = 0;

    let incs = recs.filter(r=>r.type==='income').map(r=> {
        totalInc += parseFloat(r.amount) || 0;
        let proof = '-'; 
        if (r.photo && r.photo.length > 5) proof = `<a href="${r.photo}" target="_blank" style="text-decoration:none; font-size:16px;">📷</a>`; 
        else if (r.link && r.link.length > 5) proof = `<a href="${r.link}" target="_blank" style="text-decoration:none; font-size:16px;">🔗</a>`;
        let bTag = r.billNo ? `<br><span style="font-size:11px; color:#8e44ad; font-weight:bold;">🧾 ${r.billNo}</span>` : '';
        let rState = r.reconState !== undefined ? r.reconState : (r.isReconciled ? 1 : 0);
        let statusIcon = rState === 1 ? '✅' : (rState === 2 ? '❌' : '⬜');
        let bgStyle = rState === 1 ? 'background-color:#eefdf6 !important;' : (rState === 2 ? 'background-color:#fadbd8 !important;' : '');

        return `<tr onclick="toggleRowCheck(this, event, 'inc', '${r.id}', '${name}')" style="cursor:pointer; transition: background 0.2s; ${bgStyle}">
            <td style="text-align:center; user-select:none;" class="recon-cell" data-state="${rState}" data-id="${r.id}" data-amt="${r.amount}">${statusIcon}</td>
            <td>${formatDate(r.date)}</td><td>${r.details}${bTag}</td><td style="text-align:center;">${proof}</td><td class="positive">₹${r.amount}</td>
            <td style="white-space:nowrap;"><button onclick="editEntry('${r.id}', 'income', '${name}')" style="background:#f39c12; color:white; border:none; border-radius:4px; padding:4px 6px;">✏️</button><button onclick="deleteEntry('${r.id}', '${name}')" style="background:#e21d4f; color:white; border:none; border-radius:4px; padding:4px 6px; margin-left:4px;">🗑️</button></td></tr>`;
    }).join('');
    
    let exps = recs.filter(r=>r.type==='expense').map(r=> {
        totalExp += parseFloat(r.amount) || 0;
        let proof = '-'; 
        if (r.photo && r.photo.length > 5) proof = `<a href="${r.photo}" target="_blank" style="text-decoration:none; font-size:16px;">📷</a>`; 
        else if (r.link && r.link.length > 5) proof = `<a href="${r.link}" target="_blank" style="text-decoration:none; font-size:16px;">🔗</a>`;
        let rState = r.reconState !== undefined ? r.reconState : (r.isReconciled ? 1 : 0);
        let statusIcon = rState === 1 ? '✅' : (rState === 2 ? '❌' : '⬜');
        let bgStyle = rState === 1 ? 'background-color:#fdedec !important;' : (rState === 2 ? 'background-color:#fadbd8 !important;' : '');

        return `<tr onclick="toggleRowCheck(this, event, 'exp', '${r.id}', '${name}')" style="cursor:pointer; transition: background 0.2s; ${bgStyle}">
            <td style="text-align:center; user-select:none;" class="recon-cell" data-state="${rState}" data-id="${r.id}" data-amt="${r.amount}">${statusIcon}</td>
            <td>${formatDate(r.date)}</td><td>${r.details}</td><td style="text-align:center;">${proof}</td><td class="negative">₹${r.amount}</td>
            <td style="white-space:nowrap;"><button onclick="editEntry('${r.id}', 'expense', '${name}')" style="background:#f39c12; color:white; border:none; border-radius:4px; padding:4px 6px;">✏️</button><button onclick="deleteEntry('${r.id}', '${name}')" style="background:#e21d4f; color:white; border:none; border-radius:4px; padding:4px 6px; margin-left:4px;">🗑️</button></td></tr>`;
    }).join('');

    let profs = recs.filter(r=>r.type==='profit').map(r=> {
        totalProf += parseFloat(r.amount) || 0;
        let proof = '-'; 
        if (r.photo && r.photo.length > 5) proof = `<a href="${r.photo}" target="_blank" style="text-decoration:none; font-size:16px;">📷</a>`; 
        else if (r.link && r.link.length > 5) proof = `<a href="${r.link}" target="_blank" style="text-decoration:none; font-size:16px;">🔗</a>`;
        let rState = r.reconState !== undefined ? r.reconState : (r.isReconciled ? 1 : 0);
        let statusIcon = rState === 1 ? '✅' : (rState === 2 ? '❌' : '⬜');
        let bgStyle = rState === 1 ? 'background-color:#f4ecf7 !important;' : (rState === 2 ? 'background-color:#fadbd8 !important;' : '');

        return `<tr onclick="toggleRowCheck(this, event, 'prof', '${r.id}', '${name}')" style="cursor:pointer; transition: background 0.2s; ${bgStyle}">
            <td style="text-align:center; user-select:none;" class="recon-cell" data-state="${rState}" data-id="${r.id}" data-amt="${r.amount}">${statusIcon}</td>
            <td>${formatDate(r.date)}</td><td>${r.details}</td><td style="text-align:center;">${proof}</td><td style="color:#8e44ad; font-weight:bold;">₹${r.amount}</td>
            <td style="white-space:nowrap;"><button onclick="editEntry('${r.id}', 'profit', '${name}')" style="background:#f39c12; color:white; border:none; border-radius:4px; padding:4px 6px;">✏️</button><button onclick="deleteEntry('${r.id}', '${name}')" style="background:#e21d4f; color:white; border:none; border-radius:4px; padding:4px 6px; margin-left:4px;">🗑️</button></td></tr>`;
    }).join('');
    
    document.getElementById('incTable').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #07865b; margin-bottom:8px; padding-bottom:4px;"><div style="display:flex; align-items:center;"><h3 style="color:#07865b; margin:0;">🟢 Income</h3><span id="incGroupTotalBadge" style="display:none; background:#d4efdf; color:#07865b; padding:4px 8px; border-radius:10px; font-size:13px; margin-left:10px; font-weight:bold;">Matched: ₹0</span></div><b style="color:#07865b;">Total: ₹${totalInc.toLocaleString('en-IN')}</b></div><div style="overflow-x:auto;"><table><tr><th style="width:40px; text-align:center;"><button onclick="toggleAllRows('inc', '${name}')" style="background:#eee; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:11px; padding:3px 5px; color:#333;">All</button></th><th>Date</th><th>Details</th><th style="text-align:center;">Proof</th><th>Amt</th><th>Action</th></tr>${incs||'<tr><td colspan="6" style="text-align:center;">No records</td></tr>'}</table></div>`;
    document.getElementById('expTable').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #e21d4f; margin-bottom:8px; padding-bottom:4px;"><div style="display:flex; align-items:center;"><h3 style="color:#e21d4f; margin:0;">🔴 Expense</h3><span id="expGroupTotalBadge" style="display:none; background:#fadbd8; color:#e21d4f; padding:4px 8px; border-radius:10px; font-size:13px; margin-left:10px; font-weight:bold;">Matched: ₹0</span></div><b style="color:#e21d4f;">Total: ₹${totalExp.toLocaleString('en-IN')}</b></div><div style="overflow-x:auto;"><table><tr><th style="width:40px; text-align:center;"><button onclick="toggleAllRows('exp', '${name}')" style="background:#eee; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:11px; padding:3px 5px; color:#333;">All</button></th><th>Date</th><th>Details</th><th style="text-align:center;">Proof</th><th>Amt</th><th>Action</th></tr>${exps||'<tr><td colspan="6" style="text-align:center;">No records</td></tr>'}</table></div>`;
    document.getElementById('profTable').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #8e44ad; margin-bottom:8px; padding-bottom:4px;"><div style="display:flex; align-items:center;"><h3 style="color:#8e44ad; margin:0;">🟣 Profit Booked</h3><span id="profGroupTotalBadge" style="display:none; background:#ebdef0; color:#8e44ad; padding:4px 8px; border-radius:10px; font-size:13px; margin-left:10px; font-weight:bold;">Matched: ₹0</span></div><b style="color:#8e44ad;">Total: ₹${totalProf.toLocaleString('en-IN')}</b></div><div style="overflow-x:auto;"><table><tr><th style="width:40px; text-align:center;"><button onclick="toggleAllRows('prof', '${name}')" style="background:#eee; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:11px; padding:3px 5px; color:#333;">All</button></th><th>Date</th><th>Details</th><th style="text-align:center;">Proof</th><th>Amt</th><th>Action</th></tr>${profs||'<tr><td colspan="6" style="text-align:center;">No records</td></tr>'}</table></div>`;

    // SMART BALANCE CALCULATION LOGIC
    let currentNetBalance = totalInc - totalExp - totalProf;
    let cfBalance = 0; let totalCashInHand = currentNetBalance;
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';

    if (globalMonth && globalMonth !== 'All Time') {
        let parts = globalMonth.split(' '); let mIdx = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].indexOf(parts[0]); let yNum = parseInt(parts[1]);
        let endOfPrevMonth = new Date(yNum, mIdx, 0, 23, 59, 59);
        let validPastInc = 0, validPastExp = 0, validPastProf = 0;

        getArray(appData.records[name]).forEach(r => {
            if(r.date) {
                let rParts = r.date.split('-');
                if(rParts.length === 3) {
                    let rDate = new Date(parseInt(rParts[0]), parseInt(rParts[1])-1, parseInt(rParts[2]), 12, 0, 0);
                    if(rDate <= endOfPrevMonth) {
                        if(appData.config?.enablePastCF || r.date >= cutoffDate) {
                            let amt = parseFloat(r.amount) || 0;
                            if(r.type === 'income') validPastInc += amt;
                            else if(r.type === 'expense') validPastExp += amt;
                            else if(r.type === 'profit') validPastProf += amt;
                        }
                    }
                }
            }
        });
        cfBalance = validPastInc - validPastExp - validPastProf;
        totalCashInHand = cfBalance + currentNetBalance;
    } else {
        let validNet = 0;
        getArray(appData.records[name]).forEach(r => {
            if(appData.config?.enablePastCF || (r.date && r.date >= cutoffDate)) {
                let amt = parseFloat(r.amount) || 0; validNet += (r.type === 'income') ? amt : -amt;
            }
        });
        totalCashInHand = validNet; cfBalance = 0; currentNetBalance = totalCashInHand;
    }

async function savePartnerEntry(name) {
    let date = document.getElementById('entryDate').value, amt = parseFloat(document.getElementById('entryAmount').value), det = document.getElementById('entryDetails').value.trim();
    let billNo = document.getElementById('entryBillNo') ? document.getElementById('entryBillNo').value.trim() : '';
    let photoInput = document.getElementById('entryPhoto'); let file = photoInput.files[0];
    
    let isTransfer = document.getElementById('transferCheckbox') && document.getElementById('transferCheckbox').checked && currentEntryType !== 'profit';
    let isVehicle = document.getElementById('isVehicleExpense') && document.getElementById('isVehicleExpense').checked && currentEntryType === 'expense';
    let otherName = name === 'Tanmoy' ? 'Tapabrata' : 'Tanmoy';

    if(isNaN(amt) || amt <= 0) return alert("Valid Amount is required!");
    if(!isVehicle && !det) return alert("Details are required!");
    if(file && !file.type.startsWith('image/')) return alert("⚠️ ERROR: Only image files are allowed!");
    
    if(currentEditId !== null && (isTransfer || isVehicle)) {
        let oldR = getArray(appData.records[name]).find(r => String(r.id) === String(currentEditId));
        if (oldR) { appData.balances[name] -= (oldR.type === 'income' ? oldR.amount : -oldR.amount); appData.records[name] = getArray(appData.records[name]).filter(r => String(r.id) !== String(currentEditId)); }
        currentEditId = null; 
    }

    if (!isVehicle) {
        let isDuplicate = getArray(appData.records[name]).some(r => String(r.id) !== String(currentEditId) && r.date === date && r.amount === amt && (r.details||'').toLowerCase() === det.toLowerCase() && r.type === currentEntryType);
        if(isDuplicate) return alert("❌ DUPLICATE ENTRY!");
    }

    if(currentEntryType === 'income' && billNo) {
        let allRecs = [ ...getArray(appData.records['Tanmoy']), ...getArray(appData.records['Tapabrata']) ];
        let isBillUsed = allRecs.some(r => String(r.id) !== String(currentEditId) && r.billNo && r.billNo.toLowerCase() === billNo.toLowerCase());
        if(isBillUsed) return alert(`❌ DUPLICATE BILL!\nThis Bill No. (${billNo}) has already been received.`);
    }

    let btn = document.getElementById('entrySaveBtn'); let origText = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;

    try {
        appData.records[name] = getArray(appData.records[name]);
        let photoUrl = currentEditId && appData.records[name].find(r=>String(r.id)===String(currentEditId))?.photo ? appData.records[name].find(r=>String(r.id)===String(currentEditId)).photo : '';
        let oldLink = currentEditId && appData.records[name].find(r=>String(r.id)===String(currentEditId))?.link ? appData.records[name].find(r=>String(r.id)===String(currentEditId)).link : '';
        let oldReconState = currentEditId && appData.records[name].find(r=>String(r.id)===String(currentEditId))?.reconState !== undefined ? appData.records[name].find(r=>String(r.id)===String(currentEditId)).reconState : 0;
        
        if(file) { let b64 = await compressImage(file); photoUrl = await uploadToImgBB(b64); }
        if(!appData.balances[name]) appData.balances[name] = 0;
        
        let newEntryId = currentEditId || Date.now(), linkedEntryId = newEntryId + "_linked";

        if(currentEditId !== null) {
            let idx = appData.records[name].findIndex(r => String(r.id) === String(currentEditId));
            let oldR = appData.records[name][idx];
            appData.balances[name] -= (oldR.type==='income' ? oldR.amount : -oldR.amount);
            appData.balances[name] += (currentEntryType==='income' ? amt : -amt);
            appData.records[name][idx] = {id: currentEditId, date, details: det, amount: amt, type: currentEntryType, photo: photoUrl || '', link: oldLink || '', isAuto: oldR.isAuto || false, linkedId: oldR.linkedId || null, billNo: billNo, reconState: oldReconState};
        } else {
            if (isVehicle) {
                let qvCar = document.getElementById('qvCar').value, qvCat = document.getElementById('qvCategory').value, finalDetails = det || '-';
                let partnerDesc = det ? `🚗 ${qvCar} - ${qvCat} (${det})` : `🚗 ${qvCar} - ${qvCat}`;
                appData.vehicles = getArray(appData.vehicles);
                appData.vehicles.unshift({ id: newEntryId, date, car: qvCar, category: qvCat, details: finalDetails, amount: amt, photo: photoUrl || '', paidBy: name });
                appData.records[name].unshift({ id: newEntryId, date, details: partnerDesc, amount: amt, type: 'expense', photo: photoUrl || '', link: oldLink || '', isAuto: true, reconState: 0 });
                appData.balances[name] -= amt;
            } else {
                let mainDesc = isTransfer ? `${det} (To ${otherName})` : det;
                appData.records[name].unshift({ id: newEntryId, date, details: mainDesc, amount: amt, type: currentEntryType, photo: photoUrl || '', link: oldLink || '', isAuto: false, linkedId: isTransfer ? linkedEntryId : null, billNo: billNo, reconState: 0 });
                appData.balances[name] += (currentEntryType==='income' ? amt : -amt);
                if (isTransfer) {
                    let otherType = currentEntryType === 'expense' ? 'income' : 'expense', otherDesc = `${det} (From ${name})`;
                    appData.records[otherName] = getArray(appData.records[otherName]);
                    appData.records[otherName].unshift({ id: linkedEntryId, date, details: otherDesc, amount: amt, type: otherType, photo: photoUrl || '', link: '', isAuto: true, linkedId: newEntryId, reconState: 0 });
                    if(!appData.balances[otherName]) appData.balances[otherName] = 0;
                    appData.balances[otherName] += (otherType === 'income' ? amt : -amt);
                }
            }
        }

        if(currentEntryType === 'income' && billNo) {
            appData.submittedBills = getArray(appData.submittedBills);
            let bIdx = appData.submittedBills.findIndex(b => b.billNo && b.billNo.toLowerCase() === billNo.toLowerCase() && !b.isPaid);
            if(bIdx !== -1) appData.submittedBills[bIdx].isPaid = true;
        }

        await saveDataToLocal(); partnerProfile(name);
    } catch(e) { alert("Error saving."); btn.innerText = origText; btn.disabled = false; }
}

function deleteEntry(id, name) {
    let r = getArray(appData.records[name]).find(x=>String(x.id)===String(id));
    if(r && r.isAuto && !r.linkedId) {
        if(confirm("🚗 This is a Vehicle expense. Are you sure you want to permanently delete it?")) {
            appData.balances[name] -= (r.type==='income' ? r.amount : -r.amount);
            appData.records[name] = getArray(appData.records[name]).filter(x=>String(x.id)!==String(id));
            appData.vehicles = getArray(appData.vehicles).filter(x=>String(x.id)!==String(id));
            saveDataToLocal().then(()=>partnerProfile(name));
        } return;
    }
    let msg = r && r.linkedId ? "⚠️ This is a TRANSFER entry. Deleting it will also reverse the amount from the other partner's account. Do you want to proceed?" : "Delete entry?";
    if(confirm(msg)) {
        if(r) { 
            appData.balances[name] -= (r.type==='income' ? r.amount : -r.amount); 
            appData.records[name] = getArray(appData.records[name]).filter(x=>String(x.id)!==String(id)); 
            if (r.linkedId) {
                let otherName = name === 'Tanmoy' ? 'Tapabrata' : 'Tanmoy';
                let lr = getArray(appData.records[otherName]).find(x=>String(x.id) === String(r.linkedId));
                if(lr) { appData.balances[otherName] -= (lr.type==='income' ? lr.amount : -lr.amount); appData.records[otherName] = getArray(appData.records[otherName]).filter(x=>String(x.id) !== String(r.linkedId)); }
            }
            saveDataToLocal().then(()=>partnerProfile(name)); 
        }
    }
}

function editEntry(id, type, name) {
    let r = getArray(appData.records[name]).find(x=>String(x.id)===String(id));
    if(r && r.isAuto && !r.linkedId) {
        alert("🚗 Taking you to the 'Vehicles' tab to edit this specific entry."); showVehicles(); setTimeout(() => { editVehicle(id); }, 150); return;
    }
    if(r && r.linkedId) return alert("⚠️ This is a 'Transfer' entry. It cannot be edited directly. Please DELETE it and create a new entry to keep both accounts balanced.");
    if(r) { 
        currentEditId = id; document.getElementById('entryDate').value = r.date; document.getElementById('entryDetails').value = r.details; document.getElementById('entryAmount').value = r.amount; 
        if(document.getElementById('entryBillNo')) document.getElementById('entryBillNo').value = r.billNo || '';
        setEntryType(type); let btn = document.getElementById('entrySaveBtn');
        if(btn) { btn.innerText = "✏️ Update Entry"; btn.style.background = "#f39c12"; } window.scrollTo({ top: 0, behavior: 'smooth' }); 
    }
}

function toggleRowCheck(row, event, type, id, name) {
    if(event.target.tagName === 'BUTTON' || event.target.tagName === 'A') return;
    let cell = row.querySelector('.recon-cell');
    if(cell) {
        let currentState = parseInt(cell.getAttribute('data-state') || '0'); let newState = (currentState + 1) % 3; 
        cell.setAttribute('data-state', newState); cell.innerText = newState === 1 ? '✅' : (newState === 2 ? '❌' : '⬜');
        if(newState === 1) row.style.setProperty('background-color', '#eefdf6', 'important'); 
        else if(newState === 2) row.style.setProperty('background-color', '#fadbd8', 'important'); 
        else row.style.removeProperty('background-color'); 
        calcGroupTotal(type);
        if(id && name && appData.records[name]) {
            let rIndex = appData.records[name].findIndex(x => String(x.id) === String(id));
            if(rIndex !== -1) { appData.records[name][rIndex].reconState = newState; db.ref('ServiceTracker/records/' + name + '/' + rIndex + '/reconState').set(newState); }
        }
    }
}

function toggleAllRows(type, name) {
    let tableId = type === 'inc' ? 'incTable' : (type === 'exp' ? 'expTable' : 'profTable');
    let table = document.getElementById(tableId); if(!table) return;
    let cells = table.querySelectorAll('.recon-cell'); let allGreen = true;
    cells.forEach(c => { if(parseInt(c.getAttribute('data-state')||'0') !== 1) allGreen = false; });
    let targetState = allGreen ? 0 : 1; let updates = {};
    cells.forEach(cell => {
        cell.setAttribute('data-state', targetState); cell.innerText = targetState === 1 ? '✅' : '⬜'; let row = cell.closest('tr');
        if(targetState === 1) row.style.setProperty('background-color', '#eefdf6', 'important'); else row.style.removeProperty('background-color');
        let id = cell.getAttribute('data-id');
        if(id && name && appData.records[name]) {
            let rIndex = appData.records[name].findIndex(x => String(x.id) === String(id));
            if(rIndex !== -1) { appData.records[name][rIndex].reconState = targetState; updates[rIndex + '/reconState'] = targetState; }
        }
    });
    calcGroupTotal(type); if(Object.keys(updates).length > 0) db.ref('ServiceTracker/records/' + name).update(updates);
}

function calcGroupTotal(type) {
    let tableId = type === 'inc' ? 'incTable' : (type === 'exp' ? 'expTable' : 'profTable');
    let table = document.getElementById(tableId); if(!table) return;
    let cells = table.querySelectorAll('.recon-cell'); let total = 0; let count = 0;
    cells.forEach(cell => { let state = parseInt(cell.getAttribute('data-state') || '0'); if(state === 1) { total += parseFloat(cell.getAttribute('data-amt')) || 0; count++; } });
    let badge = document.getElementById(type + 'GroupTotalBadge');
    if(badge) { if(count > 0) { badge.style.display = 'inline-block'; badge.innerText = 'Matched (' + count + '): ₹' + total.toLocaleString('en-IN'); } else { badge.style.display = 'none'; } }
}

    getArray(appData.vehicles).forEach(v => {

async function saveVehicle() {
    let date = document.getElementById('vDate').value, car = document.getElementById('vCar').value, category = document.getElementById('vCategory').value, details = document.getElementById('vDetails').value.trim(), amount = parseFloat(document.getElementById('vAmount').value), paidBy = document.getElementById('vPaidBy').value;
    let photoInput = document.getElementById('vPhoto'); let file = photoInput.files[0];
    if(isNaN(amount) || amount <= 0) return alert("Valid Amount is required!");
    if(file && !file.type.startsWith('image/')) return alert("⚠️ ERROR: Only image files are allowed!");
    let btn = document.getElementById('vSaveBtn'); let originalText = btn.innerText; btn.innerText = "⏳ Saving..."; btn.disabled = true;

    try {
        appData.vehicles = getArray(appData.vehicles); appData.records[paidBy] = getArray(appData.records[paidBy]);
        let photoUrl = currentVehicleEditId && appData.vehicles.find(v=>String(v.id)===String(currentVehicleEditId))?.photo ? appData.vehicles.find(v=>String(v.id)===String(currentVehicleEditId)).photo : '';
        if(file) { let b64 = await compressImage(file); photoUrl = await uploadToImgBB(b64); }
        let finalDetails = details || '-';
        
        let isDuplicateVeh = appData.vehicles.some(v => String(v.id) !== String(currentVehicleEditId) && v.date === date && v.amount === amount && v.car === car && v.category === category && (v.details || '-') === finalDetails);
        if(isDuplicateVeh) { btn.innerText = originalText; btn.disabled = false; return alert("❌ DUPLICATE ENTRY!\nThis exact vehicle expense has already been saved."); }

        let newEntry = { id: currentVehicleEditId || Date.now(), date, car, category, details: finalDetails, amount: amt, photo: photoUrl || '', paidBy };
        let partnerDesc = details ? `🚗 ${car} - ${category} (${details})` : `🚗 ${car} - ${category}`;

        if(currentVehicleEditId) {
            let oldV = appData.vehicles.find(v => String(v.id) === String(currentVehicleEditId));
            if(oldV) { appData.balances[oldV.paidBy] += oldV.amount; appData.records[oldV.paidBy] = getArray(appData.records[oldV.paidBy]).filter(r => String(r.id) !== String(currentVehicleEditId)); }
            let idx = appData.vehicles.findIndex(v => String(v.id) === String(currentVehicleEditId)); appData.vehicles[idx] = newEntry; currentVehicleEditId = null;
        } else { appData.vehicles.unshift(newEntry); }

        if(!appData.balances[paidBy]) appData.balances[paidBy] = 0;
        appData.balances[paidBy] -= amount;
        appData.records[paidBy].unshift({ id: newEntry.id, date: date, details: partnerDesc, amount: amount, type: 'expense', photo: photoUrl || '', link: '', isAuto: true, reconState: 0 });

        await saveDataToLocal(); showVehicles();
    } catch(e) { alert("Error saving."); btn.innerText = originalText; btn.disabled = false; }
}

function deleteVehicle(id) { 
    if(confirm("Are you sure you want to delete this vehicle expense?")) {

function numberToWords(num) {
    let a=['','ONE ','TWO ','THREE ','FOUR ','FIVE ','SIX ','SEVEN ','EIGHT ','NINE ','TEN ','ELEVEN ','TWELVE ','THIRTEEN ','FOURTEEN ','FIFTEEN ','SIXTEEN ','SEVENTEEN ','EIGHTEEN ','NINETEEN '];
    let b=['','','TWENTY ','THIRTY ','FORTY ','FIFTY ','SIXTY ','SEVENTY ','EIGHTY ','NINETY '];
    let n = parseInt(num, 10); if(n===0) return 'ZERO ONLY'; let nArray = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
    if(!nArray) return ''; let str='';
    str+=(nArray[1]!=0)?(a[Number(nArray[1])]||b[nArray[1][0]]+a[nArray[1][1]])+'CRORE ':''; str+=(nArray[2]!=0)?(a[Number(nArray[2])]||b[nArray[2][0]]+a[nArray[2][1]])+'LAKH ':''; str+=(nArray[3]!=0)?(a[Number(nArray[3])]||b[nArray[3][0]]+a[nArray[3][1]])+'THOUSAND ':''; str+=(nArray[4]!=0)?(a[Number(nArray[4])]||b[nArray[4][0]]+a[nArray[4][1]])+'HUNDRED ':''; str+=(nArray[5]!=0)?((str!='')?'& ':'')+(a[Number(nArray[5])]||b[nArray[5][0]]+a[nArray[5][1]])+'ONLY':'ONLY';
    return str;
}

function calcCF() {
    let p = document.getElementById('cfP').value;
    let monthInput = document.getElementById('cfM').value;
    let cutoffDate = (appData.config && appData.config.cfStartMonth) ? appData.config.cfStartMonth + '-01' : '2026-08-01';

    if (monthInput === "All Time") {
        let validNet = 0;
        getArray(appData.records[p]).forEach(r => {
            if(appData.config?.enablePastCF || (r.date && r.date >= cutoffDate)) {
                let amt = parseFloat(r.amount) || 0; validNet += (r.type === 'income') ? amt : -amt;
            }
        });
        document.getElementById('cfResult').innerText = "₹ " + validNet.toLocaleString('en-IN');
        return;
    }

    let m = monthInput.split(' '); let mIdx = ["January","February","March","April","May","June","July","August","September","October","November","December"].indexOf(m[0]);
    let endOfSelectedMonth = new Date(parseInt(m[1]), mIdx+1, 0, 23, 59, 59);
    
    let validPastNet = 0;
    getArray(appData.records[p]).forEach(r => {
        if(r.date) {
            let rParts = r.date.split('-');
            if(rParts.length === 3) {
                let rDate = new Date(parseInt(rParts[0]), parseInt(rParts[1])-1, parseInt(rParts[2]), 12, 0, 0);
                if(rDate <= endOfSelectedMonth) {
                    if(appData.config?.enablePastCF || r.date >= cutoffDate) {
                        let amt = parseFloat(r.amount) || 0; validPastNet += (r.type === 'income') ? amt : -amt;
                    }
                }
            }
        }
    });
    
    document.getElementById('cfResult').innerText = "₹ " + validPastNet.toLocaleString('en-IN');
}

    } else {
        let wJobs = getArray(appData.waterJobs);
        let rows = wJobs.map(j => `<tr><td>${j.customer}</td><td>${j.mobile}</td><td>${j.model}</td><td>${j.part}</td><td>${formatDate(j.date)}</td><td style="text-align:center;">${j.photo ? `<a href="${j.photo}" target="_blank" style="text-decoration:none; font-size:16px;">📷</a>` : '-'}</td><td style="white-space:nowrap;"><button onclick="editTechJob('${j.id}', 'water')" style="background:#f39c12; color:white; border:none; border-radius:4px; padding:4px 6px;">✏️</button><button onclick="deleteTechJob('${j.id}', 'water')" style="background:#e21d4f; color:white; border:none; border-radius:4px; padding:4px 6px; margin-left:4px;">🗑️</button></td></tr>`).join('');
        document.getElementById('techArea').innerHTML = `<div class="card"><h2>💧 Water Purifier Service</h2><label>Customer</label><input id="wCust"><label>Mobile</label><input id="wMob"><label>Model</label><input id="wModel"><label>Part Replaced</label><input id="wPart"><label>Photo</label><input id="wPhoto" type="file" accept="image/*"><label>Date</label><input type="date" id="wDate" value="${todayDate}"><button id="wSaveBtn" onclick="saveWaterJob()" style="width:100%;">Save Job</button></div><div class="card"><div style="overflow-x:auto;"><table><tr><th>Customer</th><th>Mobile</th><th>Model</th><th>Part</th><th>Date</th><th style="text-align:center;">Proof</th><th>Action</th></tr>${rows||'<tr><td colspan="7" style="text-align:center;">No jobs</td></tr>'}</table></div></div>`;
    }
}

function addPartRow(part='', serial='', photoB64='') {
    let container = document.getElementById('partsContainer'); let rowId = 'part-row-' + Date.now() + Math.floor(Math.random()*1000);
    let div = document.createElement('div'); div.id = rowId; div.className = 'part-row-box';
    div.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><b style="font-size:14px;">📦 Part Details</b><button type="button" onclick="document.getElementById('${rowId}').remove()" style="background:#e21d4f; color:white; border:none; border-radius:6px; padding:4px 8px; font-size:11px;">✖ Remove</button></div><label>Part Name</label><input class="p-name" value="${part}"><label>Serial</label><input class="p-serial" value="${serial}"><label>Barcode Photo</label><input type="hidden" class="p-hidden-b64" value="${photoB64}"><input type="file" class="p-photo" accept="image/*" onchange="handlePartImage(this, '${rowId}')">${photoB64?'<div style="font-size:11px;color:#07865b;">✓ Old Photo Attached</div>':''}<p class="scan-status" style="font-size:11px; display:none;"></p>`;
    container.appendChild(div);
}

async function saveComputerJob() {
    let loc = document.getElementById('cLoc').value.trim(), shop = document.getElementById('cShop').value.trim(), d = document.getElementById('cDate').value, rem = document.getElementById('cRemarks').value.trim();
    if(!loc) return alert("Location is required!");
    let btn = document.getElementById('cSaveBtn'); let orig=btn.innerText; btn.innerText="⏳ Saving..."; btn.disabled=true;
    appData.computerJobs = getArray(appData.computerJobs);
    let partsList = []; let boxes = document.querySelectorAll('.part-row-box');
    for(let i=0; i<boxes.length; i++) {
        let n = boxes[i].querySelector('.p-name').value.trim(), s = boxes[i].querySelector('.p-serial').value.trim(), h = boxes[i].querySelector('.p-hidden-b64').value;
        let u = h; if(h.startsWith('data:image')) u = await uploadToImgBB(h);
        if(n) partsList.push({part:n, serial:s, photo:u});
    }
    if(!partsList.length) { btn.innerText=orig; btn.disabled=false; return alert("Add at least 1 part!"); }
    let j = { id: currentTechEditId||Date.now(), location:loc, shop, date:d, remarks:rem, parts:partsList };
    if(currentTechEditId) { let idx=appData.computerJobs.findIndex(x=>String(x.id)===String(currentTechEditId)); appData.computerJobs[idx]=j; currentTechEditId=null; } else appData.computerJobs.unshift(j);
    await saveDataToLocal(); tech('computer');
}

async function saveWaterJob() {
    let c = document.getElementById('wCust').value.trim(), m = document.getElementById('wMob').value.trim(), mod = document.getElementById('wModel').value.trim(), p = document.getElementById('wPart').value.trim(), d = document.getElementById('wDate').value, file = document.getElementById('wPhoto').files[0];
    if(!c || !m) return alert("Customer and Mobile Number are required!");
    if(file && !file.type.startsWith('image/')) return alert("Upload Image only!");
    let btn = document.getElementById('wSaveBtn'); let orig=btn.innerText; btn.innerText="⏳ Saving..."; btn.disabled=true;
    appData.waterJobs = getArray(appData.waterJobs);
    let url = currentTechEditId && appData.waterJobs.find(x=>String(x.id)===String(currentTechEditId))?.photo ? appData.waterJobs.find(x=>String(x.id)===String(currentTechEditId)).photo : ''; 
    if(file){ let b64 = await compressImage(file); url = await uploadToImgBB(b64); }
    let j = { id: currentTechEditId||Date.now(), customer:c, mobile:m, model:mod, part:p, date:d, photo:url };
    if(currentTechEditId) { let idx=appData.waterJobs.findIndex(x=>String(x.id)===String(currentTechEditId)); appData.waterJobs[idx]=j; currentTechEditId=null; currentTechEditPhoto=''; } else appData.waterJobs.unshift(j);
    await saveDataToLocal(); tech('water');
}

function deleteTechJob(id, t) { if(confirm("Are you sure you want to delete this job?")){ t==='computer'?appData.computerJobs=getArray(appData.computerJobs).filter(x=>String(x.id)!==String(id)):appData.waterJobs=getArray(appData.waterJobs).filter(x=>String(x.id)!==String(id)); saveDataToLocal().then(()=>tech(t)); } }
function editTechJob(id, t) {
    let arr = t==='computer'?getArray(appData.computerJobs):getArray(appData.waterJobs); let j = arr.find(x=>String(x.id)===String(id)); if(!j)return;
    currentTechEditId = id;
    if(t==='computer') {
        document.getElementById('cLoc').value=j.location; document.getElementById('cShop').value=j.shop; document.getElementById('cDate').value=j.date; document.getElementById('cRemarks').value=j.remarks; document.getElementById('partsContainer').innerHTML=''; getArray(j.parts).forEach(p=>addPartRow(p.part, p.serial, p.photo));
        let btn = document.getElementById('cSaveBtn'); if(btn) { btn.innerText="✏️ Update Job"; btn.style.background="#f39c12"; }
    } else {
        document.getElementById('wCust').value=j.customer; document.getElementById('wMob').value=j.mobile; document.getElementById('wModel').value=j.model; document.getElementById('wPart').value=j.part; document.getElementById('wDate').value=j.date; currentTechEditPhoto=j.photo;
        let btn = document.getElementById('wSaveBtn'); if(btn) { btn.innerText="✏️ Update Job"; btn.style.background="#f39c12"; }
    }
    window.scrollTo({top:0, behavior:'smooth'});
}
</script>
